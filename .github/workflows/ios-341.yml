name: Build CloudCord iOS 344.1

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ios-341.yml"
      - "ios/native-ios/**"
      - "ios/scripts/package-cloudcord-ipa.py"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install ldid
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

      - name: Download private Discord 344.1 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ios-base-344 \
            --repo xohus/cloudcord \
            --pattern Discord-344.1-base.ipa \
            --output Discord-344.1-base.ipa

      - name: Build sideload runtime
        working-directory: ios/native-ios
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          sed -i '' 's/^BUNDLE_NAME = CloudCordResources$/BUNDLE_NAME = BunnyResources/' Makefile
          sed -i '' 's/^TWEAK_NAME = CloudCordTweak$/LIBRARY_NAME = CloudCordTweak/' Makefile
          sed -i '' 's#$(THEOS_MAKE_PATH)/tweak.mk#$(THEOS_MAKE_PATH)/library.mk#' Makefile
          python3 - <<'PY'
          from pathlib import Path
          source = Path("Sources/Sideloading.x")
          text = source.read_text()
          text = text.replace(
              "NSMutableDictionary *info    = [%orig mutableCopy];",
              "NSDictionary *originalInfo = %orig;\n    NSMutableDictionary *info = [originalInfo mutableCopy];",
          )
          source.write_text(text)
          PY
          cat > Sources/SubstrateCompat.m <<'OBJC'
          #import <objc/runtime.h>
          void MSHookMessageEx(Class targetClass, SEL selector, IMP replacement, IMP *original) {
              Method method = class_getInstanceMethod(targetClass, selector);
              if (!method) return;
              IMP previous = method_getImplementation(method);
              if (original) *original = previous;
              method_setImplementation(method, replacement);
          }
          OBJC
          make package FINALPACKAGE=1 CLOUDCORD_SAFE_UI=1

      - name: Package Discord 344.1 IPA
        run: |
          python3 ios/scripts/package-cloudcord-ipa.py \
            --discord-ipa Discord-344.1-base.ipa \
            --discord-version 344.1 \
            --runtime-deb "$(find ios/native-ios/packages -name '*.deb' -print -quit)" \
            --output cloudcord0.ipa
          unzip -p cloudcord0.ipa Payload/Discord.app/Info.plist | grep -q '<string>344.1</string>'
          unzip -p cloudcord0.ipa Payload/Discord.app/BunnyResources.bundle/payload-base.js | grep -q '__PYON_LOADER__'
          unzip -p cloudcord0.ipa Payload/Discord.app/BunnyResources.bundle/payload-base.js | grep -q 'loaderName:"CloudCord"'
          unzip -p cloudcord0.ipa Payload/Discord.app/BunnyResources.bundle/runtime.js | grep -q 'UserProfileStore'
          unzip -p cloudcord0.ipa Payload/Discord.app/BunnyResources.bundle/runtime.js | grep -q 'useBadges'
          unzip -p cloudcord0.ipa Payload/Discord.app/BunnyResources.bundle/runtime.js | grep -q 'getCurrentUser'
          unzip -l cloudcord0.ipa | grep -q 'Payload/Discord.app/PlugIns/BroadcastUpload.appex/BroadcastUpload'
          rm -rf "$RUNNER_TEMP/cloudcord-stream-check"
          unzip -q cloudcord0.ipa -d "$RUNNER_TEMP/cloudcord-stream-check"
          ldid -e "$RUNNER_TEMP/cloudcord-stream-check/Payload/Discord.app/PlugIns/BroadcastUpload.appex/BroadcastUpload" \
            | grep -q 'application-groups'
          otool -L "$RUNNER_TEMP/cloudcord-stream-check/Payload/Discord.app/Discord" \
            | grep -q '@executable_path/Frameworks/CloudCordTweak.dylib'
          otool -L "$RUNNER_TEMP/cloudcord-stream-check/Payload/Discord.app/Discord" \
            | grep -q '@rpath/hermesvm.framework/hermesvm'
          if otool -L "$RUNNER_TEMP/cloudcord-stream-check/Payload/Discord.app/Frameworks/CloudCordTweak.dylib" \
            | grep -qi 'CydiaSubstrate'; then
            echo 'CloudCordTweak unexpectedly depends on CydiaSubstrate' >&2
            exit 1
          fi
          if strings "$RUNNER_TEMP/cloudcord-stream-check/Payload/Discord.app/Frameworks/CloudCordTweak.dylib" \
            | grep -Eq 'UIKeyboardDockView|TUIPredictionView|TUIEmojiSearchInputView|DCDThemeColor|fontWithName:size:'; then
            echo 'Discord 344 build still contains incompatible native UI hooks' >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: CloudCord-iOS-344.1
          path: cloudcord0.ipa

      - name: Publish CloudCord iOS download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: new_beta
          name: CloudCord iOS Beta
          prerelease: true
          make_latest: false
          files: cloudcord0.ipa
