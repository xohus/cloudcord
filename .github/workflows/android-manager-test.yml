name: CloudCord Manager Preview
# Isolated tester build; never publishes over the production Android release.
on:
  push:
    branches: [xohus/rain-manager-test]
    paths: ['android-manager-test/**', '.github/workflows/android-manager-test.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore persistent Manager signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.CLOUDCORD_MANAGER_KEYSTORE }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ.get("KEYSTORE_BASE64", "")
          if not value:
              raise SystemExit("Persistent Manager signing key is missing; refusing to publish with a random debug key")
          target = Path(os.environ["RUNNER_TEMP"]) / "cloudcord-manager.p12"
          target.write_bytes(base64.b64decode(value, validate=True))
          target.chmod(0o600)
          PY
      - name: Download the verified Android loader
        uses: actions/download-artifact@v4
        with:
          name: CloudCord-Android-loader
          run-id: 42046511473
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/cloudcord-loader
      - name: Prepare CloudCord branding and pinned module
        run: |
          set -euo pipefail
          node android-manager-test/prepare-cloudcord.cjs
          module="$RUNNER_TEMP/cloudcord-loader/cloudcord-module.apk"
          echo "e6ec785d4625f566816188193991cc21d733a7608191336b20fb6d21ae704fea  $module" | sha256sum --check
          unzip -p "$module" assets/revenge.bundle | sha256sum | grep -q '^8107d78e8c2c7e7b634ed20960e0598abfe09b6276aac10a0e1996a4af4fca9c  '
          mkdir -p android-manager-test/app/src/main/assets
          unzip -p "$module" assets/xposed_init > "$RUNNER_TEMP/cloudcord-xposed-init"
          test -s "$RUNNER_TEMP/cloudcord-xposed-init"
          cp "$module" android-manager-test/app/src/main/assets/cloudcord-module.apk
      - name: Build experimental Manager
        working-directory: android-manager-test
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/cloudcord-manager.p12
          SIGNING_STORE_PASSWORD: ${{ secrets.CLOUDCORD_MANAGER_KEY_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.CLOUDCORD_MANAGER_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: cloudcord-manager
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify persistent signing certificate
        run: |
          set -euo pipefail
          apk="$(find android-manager-test/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$signer" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/manager-signature.txt"
          grep -Eq '^(Signer #[0-9]+|V[0-9.]+ Signer):? certificate SHA-256 digest: 6838080fe39db6c2506b8cc25bd8f488be2cf45f62a52766d334f0fe908666e7$' "$RUNNER_TEMP/manager-signature.txt"
          "$(dirname "$signer")/aapt" dump badging "$apk" | tee "$RUNNER_TEMP/manager-package.txt"
          grep -q "^package: name='com.getcloudcord.manager' " "$RUNNER_TEMP/manager-package.txt"
      - name: Upload regression test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CloudCordManager-test-results
          path: android-manager-test/app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
      - name: Upload tester APK and source notices
        uses: actions/upload-artifact@v4
        with:
          name: CloudCordManager-test
          if-no-files-found: error
          path: |
            android-manager-test/app/build/outputs/apk/debug/*.apk
            android-manager-test/LICENSE
            android-manager-test/CLOUDCORD-MODIFICATIONS.md
