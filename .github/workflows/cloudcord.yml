          def brand_strings(value):
              if isinstance(value, str):
                  return brand_names.sub("CloudCord", value)
              if isinstance(value, dict):
                  return {key: brand_strings(item) for key, item in value.items()}
              if isinstance(value, list):
                  return [brand_strings(item) for item in value]
