                                  break;
                              }
                          }
                          await new Promise(resolve => setTimeout(resolve, 1200));
                      }
                  } finally { leavingServers = false; }
                  showToast("Left " + left + " of " + guilds.length + " servers.");
              };
              Alert.alert("Leave all servers?", "You will leave " + guilds.length + " servers. Servers you own are skipped. You'll need new invites to rejoin.", [
                  { text: "Cancel", style: "cancel" },
                  { text: "Leave all", style: "destructive", onPress: () => Alert.alert("Are you sure?", "Last chance to cancel.", [{ text: "Cancel", style: "cancel" }, { text: "Yes, leave them all", style: "destructive", onPress: () => void run() }]) }
