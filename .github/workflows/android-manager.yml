name: Build CloudCord Android Manager

"on":
  workflow_dispatch:
  workflow_run:
    workflows: ["Build CloudCord Runtime"]
    types: [completed]
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "ios/runtime/**"
      - "dist/cc.js"
      - ".github/workflows/android-manager.yml"

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CloudCord
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download the completed runtime build
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: cloudcord-mobile-shared-runtime
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/cloudcord-runtime

      - name: Verify runtime for the Android loader
        env:
          EXPECTED_RUNTIME_SOURCE: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$EXPECTED_RUNTIME_SOURCE" ]; then
            python3 ios/scripts/verify-runtime-artifact.py "$RUNNER_TEMP/cloudcord-runtime/dist"
            cp "$RUNNER_TEMP/cloudcord-runtime/dist/cc.js" dist/cc.js
          else
            python3 ios/scripts/verify-runtime-artifact.py dist
          fi

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android 36 SDK is installed
        run: |
          set -euo pipefail
          sdkmanager_bin="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager_bin" ]; then
            sdkmanager_bin="$(command -v sdkmanager)"
          fi
          set +o pipefail
          yes | "$sdkmanager_bin" --licenses >/dev/null 2>&1 || true
          set -o pipefail
          "$sdkmanager_bin" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Clone KettuXposed module
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            rm -rf _kettu_xposed
            if git clone https://github.com/C0C0B01/KettuXposed.git _kettu_xposed; then
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "KettuXposed clone failed after 5 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          git -C _kettu_xposed checkout 8e3c4a9b655af5ec2a56ab6e7cd9cefa9b4fb78d
          sed -i '/^org\.gradle\.java\.home=/d' _kettu_xposed/gradle.properties
          python3 android/scripts/patch-cloudcord-identity.py _kettu_xposed
          python3 android/scripts/patch-activity-hook.py _kettu_xposed/app/src/main/kotlin/io/github/revenge/xposed/Main.kt
          python3 android/scripts/patch-script-discovery.py _kettu_xposed/app/src/main/kotlin/io/github/revenge/xposed/modules/HookScriptLoaderModule.kt
          python3 android/scripts/patch-appearance-hooks.py _kettu_xposed

      - name: Validate Discord 352+ loader hooks
        run: |
          set -euo pipefail
          grep -F -q 'LOADER_NAME = "CloudCord"' _kettu_xposed/app/src/main/kotlin/io/github/revenge/xposed/Constants.kt
          grep -F -q '<string name="app_name">CloudCord</string>' _kettu_xposed/app/src/main/res/values/strings.xml
          grep -F -q 'inject CloudCord into Discord' _kettu_xposed/app/src/main/AndroidManifest.xml
          grep -F -q 'text = "CloudCord Recovery"' _kettu_xposed/app/src/main/kotlin/io/github/revenge/xposed/modules/LogBoxModule.kt
          grep -F -q '__CLOUDCORD_RUNTIME_REVISION__' dist/cc.js
          grep -R -F -q 'org.chromium.net.j' _kettu_xposed/app/src/main
          grep -R -F -q 'ReactInstance\$loadJSBundle$1' _kettu_xposed/app/src/main
          grep -R -F -q 'loadScriptFromAssets' _kettu_xposed/app/src/main
          grep -R -F -q 'loadScriptFromFile' _kettu_xposed/app/src/main
          if grep -R -F -q 'ScriptLoaderDiscovery' _kettu_xposed/app/src/main; then
            echo "Synchronous DEX scanning must not run during Discord startup" >&2
            exit 1
          fi

      - name: Validate Discord 352+ font and theme hooks
        run: |
          set -euo pipefail
          grep -F -q 'safeLoadClass("il.c")' _kettu_xposed/app/src/main/kotlin/io/github/revenge/xposed/modules/appearance/FontsModule.kt
          grep -F -q 'safeLoadClass("vh.c")' _kettu_xposed/app/src/main/kotlin/io/github/revenge/xposed/modules/appearance/ThemesModule.kt
          grep -F -q 'ThemeModule\$Dark' _kettu_xposed/app/src/main/kotlin/io/github/revenge/xposed/modules/appearance/ThemesModule.kt

      - name: Install safe CloudCord runtime updater
        run: |
          set -euo pipefail
          cd _kettu_xposed
          python3 - <<'PY'
          from pathlib import Path
          updater = Path("app/src/main/kotlin/io/github/revenge/xposed/modules/UpdaterModule.kt")
          if not updater.exists():
              raise SystemExit("KettuXposed UpdaterModule.kt was not found")
          updater.write_bytes(Path("../android/scripts/UpdaterModule.kt").read_bytes())
          text = updater.read_text(encoding="utf-8")
          required = ["DEFAULT_MANIFEST_URL", "RuntimeManifest", "MessageDigest", "Runtime SHA-256 does not match manifest", "AtomicFile(bundle)"]
          if not all(value in text for value in required):
              raise SystemExit("Safe CloudCord updater validation failed")
          print("Installed checksum-verified CloudCord updater")
          PY

      - name: Keep downloads outside the Android startup hook
        run: |
          python3 android/scripts/prepare-xposed-startup.py _kettu_xposed/app/src/main/kotlin/io/github/revenge/xposed/modules/HookScriptLoaderModule.kt
          mkdir -p _kettu_xposed/app/src/main/assets
          cp dist/cc.js _kettu_xposed/app/src/main/assets/revenge.bundle

      - name: Build KettuXposed module
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_21_X64:-$JAVA_HOME}"
          export PATH="$JAVA_HOME/bin:$PATH"
          cd _kettu_xposed
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug

      - name: Bundle module into manager assets
        run: |
          set -euo pipefail
          module_apk="$(find _kettu_xposed/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1 || true)"
          if [ -z "$module_apk" ]; then
            echo "KettuXposed debug APK was not found under _kettu_xposed/app/build/outputs/apk/debug" >&2
            find _kettu_xposed/app/build/outputs -type f >&2 || true
            exit 1
          fi
          mkdir -p android/app/src/main/assets
          cp "$module_apk" android/app/src/main/assets/cloudcord-module.apk
          test -s android/app/src/main/assets/cloudcord-module.apk
          cmp dist/cc.js <(unzip -p "$module_apk" assets/revenge.bundle)

      - name: Upload verified Android loader
        uses: actions/upload-artifact@v4
        with:
          name: CloudCord-Android-loader
          path: android/app/src/main/assets/cloudcord-module.apk
          if-no-files-found: error

      - name: Check Android network regression guards
        run: node android/scripts/test-network-regressions.cjs

      - name: Check CloudCord Android branding
        run: node android/scripts/test-branding.cjs

      - name: Check installer input guards
        run: node android/scripts/test-installer-input-guards.cjs

      - name: Build CloudCord Manager
        id: manager_build
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_21_X64:-$JAVA_HOME}"
          export PATH="$JAVA_HOME/bin:$PATH"
          cd android
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudCordManager-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload installer test results
        if: always() && (steps.manager_build.outcome == 'success' || steps.manager_build.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: CloudCordManager-test-results
          path: android/app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
