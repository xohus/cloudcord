          function DurationSelect({ label, value, onPress }: { label: string; value: number; onPress: () => void }) {
              return (
                  <Pressable onPress={onPress} style={({ pressed }) => ({ width: "100%", minHeight: 58, flexDirection: "row", alignItems: "center", paddingHorizontal: 12, paddingVertical: 10, borderRadius: 11, backgroundColor: pressed ? "rgba(120,231,255,0.16)" : "rgba(255,255,255,0.04)" })}>
                      <View style={{ flex: 1, minWidth: 0, paddingRight: 12 }}>
                          <Text variant="text-sm/bold" style={{ color: "#50fa9b" }}>{label}</Text>
                          <Text variant="text-xs/medium" color="text-muted" style={{ marginTop: 3 }}>Profile appearance</Text>
                      </View>
                      <View style={{ maxWidth: "48%", flexDirection: "row", alignItems: "center", gap: 7, paddingHorizontal: 10, paddingVertical: 7, borderRadius: 9, backgroundColor: "#243c46" }}>
                          <Text variant="text-xs/bold" style={{ color: "#78e7ff" }} numberOfLines={1}>{label === "Nitro badge" ? NITRO_LABELS.get(value) : label.includes("booster") ? boosterLabel(value) : durationLabel(value)}</Text>
                          <Text variant="text-sm/bold" style={{ color: "#78e7ff" }}>v</Text>
                      </View>
                  </Pressable>
              );
          }

          const PROFILE_COLORS = [
              "#5865F2", "#4752C4", "#57F287", "#FEE75C", "#EB459E", "#ED4245",
              "#FFFFFF", "#B5BAC1", "#80848E", "#2B2D31", "#1E1F22", "#000000",
              "#00A8FC", "#00D4AA", "#9B59B6", "#E67E22", "#E91E63", "#607D8B"
          ];

          function hsvToHex(hue: number, saturation: number, brightness: number) {
              const s = saturation / 100;
              const v = brightness / 100;
              const chroma = v * s;
              const x = chroma * (1 - Math.abs((hue / 60) % 2 - 1));
              const match = v - chroma;
              const [r, g, b] = hue < 60 ? [chroma, x, 0] : hue < 120 ? [x, chroma, 0] : hue < 180 ? [0, chroma, x] : hue < 240 ? [0, x, chroma] : hue < 300 ? [x, 0, chroma] : [chroma, 0, x];
              return `#${[r, g, b].map(channel => Math.round((channel + match) * 255).toString(16).padStart(2, "0")).join("").toUpperCase()}`;
          }

          function hexToHsv(value: string) {
              const number = colorNumber(value) ?? 0x5865F2;
              const r = ((number >> 16) & 255) / 255;
              const g = ((number >> 8) & 255) / 255;
              const b = (number & 255) / 255;
              const max = Math.max(r, g, b), min = Math.min(r, g, b), delta = max - min;
              let hue = 0;
              if (delta) hue = max === r ? 60 * (((g - b) / delta) % 6) : max === g ? 60 * ((b - r) / delta + 2) : 60 * ((r - g) / delta + 4);
              if (hue < 0) hue += 360;
              return { hue, saturation: max ? delta / max * 100 : 0, brightness: max * 100 };
          }

          function ColorPickerRow({ label, value, onSelect, onOpen }: { label: string; value: string; onSelect: (color: string) => void; onOpen: () => void }) {
              return (
                  <View style={{ gap: 8 }}>
                      <Text variant="text-sm/bold" color="text-normal">{label}</Text>
                      <View style={{ flexDirection: "row", flexWrap: "wrap", gap: 9 }}>
                          {PROFILE_COLORS.map(color => (
                              <Pressable key={color} accessibilityLabel={`${label} ${color}`} onPress={() => onSelect(color)} style={({ pressed }) => ({ width: 34, height: 34, borderRadius: 17, backgroundColor: color, borderWidth: value.toUpperCase() === color ? 3 : 1, borderColor: value.toUpperCase() === color ? "#ffffff" : "rgba(255,255,255,0.25)", opacity: pressed ? 0.65 : 1 })} />
                          ))}
                      </View>
                      <ActionButton label="Open custom color picker" muted onPress={onOpen} />
                      <TextInput value={value} placeholder="#5865F2" placeholderTextColor="#777" autoCapitalize="characters" autoCorrect={false} onChangeText={onSelect} style={{ color: "#fff", backgroundColor: value || "#1f2023", borderRadius: 9, padding: 12 }} />
                  </View>
              );
          }

          function CustomColorPicker({ title, initialColor, onApply }: { title: string; initialColor: string; onApply: (color: string) => void }) {
              const initial = hexToHsv(initialColor);
              const [hue, setHue] = useState(initial.hue);
              const [saturation, setSaturation] = useState(initial.saturation);
              const [brightness, setBrightness] = useState(initial.brightness);
              const [color, setColor] = useState(hsvToHex(initial.hue, initial.saturation, initial.brightness));
              const [squareSize, setSquareSize] = useState({ width: 1, height: 1 });
              const [hueWidth, setHueWidth] = useState(1);
              const validColor = colorNumber(color) != null ? color : "#5865F2";
              const syncHsv = (nextHue: number, nextSaturation: number, nextBrightness: number) => {
                  setHue(nextHue); setSaturation(nextSaturation); setBrightness(nextBrightness);
                  setColor(hsvToHex(nextHue, nextSaturation, nextBrightness));
              };
              const pickSquare = (event: any) => syncHsv(hue, Math.max(0, Math.min(100, event.nativeEvent.locationX / squareSize.width * 100)), Math.max(0, Math.min(100, 100 - event.nativeEvent.locationY / squareSize.height * 100)));
              const pickHue = (event: any) => syncHsv(Math.max(0, Math.min(359, event.nativeEvent.locationX / hueWidth * 360)), saturation, brightness);
              const changeHex = (next: string) => {
                  setColor(next);
                  if (colorNumber(next) != null) {
                      const hsv = hexToHsv(next);
                      setHue(hsv.hue); setSaturation(hsv.saturation); setBrightness(hsv.brightness);
                  }
              };
              const hueColor = hsvToHex(hue, 100, 100);
              return (
                  <ScrollView contentContainerStyle={{ padding: 16, paddingBottom: 100, gap: 16 }} keyboardShouldPersistTaps="handled">
                      <Text variant="heading-lg/semibold" color="text-normal">{title}</Text>
                      <View style={{ height: 96, borderRadius: 16, backgroundColor: validColor, borderWidth: 2, borderColor: "rgba(255,255,255,0.35)", alignItems: "center", justifyContent: "center" }}>
                          <Text variant="heading-md/bold" style={{ color: "#ffffff", textShadowColor: "#000000", textShadowRadius: 4 }}>{validColor.toUpperCase()}</Text>
                      </View>
                      <View onLayout={event => setSquareSize(event.nativeEvent.layout)} onStartShouldSetResponder={() => true} onMoveShouldSetResponder={() => true} onResponderGrant={pickSquare} onResponderMove={pickSquare} style={{ width: "100%", aspectRatio: 1, maxHeight: 360, borderRadius: 12, overflow: "hidden", backgroundColor: hueColor }}>
                          {LinearGradient ? <LinearGradient colors={["#FFFFFF", hueColor]} start={{ x: 0, y: 0 }} end={{ x: 1, y: 0 }} style={{ position: "absolute", top: 0, right: 0, bottom: 0, left: 0 }} /> : null}
                          {LinearGradient ? <LinearGradient colors={["transparent", "#000000"]} start={{ x: 0, y: 0 }} end={{ x: 0, y: 1 }} style={{ position: "absolute", top: 0, right: 0, bottom: 0, left: 0 }} /> : null}
                          <View pointerEvents="none" style={{ position: "absolute", left: `${saturation}%`, top: `${100 - brightness}%`, width: 22, height: 22, marginLeft: -11, marginTop: -11, borderRadius: 11, borderWidth: 3, borderColor: "#FFFFFF", backgroundColor: "transparent" }} />
                      </View>
                      <View onLayout={event => setHueWidth(event.nativeEvent.layout.width)} onStartShouldSetResponder={() => true} onMoveShouldSetResponder={() => true} onResponderGrant={pickHue} onResponderMove={pickHue} style={{ height: 42, borderRadius: 10, overflow: "hidden" }}>
                          {LinearGradient ? <LinearGradient colors={["#FF0000", "#FFFF00", "#00FF00", "#00FFFF", "#0000FF", "#FF00FF", "#FF0000"]} start={{ x: 0, y: 0 }} end={{ x: 1, y: 0 }} style={{ position: "absolute", top: 0, right: 0, bottom: 0, left: 0 }} /> : <View style={{ flex: 1, backgroundColor: hueColor }} />}
                          <View pointerEvents="none" style={{ position: "absolute", left: `${hue / 3.6}%`, top: 0, bottom: 0, width: 6, marginLeft: -3, borderWidth: 2, borderColor: "#FFFFFF", borderRadius: 3 }} />
                      </View>
                      <View style={{ gap: 8 }}>
                          <Text variant="text-sm/bold" color="text-normal">Exact hex color</Text>
                          <TextInput value={color} placeholder="#5865F2" placeholderTextColor="#777" autoCapitalize="characters" autoCorrect={false} maxLength={7} onChangeText={changeHex} style={{ color: "#fff", backgroundColor: "#1f2023", borderRadius: 9, padding: 12 }} />
                      </View>
                      <ActionButton label="Apply color" onPress={() => colorNumber(color) != null && onApply(color.toUpperCase())} />
                  </ScrollView>
              );
          }

          function DecorationGallery({ onSelect }: { onSelect: (item: { asset: string; skuId: string; uri: string }) => void }) {
              const [items, setItems] = useState<Array<{ asset: string; skuId: string; label: string; uri: string }>>([]);
              const [loading, setLoading] = useState(true);
              useEffect(() => {
                  let active = true;
                  void findDecorationCatalog().then(result => { if (active) { setItems(result); setLoading(false); } });
                  const timer = setTimeout(() => void findDecorationCatalog().then(result => { if (active) { setItems(result); setLoading(false); } }), 1200);
                  return () => { active = false; clearTimeout(timer); };
              }, []);
              return (
                  <ScrollView contentContainerStyle={{ padding: 12, paddingBottom: 100 }}>
                      {items.length ? (
                          <View style={{ flexDirection: "row", flexWrap: "wrap", gap: 10 }}>
                              {items.map(item => (
                                  <Pressable key={`${item.asset}:${item.skuId}`} onPress={() => onSelect(item)} style={({ pressed }) => ({ width: "31%", minWidth: 96, padding: 8, borderRadius: 12, alignItems: "center", gap: 6, backgroundColor: "rgba(255,255,255,0.05)", opacity: pressed ? 0.65 : 1 })}>
