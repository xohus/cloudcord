              }
              return `${months} ${months === 1 ? "month" : "months"}`;
          }

          function boosterLabel(months: number) {
              if (!months) return "None";
              return `${months} ${months === 1 ? "Month" : "Months"}`;
          }

          function milestoneIcon(months: number, values: Array<[number, string]>) {
              return values.find(([minimum]) => months >= minimum)?.[1] || "";
          }

          function colorNumber(value: string) {
