                          {link ? <Button text="Copy" variant="secondary" size="sm" onPress={() => { try { (findByProps("setString", "getString") as any)?.setString?.(link); showToast("Copied gift link."); } catch { Alert.alert("Gift link", link); } }} /> : null}
