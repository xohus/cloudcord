              [9, "https://cdn.discordapp.com/badge-icons/996b3e870e8a22ce519b3a50e6bdd52f.png"],
              [6, "https://cdn.discordapp.com/badge-icons/df199d2050d3ed4ebf84d64ae83989f8.png"],
              [3, "https://cdn.discordapp.com/badge-icons/72bed924410c304dbe3d00a6e593ff59.png"],
              [2, "https://cdn.discordapp.com/badge-icons/0e4080d1d333bc7ad29ef6528b6f2fb7.png"],
              [1, "https://cdn.discordapp.com/badge-icons/51040c70d4f20a921ad6674ff86fc95c.png"]
          ];
          const BOOST_ICON_BY_MONTHS = new Map(BOOST_ICONS);

          const rootSettings = settings as any;
          const defaultPreview = (): PreviewSettings => ({
              enabled: false,
              displayName: "Preview Name",
              username: "preview",
              avatarMedia: null,
              bannerMedia: null,
              nitroEnabled: false,
              nitroMonths: 0,
              boostMonths: 0,
              giftLevel: -1,
              avatarDecoration: "",
              avatarDecorationSku: "",
              profileColorsEnabled: false,
              primaryColor: "#5865F2",
              accentColor: "#EB459E",
              bio: "",
              pronouns: "",
              createdAt: "",
              signupDate: "",
              oldName: "",
              replaceBadges: false,
              selectedBadges: {},
              hiddenBadgeIds: [],
              badgeOrder: [],
              syncRevision: 0
          });

          let preview = defaultPreview();
          let configReady = false;
          let initPromise: Promise<void> | null = null;
          let realCordSyncTimer: ReturnType<typeof setInterval> | null = null;
          const realCordManagedPlugins = new Set<string>();
          let realCordConfigFingerprint = "";

          const REALCORD_NITRO_MONTHS: Record<string, number> = {
              bronze: 1, silver: 3, gold: 6, platinum: 12,
              diamond: 24, emerald: 36, ruby: 60, opal: 72
          };

          async function pullRealCordConfiguration() {
              if ((globalThis as any).__CLOUDCORD_LOADER__?.loaderName !== "RealCord") return;
              const reader = NativeModules.FileReaderModule ?? NativeModules.RCTFileReaderModule;
              if (typeof reader?.readAsDataURL !== "function") return;
              try {
                  const response = await reader.readAsDataURL({ rain: { method: "realcord.config", args: [] } });
                  const config = response?.result;
                  if (!config || typeof config !== "object") return;
                  const fingerprint = `${JSON.stringify(config)}:${registeredPlugins.size}`;
                  if (fingerprint === realCordConfigFingerprint) return;
                  realCordConfigFingerprint = fingerprint;
                  const username = String(config.customUsername || "").trim();
                  const displayName = String(config.customDisplayName || "").trim();
                  const tier = String(config.nitroTier || "").toLowerCase();
                  const requestedPlugins = new Set(
                      (Array.isArray(config.enabledPlugins) ? config.enabledPlugins : [])
                          .map((value: unknown) => String(value).toLowerCase().replace(/[^a-z0-9]/g, ""))
                  );
                  const next = {
                      ...preview,
                      enabled: Boolean(username || displayName || REALCORD_NITRO_MONTHS[tier]),
                      username: username || preview.username,
                      displayName: displayName || preview.displayName,
                      nitroEnabled: Boolean(REALCORD_NITRO_MONTHS[tier]),
                      nitroMonths: REALCORD_NITRO_MONTHS[tier] || 0,
                      replaceBadges: true
                  } satisfies PreviewSettings;
                  if (JSON.stringify(next) !== JSON.stringify(preview)) {
                      rootSettings.fakeProfile = next;
                      preview = next;
                      refreshPreview();
                  }

                  for (const [id, manifest] of registeredPlugins) {
                      if (id === "bunny.messagefix") {
                          if (isPluginEnabled(id)) disablePlugin(id);
                          realCordManagedPlugins.delete(id);
                          continue;
                      }
                      const normalizedId = id.toLowerCase().replace(/[^a-z0-9]/g, "");
                      const normalizedName = String((manifest as any)?.display?.name || (manifest as any)?.name || "").toLowerCase().replace(/[^a-z0-9]/g, "");
                      const requested = requestedPlugins.has(normalizedId) || requestedPlugins.has(normalizedName);
                      try {
                          if (requested) {
                              if (!isPluginInstalled(id)) await installPlugin(id, true);
                              else if (!isPluginEnabled(id)) await enablePlugin(id, true);
                              realCordManagedPlugins.add(id);
                          } else if (realCordManagedPlugins.has(id) && isPluginEnabled(id)) {
                              disablePlugin(id);
                              realCordManagedPlugins.delete(id);
                          }
                      } catch (error) {
                          console.warn(`[RealCord] Could not apply mobile plugin ${id}`, error);
                      }
                  }
              } catch (error: any) {
                  diagnostics.last = error?.message || "Could not read RealCord profile configuration";
              }
          }

          function bindSavedPreview() {
              if (configReady) return;
              const saved = rootSettings.fakeProfile;
              rootSettings.fakeProfile = {
                  ...defaultPreview(),
                  ...(saved && typeof saved === "object" ? saved : {}),
                  nitroEnabled: saved?.nitroEnabled ?? Number(saved?.nitroMonths || 0) > 0,
                  hiddenBadgeIds: Array.isArray(saved?.hiddenBadgeIds) ? [...saved.hiddenBadgeIds] : [],
                  badgeOrder: Array.isArray(saved?.badgeOrder) ? [...saved.badgeOrder] : [],
                  selectedBadges: { ...(saved?.selectedBadges || {}) }
              } satisfies PreviewSettings;
              preview = rootSettings.fakeProfile as PreviewSettings;
              configReady = true;
          }

          const diagnostics = {
              patches: 0,
              userStore: false,
              profileStore: false,
              avatarResolver: false,
              bannerResolver: false,
              identityMatches: 0,
              identityUser: "None",
              identityData: false,
              last: "Ready"
          };
          (globalThis as any).__CLOUDCORD_PROFILE_DIAGNOSTICS__ = diagnostics;

          let initialized = false;
          let currentUserId: string | null = null;
          let realCurrentUser: any = null;
          let userCache = new WeakMap<object, any>();
          let profileCache = new WeakMap<object, any>();
          const SHARED_PROFILE_API = "https://getcloudcord.com";
          const sharedProfiles = ((globalThis as any).__CLOUDCORD_SHARED_PROFILES__ ||= new Map<string, any>()) as Map<string, any>;
          const sharedProfileFetchedAt = ((globalThis as any).__CLOUDCORD_SHARED_PROFILE_FETCHED_AT__ ||= new Map<string, number>()) as Map<string, number>;
          const sharedRequests = new Set<string>();
          let publishTimer: ReturnType<typeof setTimeout> | null = null;
          let sharedSyncTimer: ReturnType<typeof setInterval> | null = null;
          let fakeProfileEditorOpen = false;
          let suppressOwnPullUntil = 0;
          const mediaSelections = new Map<string, object>();
          const REPLACE_BADGES_SYNC_ID = "__cc_replace_real_badges";

          function adoptProfileAccount(user: any) {
              const nextId = user?.id ? String(user.id) : null;
              realCurrentUser = user || null;
              const previousId = rootSettings.fakeProfileOwnerId || currentUserId;
              currentUserId = nextId;
              if (!configReady || previousId === nextId) return;
              if (!previousId && nextId && rootSettings.fakeProfileOwnerId === undefined) {
                  // Adopt an existing single-account installation once.
                  rootSettings.fakeProfileOwnerId = nextId;
                  if (rootSettings.fakeProfileShare && !rootSettings.fakeProfileShare.ownerId) rootSettings.fakeProfileShare = { ...rootSettings.fakeProfileShare, ownerId: nextId };
                  return;
              }
              const accounts = { ...(rootSettings.fakeProfileAccounts || {}) };
              mediaSelections.clear();
              if (previousId) accounts[previousId] = { profile: rootSettings.fakeProfile || preview, localOnly: !!rootSettings.fakeProfileLocalOnly, mediaCleared: { ...(rootSettings.fakeProfileMediaCleared || {}) } };
              rootSettings.fakeProfileAccounts = accounts;
              const next = nextId ? accounts[nextId] : null;
              rootSettings.fakeProfileOwnerId = nextId;
              rootSettings.fakeProfile = next?.profile || defaultPreview();
              // A clean account can pull its own shared profile, but its disabled
              // empty preview cannot publish anything until explicitly enabled.
              rootSettings.fakeProfileLocalOnly = next?.localOnly ?? !nextId;
              rootSettings.fakeProfileMediaCleared = next?.mediaCleared || {};
              configReady = false; bindSavedPreview();
              if (publishTimer) { clearTimeout(publishTimer); publishTimer = null; }
              suppressOwnPullUntil = 0;
              userCache = new WeakMap(); profileCache = new WeakMap();
          }

          function mediaClearPending(key: "avatarMedia" | "bannerMedia") {
              return Number(rootSettings.fakeProfileMediaCleared?.[key] || 0) > 0;
          }

          function markMediaCleared(key: "avatarMedia" | "bannerMedia") {
              mediaSelections.delete(key);
              rootSettings.fakeProfileMediaCleared = {
                  ...(rootSettings.fakeProfileMediaCleared || {}),
                  [key]: Date.now()
              };
          }

          function unmarkMediaCleared(key: "avatarMedia" | "bannerMedia") {
              const pending = { ...(rootSettings.fakeProfileMediaCleared || {}) };
              delete pending[key];
              rootSettings.fakeProfileMediaCleared = pending;
          }

          function localBadgesHidden() {
              return rootSettings.fakeProfileLocalOnly && preview.hideBadgesWhenSyncOff === true;
          }

          function localHasFakeBadges() {
              return preview.nitroEnabled || preview.boostMonths > 0 || preview.giftLevel >= 0 || Object.values(preview.selectedBadges || {}).some(Boolean);
          }

          function shouldReplaceLocalBadges() {
              return !localBadgesHidden() && preview.replaceBadges && localHasFakeBadges();
          }

          function remoteReplaceBadges(data: any) {
              return data?.replaceRealBadges === true || (Array.isArray(data?.customBadgeIds) && data.customBadgeIds.includes(REPLACE_BADGES_SYNC_ID));
          }

          function remoteNitroEnabled(data: any) {
              return data?.nitro === true || data?.nitro == null && Number(data?.nitroLevel ?? -1) >= 0;
          }

          function remoteHasFakeBadges(data: any) {
              const custom = Array.isArray(data?.customBadgeIds) ? data.customBadgeIds.filter((id: string) => id !== REPLACE_BADGES_SYNC_ID) : [];
              return Number(data?.badgeFlags || 0) !== 0 || remoteNitroEnabled(data) || Number(data?.boostMonths ?? -1) >= 0 || Number(data?.giftLevel ?? -1) >= 0 || custom.length > 0;
          }

          function shouldReplaceSharedBadges(data: any) {
              return data?.__localBadges === true || remoteReplaceBadges(data) && remoteHasFakeBadges(data);
          }

          async function shareableMedia(key: "avatarMedia" | "bannerMedia", data = preview) {
              const uri = String(data[key]?.uri || "");
              if (!uri || /^(?:https?:|data:)/i.test(uri)) return uri || null;
              try {
                  const blob = await withTimeout((async () => (await fetch(uri)).blob())(), 8000);
                  if (blob.size > 1_250_000) return null;
                  const Reader = (globalThis as any).FileReader;
                  if (!Reader) return null;
                  return await withTimeout(new Promise<string | null>(resolve => {
                      const reader = new Reader();
                      reader.onload = () => resolve(typeof reader.result === "string" ? reader.result : null);
                      reader.onerror = () => resolve(null);
                      reader.readAsDataURL(blob);
                  }), 8000);
              } catch { return null; }
          }

          async function ownSharedProfile() {
              // Freeze one logical edit before yielding to native file decoding.
              // Reading the global preview between awaits can mix accounts/edits.
              const snapshot = JSON.parse(JSON.stringify(preview)) as PreviewSettings;
              return {
                  username: snapshot.username,
                  globalName: snapshot.displayName,
                  avatar: await shareableMedia("avatarMedia", snapshot),
                  banner: await shareableMedia("bannerMedia", snapshot),
                  nitro: snapshot.nitroEnabled,
                  nitroLevel: snapshot.nitroEnabled ? Math.max(0, NITRO_DURATIONS.indexOf(snapshot.nitroMonths)) : -1,
                  nitroSince: snapshot.nitroEnabled ? (profileDate(snapshot.nitroSince) || monthsAgo(snapshot.nitroMonths)).toISOString().slice(0, 10) : null,
                  boostMonths: Math.max(-1, BOOST_DURATIONS.indexOf(snapshot.boostMonths) - 1),
                  giftLevel: snapshot.giftLevel,
                  avatarDecoration: snapshot.avatarDecoration || null,
                  avatarDecorationSku: snapshot.avatarDecorationSku || null,
                  profileColorsEnabled: snapshot.profileColorsEnabled,
                  ...normalizeProfileAppearance(snapshot),
                  primaryColor: snapshot.profileColorsEnabled ? colorNumber(snapshot.primaryColor) : null,
                  accentColor: snapshot.profileColorsEnabled ? colorNumber(snapshot.accentColor) : null,
                  bio: snapshot.bio,
                  pronouns: snapshot.pronouns,
                  createdAt: snapshot.createdAt || null,
                  signupDate: snapshot.signupDate || null,
                  joinedSince: snapshot.signupDate || null,
                  oldName: snapshot.oldName,
                  badgeFlags: BADGES.reduce((flags, [id, , flag]) => flag && snapshot.selectedBadges?.[id] ? flags | flag : flags, 0),
                  replaceRealBadges: snapshot.replaceBadges === true,
                  hiddenBadgeIds: [...snapshot.hiddenBadgeIds],
                  nativeBadgeOrder: (() => { try { return rootSettings.fakeProfileNativeOrder || []; } catch { return []; } })(),
                  nativeHiddenBadges: (() => { try { return rootSettings.fakeProfileNativeHidden || []; } catch { return []; } })(),
                  badgeOrder: [...snapshot.badgeOrder],
                  customBadgeIds: [
                      ...BADGES.filter(([id, , , , customId]) => customId && snapshot.selectedBadges?.[id]).map(([, , , , customId]) => customId as string),
                      ...(snapshot.replaceBadges ? [REPLACE_BADGES_SYNC_ID] : [])
                  ],
                  syncRevision: Number(snapshot.syncRevision || 0)
              };
          }

          async function publishSharedProfile() {
              if (rootSettings.fakeProfileLocalOnly || !preview.enabled || !currentUserId) return;
              const queue = publishSharedProfile as typeof publishSharedProfile & { pending?: Promise<void>; queued?: boolean };
              if (queue.pending) { queue.queued = true; return queue.pending; }
              queue.pending = (async () => {
                  try {
                      do {
                          queue.queued = false;
                          try { await publishSharedProfileSnapshot(); }
                          catch (error) { if (!queue.queued) throw error; }
                      } while (queue.queued && !rootSettings.fakeProfileLocalOnly && preview.enabled && currentUserId);
                  } finally { queue.pending = undefined; }
              })();
              return queue.pending;
          }

          async function publishSharedProfileSnapshot(allowRetry = true) {
              if (rootSettings.fakeProfileLocalOnly) return;
              if (!preview.enabled || !currentUserId) return;
              const ownerId = currentUserId;
              const socialErrors = customSocialValidationErrors(preview);
              if (socialErrors.length) throw new Error(socialErrors[0]);
              const legacy = rootSettings.fakeProfileShare;
              if (legacy?.id && (!legacy.ownerId || legacy.ownerId === ownerId) && !rootSettings.fakeProfileShares?.[ownerId] && allowRetry) {
                  rootSettings.fakeProfileShares = { ...(rootSettings.fakeProfileShares || {}), [ownerId]: { ...legacy, ownerId } };
                  delete rootSettings.fakeProfileShare;
              }
              const saved = rootSettings.fakeProfileShares?.[ownerId] || {};
              const path = saved.id ? `/v1/profiles/${encodeURIComponent(saved.id)}` : "/v1/profiles";
              const localFingerprint = JSON.stringify(preview);
              const profileSnapshot = await ownSharedProfile();
              if (currentUserId !== ownerId || rootSettings.fakeProfileLocalOnly) return;
              const latestResponse = await fetchProfileResponse(`${SHARED_PROFILE_API}/v1/profiles/user/${encodeURIComponent(ownerId)}`, { cache: "no-store" });
              if (currentUserId !== ownerId || rootSettings.fakeProfileLocalOnly) return;
              if (JSON.stringify(preview) !== localFingerprint) {
                  (publishSharedProfile as any).queued = true;
                  return;
              }
              if (latestResponse.ok) {
                  const latest = await latestResponse.json() as any;
                  if (currentUserId !== ownerId || rootSettings.fakeProfileLocalOnly) return;
                  // Save everything: keep fields only desktop knows about, and don't wipe a
                  // picture or banner just because this phone couldn't read its own copy.
                  const remote = latest?.profile && typeof latest.profile === "object" ? latest.profile : {};
                  const snapshot = profileSnapshot as Record<string, any>;
                  for (const [field, media] of [["avatar", "avatarMedia"], ["banner", "bannerMedia"]] as const) {
                      if (snapshot[field] == null && !mediaClearPending(media) && remote[field]) snapshot[field] = remote[field];
                  }
                  for (const [key, value] of Object.entries(remote)) {
                      if (!(key in snapshot) && !["localOnly", "hideOtherProfiles", "nativeEditorImages", "hideBadgesWhenSyncOff", "copiedUserId"].includes(key)) snapshot[key] = value;
                  }
                  profileSnapshot.syncRevision = Math.max(Date.now(), Number(profileSnapshot.syncRevision || 0), Number(latest?.profile?.syncRevision || 0) + 1);
                  preview.syncRevision = profileSnapshot.syncRevision;
                  rootSettings.fakeProfile = { ...preview, selectedBadges: { ...(preview.selectedBadges || {}) } };
                  preview = rootSettings.fakeProfile as PreviewSettings;
              }
              else if (latestResponse.status !== 404) throw new Error(`Couldn't load your latest shared profile (${latestResponse.status}). Your local changes are saved; try syncing again shortly.`);
              const clearSnapshot = { ...(rootSettings.fakeProfileMediaCleared || {}) };
              if (currentUserId !== ownerId || rootSettings.fakeProfileLocalOnly) return;
              const response = await fetchProfileResponse(`${SHARED_PROFILE_API}${path}`, {
                  method: saved.id ? "PUT" : "POST",
                  headers: {
                      "Content-Type": "application/json",
                      ...(saved.editToken ? { Authorization: `Bearer ${saved.editToken}` } : {})
                  },
                  body: JSON.stringify({ ownerId, profile: profileSnapshot })
              });
              if (currentUserId !== ownerId) return;
              if (!response.ok) {
                  if (response.status === 429) {
                      const retrySeconds = Math.max(2, Number(response.headers.get("retry-after") || 10));
                      if (publishTimer) clearTimeout(publishTimer);
                      publishTimer = setTimeout(() => void publishSharedProfile().catch(error => {
                          diagnostics.last = error?.message || "Sharing will retry later";
                      }), retrySeconds * 1000);
                      diagnostics.last = `CloudCord sharing paused; retrying in ${retrySeconds}s`;
                      return;
                  }
                  if (response.status === 409) {
                      if (allowRetry) return publishSharedProfileSnapshot(false);
                      throw new Error("Your shared profile changed. Try saving again.");
                  }
                  if (saved.id && (response.status === 401 || response.status === 404)) {
                      const credentials = { ...(rootSettings.fakeProfileShares || {}) };
                      delete credentials[ownerId];
                      rootSettings.fakeProfileShares = credentials;
                      if (allowRetry) return publishSharedProfileSnapshot(false);
                      throw new Error("Your sharing credentials expired. Save your profile again.");
                  }
                  throw new Error(`CloudCord sharing failed (${response.status})`);
              }
              const result = await response.json() as any;
              if (currentUserId !== ownerId) return;
              if (!saved.id) rootSettings.fakeProfileShares = { ...(rootSettings.fakeProfileShares || {}), [ownerId]: { id: result.id, editToken: result.editToken, ownerId } };
              // A successful complete-snapshot update makes a local media
              // tombstone authoritative. Only clear it after the server has
              // accepted the null value; an earlier pull must not resurrect a
              // GIF that the user just removed.
              for (const key of ["avatarMedia", "bannerMedia"] as const) {
                  const serverField = key === "avatarMedia" ? "avatar" : "banner";
                  if ((profileSnapshot as any)[serverField] == null
                      && clearSnapshot[key]
                      && rootSettings.fakeProfileMediaCleared?.[key] === clearSnapshot[key]) {
                      unmarkMediaCleared(key);
                  }
              }
              diagnostics.last = "Fake Profile shared automatically";
          }

          function queueSharedPublish() {
              if (rootSettings.fakeProfileLocalOnly) { if (publishTimer) clearTimeout(publishTimer); return; }
              if (!preview.enabled) return;
              if (publishTimer) clearTimeout(publishTimer);
              publishTimer = setTimeout(() => void publishSharedProfile().catch(error => {
                  diagnostics.last = error?.message || "Sharing will retry later";
              }), 1200);
          }

          async function pullOwnSharedProfile(force = false) {
              if (rootSettings.fakeProfileLocalOnly) return;
              // The server contains the last completed save. Do not let the
              // background poll replace fields while the user is editing, or
              // immediately after a newer local revision was queued.
              if (!force && (fakeProfileEditorOpen || Date.now() < suppressOwnPullUntil)) return;
              // Keep unfinished local drafts until completed or explicitly removed.
              if (!force && customSocialValidationErrors(preview).length) return;
              if (!currentUserId) return;
              const now = Date.now();
              if ((pullOwnSharedProfile as any).pending || now - Number((pullOwnSharedProfile as any).lastAttempt || 0) < 12000) return;
              (pullOwnSharedProfile as any).pending = true;
              (pullOwnSharedProfile as any).lastAttempt = now;
              const requestedUserId = currentUserId;
              const localSnapshot = JSON.stringify(preview);
              try {
                  const response = await fetchProfileResponse(`${SHARED_PROFILE_API}/v1/profiles/user/${encodeURIComponent(currentUserId)}`);
                  if (response.status === 404) {
                      if (preview.enabled) queueSharedPublish();
                      return;
                  }
                  if (!response.ok) return;
                  const payload = await response.json() as any;
                  if (rootSettings.fakeProfileLocalOnly || currentUserId !== requestedUserId || JSON.stringify(preview) !== localSnapshot || (!force && (fakeProfileEditorOpen || Date.now() < suppressOwnPullUntil))) return;
                  const data = payload?.profile ?? payload;
                  if (!data || typeof data !== "object") return;
                  if (Number(data.syncRevision || 0) < Number(preview.syncRevision || 0)) return;
                  const selectedBadges = { ...(preview.selectedBadges || {}) };
                  const customBadgeIds = Array.isArray(data.customBadgeIds) ? data.customBadgeIds : [];
                  for (const [id, , flag, , customId] of BADGES) {
                      selectedBadges[id] = customId ? customBadgeIds.includes(customId) : !!(Number(data.badgeFlags || 0) & flag);
                  }
                  const nextPreview = {
                      ...preview,
                      enabled: true,
                      username: data.username || preview.username,
                      displayName: data.globalName || data.displayName || preview.displayName,
                      ...normalizeProfileAppearance(data),
                      avatarMedia: mediaClearPending("avatarMedia") ? null : data.avatar ? { uri: String(data.avatar), name: "Synced profile picture", type: "image/*" } : null,
                      bannerMedia: mediaClearPending("bannerMedia") ? null : data.banner ? { uri: String(data.banner), name: "Synced banner", type: "image/*" } : null,
                      nitroEnabled: remoteNitroEnabled(data),
                      nitroSince: typeof data.nitroSince === "string" ? data.nitroSince : "",
                      nitroMonths: remoteNitroEnabled(data) ? (NITRO_DURATIONS[Number(data.nitroLevel)] || 0) : 0,
                      boostMonths: data.boostMonths >= 0 ? (BOOST_DURATIONS[Number(data.boostMonths) + 1] || 0) : 0,
                      giftLevel: Number.isInteger(data.giftLevel) ? data.giftLevel : -1,
                      avatarDecoration: String(data.avatarDecoration || ""),
                      avatarDecorationSku: String(data.avatarDecorationSku || ""),
                      profileColorsEnabled: data.profileColorsEnabled === true || data.primaryColor != null || data.accentColor != null,
                      primaryColor: colorHex(data.primaryColor, preview.primaryColor),
                      accentColor: colorHex(data.accentColor, preview.accentColor),
                      bio: String(data.bio || ""),
                      pronouns: String(data.pronouns || ""),
                      createdAt: String(data.createdAt || ""),
                      signupDate: String(data.signupDate || data.joinedSince || ""),
                      oldName: String(data.oldName || ""),
                      replaceBadges: remoteReplaceBadges(data),
                      selectedBadges,
                      hiddenBadgeIds: Array.isArray(data.hiddenBadgeIds) ? data.hiddenBadgeIds : [],
                      badgeOrder: Array.isArray(data.badgeOrder) ? data.badgeOrder : [],
                      syncRevision: Number(data.syncRevision || 0)
                  } satisfies PreviewSettings;
                  // Polls commonly return the same snapshot. Replacing the
                  // observed settings and clearing stores still rerenders Discord.
                  if (JSON.stringify(nextPreview) === JSON.stringify(preview)) return;
                  rootSettings.fakeProfile = preview = nextPreview;
                  clearCache();
                  diagnostics.last = "Fake Profile synced across devices";
              } catch {} finally {
                  (pullOwnSharedProfile as any).pending = false;
              }
          }

          const sharedProfileSeenAt = new Map<string, number>();
          let sharedRenderTimer: ReturnType<typeof setTimeout> | null = null;
          function queueSharedRenderRefresh() {
              if (sharedRenderTimer) return;
              sharedRenderTimer = setTimeout(() => {
                  sharedRenderTimer = null;
                  if (AppState.currentState !== "active") return;
                  for (const refresh of identityRefreshers) { try { refresh(); } catch {} }
                  try { safeStore("UserStore")?.emitChange?.(); } catch {}
                  try { safeStore("UserProfileStore")?.emitChange?.(); } catch {}
                  try { safeStore("MessageStore")?.emitChange?.(); } catch {}
              }, 250);
          }
          function requestSharedProfile(userId?: string, force = false) {
              const id = String(userId || "");
              if (!force) sharedProfileSeenAt.set(id, Date.now());
              const fetchedAt = sharedProfileFetchedAt.get(id) || 0;
              // Cache misses quietly, but recheck profiles being actively viewed
              // within a minute so newly published badges do not stay invisible.
              const cached = sharedProfiles.get(id);
              const ttl = cached && !Object.keys(cached).length ? (force ? 60_000 : 15 * 60_000) : force ? 30_000 : 2 * 60_000;
              if (AppState.currentState !== "active" || !/^\d{15,22}$/.test(id) || id === currentUserId || sharedRequests.has(id) || Date.now() - fetchedAt < ttl || sharedRequests.size >= 4) return;
              sharedRequests.add(id);
              sharedProfileFetchedAt.set(id, Date.now());
              void fetchProfileResponse(`${SHARED_PROFILE_API}/v1/profiles/user/${encodeURIComponent(id)}?v=${Date.now()}`, { cache: "no-store" })
                  .then(response => {
                      if (response.ok) return response.json();
                      if (response.status === 404) return null;
                      throw new Error(`Shared profile unavailable (${response.status})`);
                  })
                  .then(payload => {
                      const profile = payload?.profile ?? payload;
                      // Cache a missing profile too. Profile surfaces can render several
                      // times in quick succession and must not turn one 404 into a loop.
                      const next = profile && typeof profile === "object" ? profile : {};
                      const previous = sharedProfiles.get(id);
                      const changed = JSON.stringify(previous ?? {}) !== JSON.stringify(next);
                      sharedProfiles.set(id, next);
                      sharedProfileFetchedAt.set(id, Date.now());
                      if (!changed) return;
                      queueSharedRenderRefresh();
                  })
                  .catch(() => {})
                  .finally(() => sharedRequests.delete(id));
          }

          function isRealProfileView(id: string) {
              return Array.isArray(rootSettings.cloudcordRealProfileUsers) && rootSettings.cloudcordRealProfileUsers.includes(id);
          }
          function toggleRealProfileView(id: string) {
              if (!/^\d{15,22}$/.test(id) || isCurrentUser(id)) return;
              const users = new Set<string>(Array.isArray(rootSettings.cloudcordRealProfileUsers) ? rootSettings.cloudcordRealProfileUsers : []);
              if (users.has(id)) users.delete(id); else users.add(id);
              rootSettings.cloudcordRealProfileUsers = [...users];
              clearCache();
              for (const refresh of identityRefreshers) refresh();
              for (const store of ["UserStore", "UserProfileStore", "MessageStore"]) {
                  try { safeStore(store)?.emitChange?.(); } catch {}
              }
              try { simpleSheets.hideActionSheet?.(); } catch {}
              const open = findByName("showUserProfileActionSheet", false) as any;
              if (typeof open === "function") setTimeout(() => open({ userId: id }), 0);
          }
          let realProfileMenuConnected = false;
          function connectRealProfileMenu() {
              if (realProfileMenuConnected) return;
