name: Build CloudCord Runtime

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - "cloudcord-favicon.png"
      - "assets/cloudcord-favicon.png"
      - "assets/cloudcord-logo.png"
      - ".github/workflows/cloudcord.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Check startup error handling
        run: node ios/scripts/test-startup-errors.cjs

      - name: Check Discord theme compatibility
        run: |
          npm install --prefix /tmp/cloudcord-theme-tests --no-audit --no-fund esbuild@0.20.2
          CLOUDCORD_ESBUILD=/tmp/cloudcord-theme-tests/node_modules/esbuild node ios/scripts/test-theme-compatibility.cjs

      - name: Clone clean Kettu source
        run: |
          set -e
          for attempt in 1 2 3 4 5; do
            rm -rf _cloudcord_source
            if git clone --depth=1 https://codeberg.org/cocobo1/Kettu.git _cloudcord_source; then
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "Kettu clone failed after 5 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Apply CloudCord patches
        run: |
          set -e
          cd _cloudcord_source

          if [ -f "../cloudcord-favicon.png" ]; then
            cp "../cloudcord-favicon.png" "src/assets/icons/kettu.png"
            cp "../cloudcord-favicon.png" "src/assets/icons/cloudcord.png"
          elif [ -f "../assets/cloudcord-favicon.png" ]; then
            cp "../assets/cloudcord-favicon.png" "src/assets/icons/kettu.png"
            cp "../assets/cloudcord-favicon.png" "src/assets/icons/cloudcord.png"
          elif [ -f "../assets/cloudcord-logo.png" ]; then
            cp "../assets/cloudcord-logo.png" "src/assets/icons/kettu.png"
            cp "../assets/cloudcord-logo.png" "src/assets/icons/cloudcord.png"
          fi

          mkdir -p src/core/ui/settings/pages/StoreCloud
          mkdir -p src/core/ui/settings/pages/FakeProfile
          mkdir -p src/core/ui/settings/pages/BotCord
          mkdir -p src/core/ui/settings/pages/Diagnostics
          mkdir -p src/core/ui/settings/pages/Customization
          mkdir -p src/core/ui/settings/pages/Plugins/components
          mkdir -p src/core/ui/settings/pages/Plugins/models
          mkdir -p src/core/ui/settings/components
          cp "../ios/runtime/src/core/ui/settings/components/FakeProfileGlass.tsx" "src/core/ui/settings/components/FakeProfileGlass.tsx"
          cp "../ios/runtime/src/core/ui/settings/components/CustomBadgeBeta.tsx" "src/core/ui/settings/components/CustomBadgeBeta.tsx"
          cp "../ios/runtime/src/core/ui/settings/components/LocalProfiles.tsx" "src/core/ui/settings/components/LocalProfiles.tsx"
          mkdir -p src/core/ui/settings/pages/Addons
          cp "../ios/runtime/src/core/ui/settings/pages/Addons/index.tsx" "src/core/ui/settings/pages/Addons/index.tsx"
          mkdir -p src/core/ui/settings/pages/Recovery
          cp "../ios/runtime/src/core/ui/settings/pages/Recovery/index.tsx" "src/core/ui/settings/pages/Recovery/index.tsx"
          mkdir -p src/core/ui/settings/pages/Themes
          mkdir -p src/core/ui/botcord
          mkdir -p src/core/ui/settings/components
          mkdir -p src/lib/api
          cp "../ios/runtime/src/core/ui/settings/pages/BotCord/index.tsx" "src/core/ui/settings/pages/BotCord/index.tsx"
          cp "../ios/runtime/src/core/ui/botcord/FloatingSwitcher.tsx" "src/core/ui/botcord/FloatingSwitcher.tsx"
          cp "../ios/runtime/src/core/ui/settings/pages/Diagnostics/index.tsx" "src/core/ui/settings/pages/Diagnostics/index.tsx"
          cp "../ios/runtime/src/core/ui/settings/pages/Customization/index.tsx" "src/core/ui/settings/pages/Customization/index.tsx"
          cp "../ios/runtime/src/core/ui/settings/pages/General/index.tsx" "src/core/ui/settings/pages/General/index.tsx"
          cp "../ios/runtime/src/core/ui/settings/pages/Plugins/components/PluginCard.tsx" "src/core/ui/settings/pages/Plugins/components/PluginCard.tsx"
          cp "../ios/runtime/src/core/ui/settings/pages/Plugins/models/index.ts" "src/core/ui/settings/pages/Plugins/models/index.ts"
          cp "../ios/runtime/src/core/ui/settings/pages/Plugins/models/vendetta.ts" "src/core/ui/settings/pages/Plugins/models/vendetta.ts"
          cp "../ios/runtime/src/core/ui/settings/pages/Themes/ThemeCard.tsx" "src/core/ui/settings/pages/Themes/ThemeCard.tsx"
          cp "../ios/runtime/src/core/ui/settings/index.ts" "src/core/ui/settings/index.ts"
          cp "../ios/runtime/src/core/vendetta/plugins.ts" "src/core/vendetta/plugins.ts"
          cp "../ios/runtime/src/lib/api/settings.ts" "src/lib/api/settings.ts"
          cp "../ios/runtime/src/lib/api/botcord.ts" "src/lib/api/botcord.ts"
          mkdir -p src/lib/api/native
          cp "../ios/runtime/src/lib/api/native/legacyRuntimeRefresh.ts" "src/lib/api/native/legacyRuntimeRefresh.ts"
          cp "../ios/runtime/src/lib/ui/settings/index.tsx" "src/lib/ui/settings/index.tsx"
          cp "../ios/runtime/src/lib/ui/settings/patches/tabs.tsx" "src/lib/ui/settings/patches/tabs.tsx"
          cp "../ios/runtime/src/lib/ui/settings/patches/panel.tsx" "src/lib/ui/settings/patches/panel.tsx"
          cp "../ios/runtime/src/lib/api/native/loader.ts" "src/lib/api/native/loader.ts"
          cp "../ios/runtime/src/lib/api/native/fs.ts" "src/lib/api/native/fs.ts"
          cp "../ios/runtime/src/lib/api/native/modules/index.ts" "src/lib/api/native/modules/index.ts"
          cp "../ios/runtime/src/lib/api/native/runtimeUpdates.ts" "src/lib/api/native/runtimeUpdates.ts"
          cp "../ios/runtime/src/lib/addons/themes/colors/updater.ts" "src/lib/addons/themes/colors/updater.ts"
          cp "../ios/runtime/src/lib/addons/themes/colors/patches/resolver.ts" "src/lib/addons/themes/colors/patches/resolver.ts"
          cp "../ios/runtime/src/lib/addons/themes/colors/patches/storage.ts" "src/lib/addons/themes/colors/patches/storage.ts"
          # Discord 344 safety lives in the runtime entry and Metro internals.
          # Always overlay these files onto the clean Kettu checkout; otherwise
          # the build silently ships Kettu's legacy force-loading behavior.
          cp "../ios/runtime/src/entry.ts" "src/entry.ts"
          cp "../ios/runtime/src/index.ts" "src/index.ts"
          cp "../ios/runtime/src/metro/internals/caches.ts" "src/metro/internals/caches.ts"
          cp "../ios/runtime/src/metro/internals/modules.ts" "src/metro/internals/modules.ts"
          cp "../ios/runtime/src/core/vendetta/api.tsx" "src/core/vendetta/api.tsx"

          cat > src/core/ui/settings/components/ScaledPluginSettings.tsx <<'TSX'
          import type { ComponentType } from "react";
          import { ScrollView, Text, View } from "react-native";

          export default function ScaledPluginSettings({ component: Component }: { component: ComponentType<any> }) {
              if (typeof Component !== "function") {
                  return <View style={{ padding: 16 }}><Text style={{ color: "#ffffff" }}>This plugin does not provide a mobile-compatible settings component.</Text></View>;
              }
              return (
                  <ScrollView
                      style={{ flex: 1 }}
                      contentContainerStyle={{
                          paddingBottom: 90,
                          paddingHorizontal: 12
                      }}
                      showsVerticalScrollIndicator={true}
                  >
                      <View
                          style={{
                              width: "100%",
                              paddingRight: 24,
                              overflow: "visible"
                          }}
                      >
                          <Component />
                      </View>
                  </ScrollView>
              );
          }
          TSX

          cat > src/core/ui/settings/pages/StoreCloud/index.tsx <<'TSX'
          import { VdPluginManager } from "@core/vendetta/plugins";
          import { useProxy } from "@core/vendetta/storage";
          import ScaledPluginSettings from "@core/ui/settings/components/ScaledPluginSettings";
          import { findAssetId } from "@lib/api/assets";
          import { showToast } from "@lib/ui/toasts";
          import { Card, Stack, TableRow, TableRowGroup, Text } from "@metro/common/components";
          import { useState } from "react";
          import { ScrollView, View } from "react-native";

          const PLUGIN_URL = "https://revenge.nexpid.xyz/cloud-sync/";
          const STORECLOUD_ICON = "https://raw.githubusercontent.com/xohus/cloudcord/main/cloudcord-favicon.png";

          export default function StoreCloud() {
              useProxy(VdPluginManager.plugins);

              const [busy, setBusy] = useState(false);
              const [refresh, setRefresh] = useState(0);

              const plugin = VdPluginManager.plugins[PLUGIN_URL];
              const SettingsComponent = plugin?.enabled ? VdPluginManager.getSettings(PLUGIN_URL) : null;

              async function installOrStart() {
                  if (busy) return;

                  setBusy(true);

                  try {
                      if (!VdPluginManager.plugins[PLUGIN_URL]) {
                          await VdPluginManager.installPlugin(PLUGIN_URL, true);
                          showToast("StoreCloud installed", findAssetId("Check"));
                      } else if (!VdPluginManager.plugins[PLUGIN_URL].enabled) {
                          await VdPluginManager.startPlugin(PLUGIN_URL);
                          showToast("StoreCloud started", findAssetId("Check"));
                      } else {
                          showToast("StoreCloud is already enabled", findAssetId("Check"));
                      }

                      setRefresh(x => x + 1);
                  } catch (error: any) {
                      console.error("[CloudCord] StoreCloud install/start failed", error);
                      showToast(error?.message ?? "StoreCloud failed");
                  } finally {
                      setBusy(false);
                  }
              }

              async function refetchPlugin() {
                  if (busy) return;

                  setBusy(true);

                  try {
                      if (VdPluginManager.plugins[PLUGIN_URL]?.enabled) {
                          VdPluginManager.stopPlugin(PLUGIN_URL, false);
                      }

                      await VdPluginManager.fetchPlugin(PLUGIN_URL);
                      await VdPluginManager.startPlugin(PLUGIN_URL);

                      showToast("StoreCloud refreshed", findAssetId("Check"));
                      setRefresh(x => x + 1);
                  } catch (error: any) {
                      console.error("[CloudCord] StoreCloud refresh failed", error);
                      showToast(error?.message ?? "StoreCloud refresh failed");
                  } finally {
                      setBusy(false);
                  }
              }

              async function removePlugin() {
                  if (busy) return;

                  setBusy(true);

                  try {
                      if (VdPluginManager.plugins[PLUGIN_URL]) {
                          await VdPluginManager.removePlugin(PLUGIN_URL);
                      }

                      showToast("StoreCloud removed");
                      setRefresh(x => x + 1);
                  } catch (error: any) {
                      console.error("[CloudCord] StoreCloud remove failed", error);
                      showToast(error?.message ?? "StoreCloud remove failed");
                  } finally {
                      setBusy(false);
                  }
              }

              if (SettingsComponent) {
                  return <ScaledPluginSettings key={`storecloud-settings-${refresh}`} component={SettingsComponent} />;
              }

              return (
                  <ScrollView style={{ flex: 1 }} contentContainerStyle={{ paddingBottom: 38 }}>
                      <Stack style={{ paddingVertical: 24, paddingHorizontal: 12 }} spacing={24}>
                          <TableRowGroup title="CloudSync">
                              <View style={{ paddingHorizontal: 12, paddingBottom: 12 }}>
                                  <Text variant="heading-md/semibold" color="text-normal">
                                      CloudSync
                                  </Text>
                                  <Text variant="text-sm/medium" color="text-muted">
                                      Connect StoreCloud to sync supported settings and manage cloud backups on this device.
                                  </Text>
                              </View>

                              <TableRow
                                  arrow
                                  label={plugin ? "Start StoreCloud" : "Enable StoreCloud"}
                                  subLabel={busy ? "Please wait..." : "Loads the StoreCloud sync engine"}
                                  icon={<TableRow.Icon source={{ uri: STORECLOUD_ICON }} />}
                                  onPress={installOrStart}
                              />

                              {plugin && (
                                  <TableRow
                                      arrow
                                      label="Refresh StoreCloud"
                                      subLabel="Refreshes the StoreCloud sync engine"
                                      icon={<TableRow.Icon source={findAssetId("RetryIcon")!} />}
                                      onPress={refetchPlugin}
                                  />
                              )}

                              {plugin && (
                                  <TableRow
                                      arrow
                                      label="Disable StoreCloud"
                                      subLabel="Removes the StoreCloud sync engine"
                                      icon={<TableRow.Icon source={findAssetId("TrashIcon") ?? findAssetId("CircleXIcon-primary")!} />}
                                      onPress={removePlugin}
                                  />
                              )}
                          </TableRowGroup>

                          <Card border="strong">
                              <View style={{ padding: 12 }}>
                                  <Text variant="text-sm/medium" color="text-muted">
                                      StoreCloud uses the existing mobile sync engine for OAuth, settings synchronization, backups, and files.
                                  </Text>
                              </View>
                          </Card>
                      </Stack>
                  </ScrollView>
              );
          }
          TSX


