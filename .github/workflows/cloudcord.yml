                          openAlert("cloudcord-membership-verification", (
                              <View style={{ width: 330, maxWidth: "90%", padding: 24, borderRadius: 16, borderWidth: 1, borderColor: "#3f4147", backgroundColor: "#1e1f22", alignItems: "center" }}>
                                  <Text style={{ color: "#f2f3f5", fontSize: 24, fontWeight: "800", marginBottom: 8, textAlign: "center" }}>Access Blacklisted</Text>
                                  <Text style={{ color: "#b5bac1", fontSize: 15, lineHeight: 21, textAlign: "center" }}>Discord authorization was denied, so this device cannot access CloudCord.</Text>
                              </View>
                          ));
                          return;
                      }
                      if (oauthState) {
                          const statusResponse = await fetch(`https://cloudcord.xohus.lol/api/cloudcord/onboarding/status/${encodeURIComponent(oauthState)}`);
                          const status = statusResponse.ok ? await statusResponse.json() : { status: "expired" };
                          if (status.status === "blacklisted") {
                              (settings as any).cloudcordBlacklisted = true;
                              oauthState = undefined;
                          } else if (status.status === "complete") {
                              oauthVerified = true;
                              oauthState = undefined;
                              dismissAlert("cloudcord-membership-verification");
                              return;
                          } else if (status.status === "error" || Date.now() - oauthStartedAt > 60_000) {
                              oauthState = undefined;
                          } else {
                              return;
                          }
                      }
                      if (!requiredGuildId) {
                          const response = await fetch(CONFIG_URL);
                          if (!response.ok) return;
                          const config = await response.json();
                          if (!config?.enabled || !config.guildId) return;
                          requiredGuildId = String(config.guildId);
                      }
                      const guildStore = findByProps("getGuilds", "getGuild") as any;
                      if (guildStore?.getGuild?.(requiredGuildId)) {
                          dismissAlert("cloudcord-membership-verification");
                          return;
                      }
                      openAlert("cloudcord-membership-verification", (
                          <View style={{ width: 330, maxWidth: "90%", padding: 24, borderRadius: 16, borderWidth: 1, borderColor: "#3f4147", backgroundColor: "#1e1f22", alignItems: "center" }}>
                              <Text style={{ color: "#f2f3f5", fontSize: 24, fontWeight: "800", marginBottom: 8, textAlign: "center" }}>Join CloudCord</Text>
                              <Text style={{ color: "#b5bac1", fontSize: 15, lineHeight: 21, marginBottom: 10, textAlign: "center" }}>Join the official CloudCord server to finish setup and unlock CloudCord.</Text>
                              <Text style={{ color: "#949ba4", fontSize: 12, lineHeight: 17, marginBottom: 22, textAlign: "center" }}>By continuing, you accept the CloudCord Terms of Service and authorize Discord to add you to the official server.</Text>
                              <Pressable
                                  accessibilityRole="button"
                                  onPress={() => void beginDiscordAuthorization()}
                                  style={({ pressed }) => ({ width: "100%", paddingVertical: 13, borderRadius: 8, alignItems: "center", backgroundColor: pressed ? "#4752c4" : "#5865f2" })}
                              >
                                  <Text style={{ color: "#ffffff", fontSize: 16, fontWeight: "700" }}>Accept Terms & Continue</Text>
                              </Pressable>
                          </View>
                      ));
                  } catch {} finally {
                      checking = false;
                  }
              };
              checkMembership = check;
              AppState.addEventListener("change", state => {
                  if (state === "active") void check();
              });
              setTimeout(() => { void check(); setInterval(() => void check(), 1000); }, 3000);
          }
          ''', encoding="utf-8")

          main_index = Path("src/index.ts")
          if main_index.exists():
              text = main_index.read_text(encoding="utf-8", errors="ignore")
              startup_import = 'import { initializeFakeProfile } from "@core/ui/settings/pages/FakeProfile";\n'
              membership_import = 'import { initializeCloudCordVerification } from "@core/ui/settings/pages/CloudCordVerification";\n'
              legacy_refresh_import = 'import { initLegacyRuntimeRefresh } from "@lib/api/native/legacyRuntimeRefresh";\n'

              if startup_import not in text:
                  text = startup_import + text
              if membership_import not in text:
                  text = membership_import + text
              if legacy_refresh_import not in text:
                  text = legacy_refresh_import + text

              if "initializeFakeProfile()," not in text:
                  text = text.replace(
                      "        initSettings(),",
                      "        initSettings(),\n        initializeFakeProfile(),"
                  )
              if "initializeCloudCordVerification()," not in text:
                  text = text.replace(
                      "        initializeFakeProfile(),",
                      "        initializeFakeProfile(),\n        initializeCloudCordVerification(),"
                  )

              text = text.replace(
                  "        initSettings(),",
                  '        ((globalThis as any).__CLOUDCORD_LOADER__?.loaderName === "RealCord" ? Promise.resolve() : initSettings()),'
              )

              if "await initLegacyRuntimeRefresh();" not in text:
                  text = text.replace(
                      "export default async () => {",
                      "export default async () => {\n    await initLegacyRuntimeRefresh();"
                  )
              text = text.replace("        initLegacyRuntimeRefresh(),\n", "")


              main_index.write_text(text, encoding="utf-8")

          vendetta_api = Path("src/core/vendetta/api.tsx")
          if vendetta_api.exists():
              text = vendetta_api.read_text(encoding="utf-8", errors="ignore")

              marker = 'import { VdPluginManager, VendettaPlugin } from "./plugins";\n'

              patched_forms_code = r'''
          const makeIcon = (leading: any) => leading;

          const CompatRow = commonComponents.TableRow ?? (Forms as any).FormRow ?? common.ReactNative.View;
          const CompatSwitchRow = commonComponents.TableSwitchRow ?? (Forms as any).FormSwitchRow ?? CompatRow;
          const CompatSection = commonComponents.TableRowGroup ?? (Forms as any).FormSection ?? common.ReactNative.View;

          const PatchedFormRow = (props: any) => createElement(CompatRow, {
              label: props.label,
              subLabel: props.subLabel,
              icon: makeIcon(props.leading),
              trailing: props.trailing,
              onPress: props.onPress,
              disabled: props.disabled,
              arrow: props.arrow
          });

          (PatchedFormRow as any).Icon = (Forms as any).FormRow?.Icon ?? commonComponents.TableRow?.Icon ?? (() => null);
          (PatchedFormRow as any).Arrow = (Forms as any).FormRow?.Arrow ?? commonComponents.TableRow?.Arrow ?? (() => null);

          const PatchedFormSwitchRow = (props: any) => createElement(CompatSwitchRow, {
              label: props.label,
              subLabel: props.subLabel,
              icon: makeIcon(props.leading),
              value: !!props.value,
              onValueChange: props.onValueChange,
              disabled: props.disabled
          });

          const PatchedFormSection = (props: any) => createElement(CompatSection, {
              title: props.title,
              ...props
          }, props.children);

          const PatchedForms = {
              ...Forms,
              FormRow: PatchedFormRow,
              FormSwitchRow: PatchedFormSwitchRow,
              FormSection: PatchedFormSection,
              FormDivider: () => null
          };
          '''

              if "const PatchedForms =" not in text:
                  text = text.replace(marker, marker + patched_forms_code + "\n")

              text = text.replace(
                  "                Forms,\n                General: common.ReactNative,",
                  "                Forms: PatchedForms,\n                General: common.ReactNative,"
              )

              vendetta_api.write_text(text, encoding="utf-8")

          plugin_info = Path("src/core/ui/settings/pages/Plugins/sheets/PluginInfoActionSheet.tsx")
          if plugin_info.exists():
              text = plugin_info.read_text(encoding="utf-8", errors="ignore")

              if 'ScaledPluginSettings' not in text:
                  text = text.replace(
                      'import TitleComponent from "./TitleComponent";',
                      'import TitleComponent from "./TitleComponent";\nimport ScaledPluginSettings from "@core/ui/settings/components/ScaledPluginSettings";'
                  )

              text = text.replace(
                  'render: plugin.getPluginSettingsComponent(),',
                  'render: () => <ScaledPluginSettings component={plugin.getPluginSettingsComponent()!} />,'
              )

              plugin_info.write_text(text, encoding="utf-8")

          addon_page = Path("src/core/ui/components/AddonPage.tsx")
          if addon_page.exists():
              text = addon_page.read_text(encoding="utf-8", errors="ignore")
              text = text.replace(
                  'ComponentType, ReactNode, useCallback, useEffect, useMemo } from "react";',
                  'ComponentType, ReactNode, useCallback, useEffect, useMemo, useState } from "react";'
              )
              text = text.replace('React.useState(', 'useState(')
              addon_page.write_text(text, encoding="utf-8")

          plugin_card = Path("src/core/ui/settings/pages/Plugins/components/PluginCard.tsx")
          if plugin_card.exists():
              text = plugin_card.read_text(encoding="utf-8", errors="ignore")
              text = text.replace(
                  'createContext, useContext, useMemo } from "react";',
                  'createContext, useContext, useMemo, useReducer } from "react";'
              )
              text = text.replace('React.useReducer(', 'useReducer(')
              plugin_card.write_text(text, encoding="utf-8")

          vd_plugin_info = Path("src/core/ui/settings/pages/Plugins/sheets/VdPluginInfoActionSheet.tsx")
          if vd_plugin_info.exists():
              text = vd_plugin_info.read_text(encoding="utf-8", errors="ignore")

              if 'ScaledPluginSettings' not in text:
                  text = text.replace(
                      'import { PluginInfoActionSheetProps } from "./common";',
                      'import { PluginInfoActionSheetProps } from "./common";\nimport ScaledPluginSettings from "@core/ui/settings/components/ScaledPluginSettings";'
                  )

              text = text.replace(
                  'render: SettingsComponent,',
                  'render: () => <ScaledPluginSettings component={SettingsComponent} />,'
              )

              text = text.replace(
                  'render: SettingsComponent',
                  'render: () => <ScaledPluginSettings component={SettingsComponent} />'
              )

              vd_plugin_info.write_text(text, encoding="utf-8")

          build = Path("scripts/build.mjs")
          if build.exists():
              text = build.read_text(encoding="utf-8", errors="ignore")
              text = text.replace('version: `"v1.4.2"`', 'version: `"v0.1"`')
              text = text.replace('version: `"v1.4.1"`', 'version: `"v0.1"`')
              text = text.replace('version: `"v1.4.0"`', 'version: `"v0.1"`')
              build.write_text(text, encoding="utf-8")
          PY

      - name: Install dependencies
        run: |
          set -e
          cd _cloudcord_source
          bun install

      - name: Build CloudCord runtime
        run: |
          set -e
          cd _cloudcord_source
          bun run build -- --build-minify

          mkdir -p ../dist

          cp dist/kettu.js ../cloudcord.js
          cp dist/kettu.min.js ../cc.js
          cp dist/kettu.min.js ../cloudcord.min.js

          cp dist/kettu.js ../dist/cloudcord.js
          cp dist/kettu.min.js ../dist/cc.js
          cp dist/kettu.min.js ../dist/cloudcord.min.js

          node --check ../dist/cc.js
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          runtime = Path("../dist/cc.js").read_bytes()
          manifest = {
              "schema": 1,
              "version": os.environ.get("GITHUB_SHA", "local"),
              "url": "https://raw.githubusercontent.com/xohus/cloudcord/main/dist/cc.js",
              "sha256": hashlib.sha256(runtime).hexdigest(),
              "size": len(runtime),
          }
          Path("../dist/runtime-manifest.json").write_text(json.dumps(manifest, separators=(",", ":")) + "\n", encoding="utf-8")
          PY

      - name: Publish runtime to main
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cc.js cloudcord.js cloudcord.min.js dist/cc.js dist/cloudcord.js dist/cloudcord.min.js dist/runtime-manifest.json
          if git diff --cached --quiet; then
            echo "Runtime is already current"
            exit 0
          fi
          git commit -m "build: publish CloudCord runtime [skip ci]"
          git push origin HEAD:main

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudcord-mobile-shared-runtime
          path: |
            cc.js
            cloudcord.js
            cloudcord.min.js
            dist/cc.js
            dist/cloudcord.js
            dist/cloudcord.min.js
            dist/runtime-manifest.json
