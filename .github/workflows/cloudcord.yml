              }
          }

          function monthsAgo(months: number) {
              const date = new Date();
              const count = Number.isFinite(Number(months)) ? Math.max(0, Math.min(1200, Math.trunc(Number(months)))) : 0;
              const day = date.getDate();
              date.setDate(1);
              date.setMonth(date.getMonth() - count);
              const last = new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
              date.setDate(Math.min(day, last));
              return date;
          }

          function profileDate(value: unknown) {
              if (typeof value !== "string") return null;
              const day = value.slice(0, 10);
              if (!/^\d{4}-\d{2}-\d{2}$/.test(day)) return null;
              const date = new Date(`${day}T12:00:00Z`);
              return Number.isNaN(date.getTime()) || date.toISOString().slice(0, 10) !== day ? null : date;
          }

          function durationLabel(months: number) {
