              }
              try {
                  const module = findByProps("getCollectiblesCategories") as any;
                  roots.push(await withTimeout(Promise.resolve().then(() => module?.getCollectiblesCategories?.()), 4000), module);
              } catch {}
              try {
                  const module = findByProps("fetchCollectiblesCategories") as any;
                  roots.push(await withTimeout(Promise.resolve().then(() => module?.fetchCollectiblesCategories?.()), 4000), module);
              } catch {}
