          function DecorationGallery({ onSelect }: { onSelect: (item: { asset: string; skuId: string; uri: string }) => void }) {
              const [items, setItems] = useState<Array<{ asset: string; skuId: string; label: string; uri: string }>>([]);
              const [loading, setLoading] = useState(true);
              const [error, setError] = useState("");
              const [attempt, setAttempt] = useState(0);
              useEffect(() => {
                  let active = true;
                  setLoading(true); setError("");
                  void findDecorationCatalog().then(result => { if (active) { setItems(result); setLoading(false); } }, problem => { if (active) { setError(problem?.message || "Couldn't load decorations."); setLoading(false); } });
                  return () => { active = false; };
              }, [attempt]);
              return <FlatList data={items} keyExtractor={item => `${item.asset}:${item.skuId}`}
                  initialNumToRender={12} maxToRenderPerBatch={12} windowSize={5}
                  contentContainerStyle={{ padding: 12, paddingBottom: 48 }}
                  renderItem={({ item }) => <TableRow arrow label={item.label}
                      icon={<TableRow.Icon source={{ uri: item.uri }} />}
                      onPress={() => onSelect(item)} />}
                  ListEmptyComponent={<View style={{ padding: 16, gap: 8 }}><Text variant="text-sm/medium" color="text-muted">
                      {loading ? "Loading decorations…" : error || "No decorations loaded. Open Discord's Shop, then try again."}
                  </Text>{!loading && <Button text="Retry" onPress={() => setAttempt(value => value + 1)} />}</View>} />;
          }

          function CollectibleGallery({ kind, selected, onSelect }: { kind: "nameplates" | "effects" | "frames"; selected?: string; onSelect: (item: any) => void }) {
              const mounted = useRef(false);
              const request = useRef(0);
              const [catalog, setCatalog] = useState<Catalog | null>(collectiblesCatalog);
              const [error, setError] = useState("");
              const [query, setQuery] = useState("");
              const load = (force = false) => { if (!mounted.current) return; const revision = ++request.current; setError(""); loadCollectiblesCatalog(force).then(result => { if (mounted.current && request.current === revision) setCatalog(result); }, (problem: any) => { if (mounted.current && request.current === revision) setError(problem?.message || "Couldn't load Discord's catalog."); }); };
              useEffect(() => { mounted.current = true; if (!catalog) load(); return () => { mounted.current = false; request.current++; }; }, []);
              const items: any[] = (catalog?.[kind] || []).filter((item: any) => String(item.label || item.title || "").toLowerCase().includes(query.toLowerCase()));
              return <FlatList data={items} keyExtractor={item => item.skuId}
                  initialNumToRender={12} maxToRenderPerBatch={12} windowSize={5}
                  contentContainerStyle={{ padding: 12, paddingBottom: 48 }}
                  ListHeaderComponent={<TextInput value={query} placeholder={kind === "nameplates" ? "Search nameplates" : kind === "frames" ? "Search profile frames" : "Search profile effects"} placeholderTextColor="#777" autoCorrect={false} onChangeText={setQuery} style={{ color: "#fff", backgroundColor: "#1e1f22", borderRadius: 9, padding: 12, marginBottom: 8 }} />}
                  renderItem={({ item }) => <TableRow arrow label={item.label || item.title} subLabel={item.skuId === selected ? "Selected" : undefined}
                      icon={<Image source={{ uri: kind === "nameplates" ? nameplateAssetURL(item.asset) : item.preview }} style={kind === "nameplates" ? { width: 64, height: 22, borderRadius: 4 } : { width: 32, height: 32, borderRadius: 6 }} resizeMode="cover" />}
                      onPress={() => onSelect(item)} />}
                  ListEmptyComponent={<View style={{ padding: 16, gap: 8 }}>
                      <Text variant="text-sm/medium" color="text-muted">{error || (catalog ? "Nothing matches your search." : "Loading Discord's catalog…")}</Text>
                      {error ? <Button text="Retry" onPress={() => load(true)} /> : null}
                  </View>} />;
          }

          export default function FakeProfile() {
              const editorOwner = useRef(currentUserId);
              const [activeTab, setActiveTab] = useState<ProfileTab>("profile");
              const [showDetails, setShowDetails] = useState(false);
              useProxy(settings);
              const [, redraw] = useReducer(value => value + 1, 0);
              const navigation = NavigationNative.useNavigation();

              useEffect(() => {
                  fakeProfileEditorOpen = true;
                  let active = true;
                  void initializeFakeProfile().then(() => { if (active) { if (editorOwner.current == null) editorOwner.current = currentUserId; redraw(); } });
                  return () => { active = false; fakeProfileEditorOpen = false; };
              }, []);

              const update = (key: keyof PreviewSettings, value: any, refresh = false) => {
                  if (key === "nitroMonths" && value !== preview.nitroMonths) preview = { ...preview, nitroSince: "" };
                  rootSettings.fakeProfile = { ...preview, selectedBadges: { ...(preview.selectedBadges || {}) }, [key]: value, syncRevision: Date.now() };
                  preview = rootSettings.fakeProfile as PreviewSettings;
                  queueSharedPublish();
                  clearCache();
                  if (refresh) refreshPreview();
                  suppressOwnPullUntil = Date.now() + 15_000;
                  redraw();
              };

              const choose = async (key: "avatarMedia" | "bannerMedia", source: "photo" | "file") => {
                  try {
                      if (await (source === "photo" ? pickPhoto(key) : pickFile(key))) redraw();
                  } catch (error: any) {
                      diagnostics.last = error?.message || "Could not open the picker.";
                      redraw();
                      Alert.alert("FakeProfile", diagnostics.last);
                  }
              };

              const clearMedia = (field: "avatarMedia" | "bannerMedia") => {
                  try {
                      markMediaCleared(field);
                      rootSettings.fakeProfile = {
                          ...preview,
                          [field]: null,
                          selectedBadges: { ...(preview.selectedBadges || {}) }
                      } satisfies PreviewSettings;
                      preview = rootSettings.fakeProfile as PreviewSettings;
                      clearCache();
                      suppressOwnPullUntil = Date.now() + 15_000;
                      diagnostics.last = field === "bannerMedia" ? "Banner cleared" : "Profile picture cleared";
                      refreshPreview();
                      redraw();
                  } catch (error: any) {
                      diagnostics.last = error?.message || "Could not clear the image";
                      redraw();
                  }
              };

              const chooseDuration = (field: "nitroMonths" | "boostMonths", title: string, values: number[]) => {
                  const key = field === "nitroMonths" ? "FakeProfileNitroDuration" : "FakeProfileBoostDuration";
                  try {
                      simpleSheets.showSimpleActionSheet({
                          key,
                          header: {
                              title,
                              onClose: () => simpleSheets.hideActionSheet?.(key)
                          },
                          options: values.map(months => ({
                              label: field === "boostMonths" ? boosterLabel(months) : durationLabel(months),
                              onPress: () => {
                                  if (field === "nitroMonths") update("nitroEnabled", true, true);
                                  update(field, months, true);
                                  diagnostics.last = `${title}: ${durationLabel(months)}`;
                                  simpleSheets.hideActionSheet?.(key);
                              }
                          }))
                      });
                  } catch (error: any) {
                      diagnostics.last = error?.message || `Could not open ${title.toLowerCase()}`;
                      redraw();
                  }
              };

              const chooseNameStyle = (field: "fontId" | "effectId") => {
                  const options = nativeNameStyleOptions(field);
                  if (!options.length) { diagnostics.last = "Discord's username styles aren't available in this version"; redraw(); return; }
                  navigation.push("PUPU_CUSTOM_PAGE", { title: field === "fontId" ? "Username Font" : "Username Effect", render: () => <NameStylePicker field={field} onSelect={style => update("displayNameStyles", style, true)} /> });
              };

              const chooseExperimentalBadge = (group: typeof EXPERIMENTAL_BADGE_GROUPS[number]) => {
                  const key = `FakeProfileBadge_${group.id}`;
                  const selectTier = (id: string) => {
                      const selected = { ...preview.selectedBadges };
                      for (const tier of group.tiers) delete selected[tier.id];
                      if (id) selected[id] = true;
                      update("selectedBadges", selected, true);
                      simpleSheets.hideActionSheet?.(key);
                  };
                  try {
                      simpleSheets.showSimpleActionSheet({
                          key,
                          header: { title: group.label, onClose: () => simpleSheets.hideActionSheet?.(key) },
                          options: [
                              { label: "None", onPress: () => selectTier("") },
                              ...group.tiers.map(tier => ({ label: `${tier.name} · ${tier.milestone}`, onPress: () => selectTier(tier.id) }))
                          ]
                      });
                  } catch (error: any) {
                      Alert.alert("Couldn't open badges", error?.message || "Try opening the editor again.");
                  }
              };

              const chooseGiftBadge = () => {
                  const key = "FakeProfileGiftBadge";
                  try {
                      simpleSheets.showSimpleActionSheet({
                          key,
                          header: { title: "Choose gifting badge", onClose: () => simpleSheets.hideActionSheet?.(key) },
                          options: [
                              { label: "None", onPress: () => { update("giftLevel", -1, true); simpleSheets.hideActionSheet?.(key); } },
                              ...GIFT_LEVELS.map((gift, index) => ({
                                  label: gift.name,
                                  onPress: () => { update("giftLevel", index, true); simpleSheets.hideActionSheet?.(key); }
                              }))
                          ]
                      });
                  } catch (error: any) {
                      diagnostics.last = error?.message || "Could not open gifting badges";
                      redraw();
                  }
              };

              const MediaEditor = ({ label, field, banner = false }: { label: string; field: "avatarMedia" | "bannerMedia"; banner?: boolean }) => {
                  const value = preview[field];
                  return (
                      <View style={{ width: "100%", gap: 9, marginBottom: 16 }}>
                          <Text variant="heading-sm/semibold" color="text-normal">{label}</Text>
                          <Text variant="text-xs/medium" color="text-muted">Choose your file, then refresh here to load it.</Text>
