                          <Button text="Leave all servers" variant="destructive" size="sm" onPress={confirmLeaveAllServers} />
                          <Button text="Reset CloudCord" variant="destructive" size="sm" onPress={() => confirmResetCloudCordProfile(onReset)} />
                      </View>
                  </K.Section>
