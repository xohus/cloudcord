                  });
              }
              for (const method of ["getUserBannerURL", "getBannerURL", "getGuildMemberBannerURL"]) {
                  addPatch(method, bannerResolver, (args, original) => {
                      const uri = mediaUri("bannerMedia");
                      return preview.enabled && uri && requestIsCurrent(args) ? uri : original(...args);
                  });
              }

              const snowflakeUtils = findByProps("extractTimestamp") as any;
              addPatch("extractTimestamp", snowflakeUtils, (args, original) => {
                  const createdAt = profileDate(preview.createdAt);
                  return preview.enabled && createdAt && String(args?.[0] || "") === currentUserId ? createdAt.getTime() : original(...args);
              });

              connectMediaRenderer();
              connectIdentityRenderer();

              const bannerComposer = findByProps("getBanner", "getBannerColor") || findByProps("getBanner");
              addAfterPatch("getBanner", bannerComposer, (args, result) => {
                  const uri = mediaUri("bannerMedia");
                  const id = args?.[0]?.displayProfile?.userId || args?.[0]?.userId;
                  if (!preview.enabled || !uri || !result || !id || !isCurrentUser(id)) return;
                  return { ...result, bannerSrc: uri, source: { uri } };
              });

              diagnostics.last = `Connected ${diagnostics.patches} preview hooks`;
          }

          function refreshPreview() {
              clearCache();
              try { safeStore("MessageStore")?.emitChange?.(); } catch {}
              try { safeStore("UserStore")?.emitChange?.(); } catch {}
              try { safeStore("UserProfileStore")?.emitChange?.(); } catch {}
              setTimeout(() => {
                  try {
                      if (currentUserId && realCurrentUser) {
                          FluxDispatcher.dispatch({ type: "USER_UPDATE", user: realCurrentUser });
                      }
                  } catch (error: any) {
                      diagnostics.last = error?.message || "Preview saved; reopen the profile to refresh";
                  }
              }, 0);
          }

          // ---- Nitro & tools (device only) ----
          const EXTRAS_KEY = "cloudcordExtras";
          const NITRO_APP_ID = "521842831262875670";
          const NITRO_SKU = "521847234246082599";
          const NITRO_BASIC_SKU = "978380684370378762";
          // Discord's own plan IDs, so the embed shows the right product and length.
          const GIFT_PLANS = [
              { id: "511651880837840896", label: "Nitro 1 month", name: "Nitro Monthly", sku: NITRO_SKU, interval: 1, price: 999 },
              { id: "511651885459963904", label: "Nitro 1 year", name: "Nitro Yearly", sku: NITRO_SKU, interval: 2, price: 9999 },
              { id: "978380692553465866", label: "Basic 1 month", name: "Nitro Basic Monthly", sku: NITRO_BASIC_SKU, interval: 1, price: 299 },
              { id: "1024422698568122368", label: "Basic 1 year", name: "Nitro Basic Yearly", sku: NITRO_BASIC_SKU, interval: 2, price: 2999 }
          ];
          // Discord's gift box designs (PremiumGiftStyles).
          const GIFT_STYLES = [
              { value: 4, label: "Standard box" }, { value: 2, label: "Box" }, { value: 1, label: "Snow globe" }, { value: 3, label: "Cup" },
              { value: 5, label: "Cake" }, { value: 6, label: "Chest" }, { value: 7, label: "Coffee" }, { value: 8, label: "Seasonal box" },
              { value: 9, label: "Seasonal cake" }, { value: 10, label: "Seasonal chest" }, { value: 11, label: "Seasonal coffee" }, { value: 12, label: "Nitroween" }
          ];
          type ExtrasState = { fakeNitro?: boolean; giftCode?: string; giftPlan?: string; giftStyle?: number; boosts?: Record<string, any> };
          const fakeRequestIds = new Set<string>();
          function extrasState(): ExtrasState { const value = (settings as any)[EXTRAS_KEY]; return value && typeof value === "object" ? value : {}; }
          function setExtras(next: ExtrasState) { (settings as any)[EXTRAS_KEY] = next; }
          function extrasHttp() { for (const candidate of [findByProps("getAPIBaseURL", "get"), (findByProps("HTTP") as any)?.HTTP, findByProps("get", "post", "put", "del")]) if (typeof (candidate as any)?.get === "function") return candidate as any; return null; }
          let ownedNitroOverride: { state: any; ownerId: string; previous: any } | null = null;
          function restoreFakeNitroOverride(accountChanged = false) {
              const owned = ownedNitroOverride;
              ownedNitroOverride = null;
              if (!owned || owned.state.premiumTypeOverride !== 2) return false;
              owned.state.premiumTypeOverride = accountChanged ? undefined : owned.previous;
              return true;
          }
          function applyFakeNitro() {
              try {
                  const store = findByStoreName("OverridePremiumTypeStore") as any;
                  const state = store?.getState?.();
                  if (!state) return;
                  const ownerId = (findByStoreName("UserStore") as any)?.getCurrentUser?.()?.id || "";
                  let changed = false;
                  if (ownedNitroOverride && (ownedNitroOverride.state !== state || ownedNitroOverride.ownerId !== ownerId)) changed = restoreFakeNitroOverride(ownedNitroOverride.state === state);
                  if (extrasState().fakeNitro && ownerId && state.premiumTypeActual !== 2) {
                      if (!ownedNitroOverride && state.premiumTypeOverride !== 2) ownedNitroOverride = { state, ownerId, previous: state.premiumTypeOverride };
                      if (state.premiumTypeOverride !== 2) { state.premiumTypeOverride = 2; changed = true; }
                  } else changed = restoreFakeNitroOverride() || changed;
                  if (changed) store.emitChange?.();
              } catch {}
          }
          function newGiftCode() {
              // Same alphabet Discord uses for gift codes.
              const chars = "ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789";
              let code = ""; for (let i = 0; i < 16; i++) code += chars[Math.floor(Math.random() * chars.length)];
              return code;
          }
          function fakeGiftBody(code: string) {
              let me: any = null; try { me = (findByStoreName("UserStore") as any)?.getCurrentUser?.(); } catch {}
              const state = extrasState();
              const plan = GIFT_PLANS.find(item => item.id === state.giftPlan) ?? GIFT_PLANS[0];
              return { code, sku_id: plan.sku, application_id: NITRO_APP_ID, uses: 0, max_uses: 1, redeemed: false, flags: 0,
                  expires_at: new Date(Date.now() + 48 * 3600000).toISOString(), subscription_plan_id: plan.id,
                  subscription_plan: { id: plan.id, name: plan.name, interval: plan.interval, interval_count: 1, tax_inclusive: true, sku_id: plan.sku, currency: "usd", price: plan.price, price_tier: null },
                  user: me ? { id: me.id, username: me.username, global_name: me.globalName, avatar: me.avatar, discriminator: me.discriminator ?? "0" } : undefined,
                  store_listing: { id: plan.sku, summary: "", sku: { id: plan.sku, type: 5, application_id: NITRO_APP_ID, name: plan.sku === NITRO_BASIC_SKU ? "Nitro Basic" : "Nitro", flags: 0, premium: true, product_line: 1 } },
                  gift_style: state.giftStyle ?? 4, batch_id: null, promotion: null };
          }
          let giftHookInstalled = false;
          // Only the link made on this device resolves as a gift, and only here.
          function installGiftHook() {
              if (giftHookInstalled) return;
              giftHookInstalled = true;
              // Discord resolves gift links with its own request helper, so the lookup for
              // our code 404s. Answer that failure with the fake gift right after it,
              // without wrapping the dispatcher itself (Flux forbids nested dispatches).
              FluxDispatcher.subscribe("GIFT_CODE_RESOLVE_FAILURE", (action: any) => {
                  const code = extrasState().giftCode;
                  if (!code || action?.code !== code) return;
                  setTimeout(() => { try { FluxDispatcher.dispatch({ type: "GIFT_CODE_RESOLVE_SUCCESS", giftCode: fakeGiftBody(code) }); } catch {} }, 0);
              });
              const http = extrasHttp(); if (!http) return;
              const match = (req: any) => typeof req?.url === "string" ? req.url.match(/\/entitlements\/gift-codes\/([A-Za-z0-9-]+)(\/redeem)?/) : null;
              instead("get", http, (args: any[], original: any) => {
                  const m = match(args[0]); const code = extrasState().giftCode;
                  if (m && !m[2] && code && m[1] === code) return Promise.resolve({ ok: true, status: 200, body: fakeGiftBody(code), headers: {} });
                  return original(...args);
              });
              instead("post", http, (args: any[], original: any) => {
                  const m = match(args[0]); const code = extrasState().giftCode;
                  if (m?.[2] && code && m[1] === code) { showToast("This is your fake gift. It only looks real on your device."); return Promise.reject({ ok: false, status: 400, body: { code: 50050, message: "This gift is only a preview on this device." } }); }
                  return original(...args);
              });
          }
          type FakeRequest = { id: string; user: any; since: string };
          const rawUser = (user: any) => ({ id: user.id, username: user.username, global_name: user.globalName ?? user.global_name ?? null, avatar: user.avatar ?? null, discriminator: user.discriminator ?? "0", public_flags: user.publicFlags ?? user.public_flags ?? 0, bot: user.bot ?? false });
          function savedFakeRequests(): FakeRequest[] { const list = (extrasState() as any).fakeRequests; return Array.isArray(list) ? list.filter((item: any) => item && /^\d{17,20}$/.test(item.id) && item.user) : []; }
          function showFakeRequest(item: FakeRequest) {
              fakeRequestIds.add(item.id);
              FluxDispatcher.dispatch({ type: "RELATIONSHIP_ADD", relationship: { id: item.id, type: 3, user: item.user, since: item.since, nickname: null }, shouldNotify: false });
          }
          // Saved requests stay until removed: Discord reloads relationships on every
          // connect, so they are shown again after each start or reconnect.
          function restoreFakeRequests() {
              const relationships = findByStoreName("RelationshipStore") as any;
              for (const item of savedFakeRequests()) if ((relationships?.getRelationshipType?.(item.id) ?? 0) === 0) showFakeRequest(item);
          }
          // Accepts an ID, a mention like <@123> or a profile link; keeps only the digits.
          function parseUserId(text: string) { return (String(text).match(/\d{17,20}/) || [""])[0]; }
          async function addFakeFriendRequest(input: string) {
              const id = parseUserId(input);
              if (!id) { Alert.alert("Fake friend request", "Paste a user ID, mention or profile link."); return false; }
              let user: any = (findByStoreName("UserStore") as any)?.getUser?.(id);
              if (!user) { try { user = (await extrasHttp()?.get({ url: "/users/" + id }))?.body; } catch {} }
              if (!user) { Alert.alert("Fake friend request", "Couldn't find that user."); return false; }
              if (((findByStoreName("RelationshipStore") as any)?.getRelationshipType?.(id) ?? 0) !== 0) { Alert.alert("Fake friend request", "You already have a request or friendship with this user."); return false; }
              const item: FakeRequest = { id, user: rawUser(user), since: new Date().toISOString() };
              setExtras({ ...extrasState(), fakeRequests: [...savedFakeRequests().filter(entry => entry.id !== id), item] } as any);
              showFakeRequest(item);
              showToast("Fake friend request added. Check Friends, Pending.");
              return true;
          }
          function clearFakeFriendRequests() {
              const ids = new Set([...fakeRequestIds, ...savedFakeRequests().map(item => item.id)]);
              for (const id of ids) FluxDispatcher.dispatch({ type: "RELATIONSHIP_REMOVE", relationship: { id, type: 3 } });
              fakeRequestIds.clear();
              setExtras({ ...extrasState(), fakeRequests: [] } as any);
          }
          // ---- Fake boost (device only) ----
          type BoostFake = { level?: boolean; booster?: boolean };
          function boostFor(guildId?: string | null): BoostFake | undefined { return guildId ? (extrasState() as any).boosts?.[guildId] : undefined; }
          const guildOverlays = new WeakMap<object, any>();
          const memberOverlays = new WeakMap<object, any>();
          let boostHooksInstalled = false;
          function installBoostHooks() {
              if (boostHooksInstalled) return;
              const guilds = findByStoreName("GuildStore") as any;
              const members = findByStoreName("GuildMemberStore") as any;
              if (!guilds || !members) return;
              boostHooksInstalled = true;
              after("getGuild", guilds, (args: any[], guild: any) => {
                  if (!guild || !boostFor(args[0])?.level) return guild;
                  let overlay = guildOverlays.get(guild);
                  if (!overlay) guildOverlays.set(guild, overlay = new Proxy(guild, { get: (target: any, key) => key === "premiumTier" ? 3 : key === "premiumSubscriberCount" ? Math.max(14, target.premiumSubscriberCount ?? 0) : Reflect.get(target, key, target) }));
                  return overlay;
              });
              after("getMember", members, (args: any[], member: any) => {
                  // Called constantly: bail out early unless this server has a fake boost.
                  if (!member || member.premiumSince || !boostFor(args[0])?.booster) return member;
                  if (args[1] !== (findByStoreName("UserStore") as any)?.getCurrentUser?.()?.id) return member;
                  let overlay = memberOverlays.get(member);
                  if (!overlay) memberOverlays.set(member, overlay = { ...member, premiumSince: new Date(Date.now() - 90 * 86400000).toISOString() });
                  return overlay;
              });
          }
          // 8 = boosted, 9/10/11 = boosted and the server reached level 1/2/3.
          function sendFakeBoostMessage(times: number, reachedLevel: number) {
              const channelId = (findByStoreName("SelectedChannelStore") as any)?.getChannelId?.();
              const channel = channelId ? (findByStoreName("ChannelStore") as any)?.getChannel?.(channelId) : null;
              const me = (findByStoreName("UserStore") as any)?.getCurrentUser?.();
              if (!channel?.guild_id || !me) { Alert.alert("Fake boost", "Open a server text channel first, then come back."); return; }
              const snowflake = findByProps("fromTimestamp", "extractTimestamp") as any;
              FluxDispatcher.dispatch({ type: "MESSAGE_CREATE", channelId, optimistic: false, isPushNotification: false, message: {
                  id: snowflake?.fromTimestamp?.(Date.now()) ?? String((Date.now() - 1420070400000) * 4194304), type: reachedLevel > 0 ? 8 + reachedLevel : 8, content: times > 1 ? String(times) : "",
                  channel_id: channelId, guild_id: channel.guild_id, timestamp: new Date().toISOString(), edited_timestamp: null, flags: 0,
                  author: { id: me.id, username: me.username, global_name: me.globalName, avatar: me.avatar, discriminator: me.discriminator ?? "0", public_flags: me.publicFlags ?? 0 },
                  attachments: [], embeds: [], mentions: [], mention_roles: [], mention_everyone: false, pinned: false, tts: false, components: [] } });
              showToast("Fake boost message added to the channel.");
          }
          function BoostSection({ refresh }: { refresh: () => void }) {
              const K = require("@core/ui/settings/components/ProfileEditorKit") as typeof import("@core/ui/settings/components/ProfileEditorKit");
              const [times, setTimes] = useState(1);
              const [reached, setReached] = useState(0);
              const guildId = (findByStoreName("SelectedGuildStore") as any)?.getGuildId?.();
              const guild = guildId ? (findByStoreName("GuildStore") as any)?.getGuild?.(guildId) : null;
              const fake = boostFor(guildId) ?? {};
