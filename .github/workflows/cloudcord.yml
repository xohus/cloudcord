              const decoration = { asset, skuId, sku_id: skuId };
              setOwnValue(target, "avatarDecorationData", decoration);
              setOwnValue(target, "avatar_decoration_data", decoration);
          }

          let collectiblesCatalog: Catalog | null = null;
          let collectiblesRequest: Promise<Catalog> | null = null;
          let collectiblesGeneration = 0;
          function loadCollectiblesCatalog(force = false): Promise<Catalog> {
              if (collectiblesCatalog && !force) return Promise.resolve(collectiblesCatalog);
              if (collectiblesRequest) return collectiblesRequest;
              const generation = ++collectiblesGeneration;
              const store = () => { try { return safeStore("CollectiblesCategoryStore") as any; } catch { return null; } };
              const shopProducts = () => { const products = store()?.products; try { return products ? [...products.values()] : []; } catch { return []; } };
              // Discord's REST helper has a different shape across mobile builds.
              const http = (() => { for (const candidate of [findByProps("getAPIBaseURL", "get"), (findByProps("HTTP") as any)?.HTTP, findByProps("get", "post", "put", "del")]) if (typeof (candidate as any)?.get === "function") return candidate as any; return null; })();
