          let realCurrentUser: any = null;
          let userCache = new WeakMap<object, any>();
          let profileCache = new WeakMap<object, any>();
          const SHARED_PROFILE_API = "https://getcloudcord.com";
          const sharedProfiles = ((globalThis as any).__CLOUDCORD_SHARED_PROFILES__ ||= new Map<string, any>()) as Map<string, any>;
          const sharedProfileFetchedAt = ((globalThis as any).__CLOUDCORD_SHARED_PROFILE_FETCHED_AT__ ||= new Map<string, number>()) as Map<string, number>;
          const sharedRequests = new Set<string>();
          let publishTimer: ReturnType<typeof setTimeout> | null = null;
          let sharedSyncTimer: ReturnType<typeof setInterval> | null = null;
          let fakeProfileEditorOpen = false;
          let suppressOwnPullUntil = 0;
          const REPLACE_BADGES_SYNC_ID = "__cc_replace_real_badges";

          function mediaClearPending(key: "avatarMedia" | "bannerMedia") {
              return Number(rootSettings.fakeProfileMediaCleared?.[key] || 0) > 0;
          }

          function markMediaCleared(key: "avatarMedia" | "bannerMedia") {
              rootSettings.fakeProfileMediaCleared = {
                  ...(rootSettings.fakeProfileMediaCleared || {}),
                  [key]: Date.now()
              };
          }

          function unmarkMediaCleared(key: "avatarMedia" | "bannerMedia") {
              const pending = { ...(rootSettings.fakeProfileMediaCleared || {}) };
              delete pending[key];
              rootSettings.fakeProfileMediaCleared = pending;
          }

          function localHasFakeBadges() {
              return preview.nitroEnabled || preview.boostMonths > 0 || preview.giftLevel >= 0 || Object.values(preview.selectedBadges || {}).some(Boolean);
          }

          function shouldReplaceLocalBadges() {
              return preview.replaceBadges && localHasFakeBadges();
          }

          function remoteReplaceBadges(data: any) {
              return data?.replaceRealBadges === true || (Array.isArray(data?.customBadgeIds) && data.customBadgeIds.includes(REPLACE_BADGES_SYNC_ID));
          }

          function remoteNitroEnabled(data: any) {
              return data?.nitro === true || data?.nitro == null && Number(data?.nitroLevel ?? -1) >= 0;
          }

          function remoteHasFakeBadges(data: any) {
              const custom = Array.isArray(data?.customBadgeIds) ? data.customBadgeIds.filter((id: string) => id !== REPLACE_BADGES_SYNC_ID) : [];
              return Number(data?.badgeFlags || 0) !== 0 || remoteNitroEnabled(data) || Number(data?.boostMonths ?? -1) >= 0 || Number(data?.giftLevel ?? -1) >= 0 || custom.length > 0;
          }

          function shouldReplaceSharedBadges(data: any) {
              return data?.__localBadges === true || remoteReplaceBadges(data) && remoteHasFakeBadges(data);
          }

          async function shareableMedia(key: "avatarMedia" | "bannerMedia") {
              const uri = mediaUri(key);
              if (!uri || /^(?:https?:|data:)/i.test(uri)) return uri || null;
              try {
                  const blob = await (await fetch(uri)).blob();
                  if (blob.size > 1_250_000) return null;
                  const Reader = (globalThis as any).FileReader;
                  if (!Reader) return null;
                  return await new Promise<string | null>(resolve => {
                      const reader = new Reader();
                      reader.onload = () => resolve(typeof reader.result === "string" ? reader.result : null);
                      reader.onerror = () => resolve(null);
                      reader.readAsDataURL(blob);
                  });
              } catch { return null; }
          }

          async function ownSharedProfile() {
              return {
                  username: preview.username,
                  globalName: preview.displayName,
                  avatar: await shareableMedia("avatarMedia"),
                  banner: await shareableMedia("bannerMedia"),
                  nitro: preview.nitroEnabled,
                  nitroLevel: preview.nitroEnabled ? Math.max(0, NITRO_DURATIONS.indexOf(preview.nitroMonths)) : -1,
                  nitroSince: preview.nitroEnabled ? monthsAgo(preview.nitroMonths).toISOString().slice(0, 10) : null,
                  boostMonths: Math.max(-1, BOOST_DURATIONS.indexOf(preview.boostMonths) - 1),
                  giftLevel: preview.giftLevel,
                  avatarDecoration: preview.avatarDecoration || null,
                  avatarDecorationSku: preview.avatarDecorationSku || null,
                  profileColorsEnabled: preview.profileColorsEnabled,
                  primaryColor: preview.profileColorsEnabled ? colorNumber(preview.primaryColor) : null,
                  accentColor: preview.profileColorsEnabled ? colorNumber(preview.accentColor) : null,
                  bio: preview.bio,
                  pronouns: preview.pronouns,
                  createdAt: preview.createdAt || null,
                  signupDate: preview.signupDate || null,
                  joinedSince: preview.signupDate || null,
                  oldName: preview.oldName,
                  badgeFlags: BADGES.reduce((flags, [id, , flag]) => flag && preview.selectedBadges?.[id] ? flags | flag : flags, 0),
                  hiddenBadgeIds: [...preview.hiddenBadgeIds],
                  badgeOrder: [...preview.badgeOrder],
                  customBadgeIds: [
                      ...BADGES.filter(([id, , , , customId]) => customId && preview.selectedBadges?.[id]).map(([, , , , customId]) => customId as string),
                      ...(preview.replaceBadges ? [REPLACE_BADGES_SYNC_ID] : [])
                  ],
                  syncRevision: Number(preview.syncRevision || 0)
              };
          }

          async function publishSharedProfile() {
              if (!preview.enabled || !currentUserId) return;
              const saved = rootSettings.fakeProfileShare || {};
              const path = saved.id ? `/v1/profiles/${encodeURIComponent(saved.id)}` : "/v1/profiles";
              const profileSnapshot = await ownSharedProfile();
              const latestResponse = await fetch(`${SHARED_PROFILE_API}/v1/profiles/user/${encodeURIComponent(currentUserId)}`, { cache: "no-store" });
              if (latestResponse.ok) {
                  const latest = await latestResponse.json() as any;
                  profileSnapshot.syncRevision = Math.max(Date.now(), Number(profileSnapshot.syncRevision || 0), Number(latest?.profile?.syncRevision || 0) + 1);
                  preview.syncRevision = profileSnapshot.syncRevision;
                  rootSettings.fakeProfile = { ...preview, selectedBadges: { ...(preview.selectedBadges || {}) } };
                  preview = rootSettings.fakeProfile as PreviewSettings;
              }
              const clearSnapshot = { ...(rootSettings.fakeProfileMediaCleared || {}) };
              const response = await fetch(`${SHARED_PROFILE_API}${path}`, {
                  method: saved.id ? "PUT" : "POST",
                  headers: {
                      "Content-Type": "application/json",
                      ...(saved.editToken ? { Authorization: `Bearer ${saved.editToken}` } : {})
                  },
                  body: JSON.stringify({ ownerId: currentUserId, profile: profileSnapshot })
              });
              if (!response.ok) {
                  if (response.status === 429) {
                      const retrySeconds = Math.max(2, Number(response.headers.get("retry-after") || 10));
                      if (publishTimer) clearTimeout(publishTimer);
                      publishTimer = setTimeout(() => void publishSharedProfile().catch(error => {
                          diagnostics.last = error?.message || "Sharing will retry later";
                      }), retrySeconds * 1000);
                      diagnostics.last = `CloudCord sharing paused; retrying in ${retrySeconds}s`;
                      return;
                  }
                  if (response.status === 409) {
                      throw new Error("Your shared profile changed. Try saving again.");
                  }
                  if (saved.id && (response.status === 401 || response.status === 404)) {
                      delete rootSettings.fakeProfileShare;
                      return publishSharedProfile();
                  }
                  throw new Error(`CloudCord sharing failed (${response.status})`);
              }
              const result = await response.json() as any;
              if (!saved.id) rootSettings.fakeProfileShare = { id: result.id, editToken: result.editToken };
              // A successful complete-snapshot update makes a local media
              // tombstone authoritative. Only clear it after the server has
              // accepted the null value; an earlier pull must not resurrect a
              // GIF that the user just removed.
              for (const key of ["avatarMedia", "bannerMedia"] as const) {
                  const serverField = key === "avatarMedia" ? "avatar" : "banner";
                  if ((profileSnapshot as any)[serverField] == null
                      && clearSnapshot[key]
                      && rootSettings.fakeProfileMediaCleared?.[key] === clearSnapshot[key]) {
                      unmarkMediaCleared(key);
                  }
              }
              diagnostics.last = "Fake Profile shared automatically";
          }

          function queueSharedPublish() {
              if (!preview.enabled) return;
              if (publishTimer) clearTimeout(publishTimer);
              publishTimer = setTimeout(() => void publishSharedProfile().catch(error => {
                  diagnostics.last = error?.message || "Sharing will retry later";
              }), 1200);
          }

          async function pullOwnSharedProfile(force = false) {
              // The server contains the last completed save. Do not let the
              // background poll replace fields while the user is editing, or
              // immediately after a newer local revision was queued.
              if (!force && (fakeProfileEditorOpen || Date.now() < suppressOwnPullUntil)) return;
              if (!currentUserId) return;
              const now = Date.now();
              if ((pullOwnSharedProfile as any).pending || now - Number((pullOwnSharedProfile as any).lastAttempt || 0) < 12000) return;
              (pullOwnSharedProfile as any).pending = true;
              (pullOwnSharedProfile as any).lastAttempt = now;
              try {
                  const response = await fetch(`${SHARED_PROFILE_API}/v1/profiles/user/${encodeURIComponent(currentUserId)}`);
                  if (response.status === 404) {
                      if (preview.enabled) queueSharedPublish();
                      return;
                  }
                  if (!response.ok) return;
                  const payload = await response.json() as any;
                  const data = payload?.profile ?? payload;
                  if (!data || typeof data !== "object") return;
                  const selectedBadges = { ...(preview.selectedBadges || {}) };
                  const customBadgeIds = Array.isArray(data.customBadgeIds) ? data.customBadgeIds : [];
                  for (const [id, , flag, , customId] of BADGES) {
                      selectedBadges[id] = customId ? customBadgeIds.includes(customId) : !!(Number(data.badgeFlags || 0) & flag);
                  }
                  rootSettings.fakeProfile = preview = {
                      ...preview,
                      enabled: true,
                      username: data.username || preview.username,
                      displayName: data.globalName || data.displayName || preview.displayName,
                      avatarMedia: mediaClearPending("avatarMedia") ? null : data.avatar ? { uri: data.avatar } : null,
                      bannerMedia: mediaClearPending("bannerMedia") ? null : data.banner ? { uri: data.banner } : null,
                      nitroEnabled: remoteNitroEnabled(data),
                      nitroMonths: remoteNitroEnabled(data) ? (NITRO_DURATIONS[Number(data.nitroLevel)] || 0) : 0,
                      boostMonths: data.boostMonths >= 0 ? (BOOST_DURATIONS[Number(data.boostMonths) + 1] || 0) : 0,
                      giftLevel: Number.isInteger(data.giftLevel) ? data.giftLevel : -1,
                      avatarDecoration: String(data.avatarDecoration || ""),
                      avatarDecorationSku: String(data.avatarDecorationSku || ""),
                      profileColorsEnabled: data.profileColorsEnabled === true || data.primaryColor != null || data.accentColor != null,
                      primaryColor: colorHex(data.primaryColor, preview.primaryColor),
                      accentColor: colorHex(data.accentColor, preview.accentColor),
                      bio: String(data.bio || ""),
                      pronouns: String(data.pronouns || ""),
                      createdAt: String(data.createdAt || ""),
                      signupDate: String(data.signupDate || data.joinedSince || ""),
                      oldName: String(data.oldName || ""),
                      replaceBadges: remoteReplaceBadges(data),
                      selectedBadges,
                      hiddenBadgeIds: Array.isArray(data.hiddenBadgeIds) ? data.hiddenBadgeIds : [],
                      badgeOrder: Array.isArray(data.badgeOrder) ? data.badgeOrder : [],
                      syncRevision: Number(data.syncRevision || 0)
                  } satisfies PreviewSettings;
                  clearCache();
                  diagnostics.last = "Fake Profile synced across devices";
              } catch {} finally {
                  (pullOwnSharedProfile as any).pending = false;
              }
          }

          function requestSharedProfile(userId?: string, force = false) {
              const id = String(userId || "");
              const fetchedAt = sharedProfileFetchedAt.get(id) || 0;
              if (!/^\d{15,22}$/.test(id) || id === currentUserId || sharedRequests.has(id) || (!force && sharedProfiles.has(id) && Date.now() - fetchedAt < 5000)) return;
              sharedRequests.add(id);
              void fetch(`${SHARED_PROFILE_API}/v1/profiles/user/${encodeURIComponent(id)}?v=${Date.now()}`, { cache: "no-store" })
                  .then(response => {
                      if (response.ok) return response.json();
                      if (response.status === 404) return null;
                      throw new Error(`Shared profile unavailable (${response.status})`);
                  })
                  .then(payload => {
                      const profile = payload?.profile ?? payload;
                      // Cache a missing profile too. Profile surfaces can render several
                      // times in quick succession and must not turn one 404 into a loop.
                      const next = profile && typeof profile === "object" ? profile : {};
                      const previous = sharedProfiles.get(id);
                      const changed = JSON.stringify(previous ?? null) !== JSON.stringify(next);
                      sharedProfiles.set(id, next);
                      sharedProfileFetchedAt.set(id, Date.now());
                      if (!changed) return;
                      for (const refresh of identityRefreshers) refresh();
                      try { safeStore("UserStore")?.emitChange?.(); } catch {}
                      try { safeStore("UserProfileStore")?.emitChange?.(); } catch {}
                  })
                  .catch(() => {})
                  .finally(() => sharedRequests.delete(id));
          }

          function getProfileOverride(id: string) {
              const local = (settings as any).cloudcordLocalProfiles?.[id];
              const shared = sharedProfiles.get(id);
              if (!local) return shared;
              return { ...(shared || {}), ...local, __localBadges: Object.prototype.hasOwnProperty.call(local, "badgeFlags") || Object.prototype.hasOwnProperty.call(local, "customBadgeIds") };
          }

          function refreshSharedProfiles() {
              for (const id of sharedProfiles.keys()) requestSharedProfile(id, true);
          }

          function cloneSharedUser(original: any, data: any) {
              if (!original || typeof original !== "object" || !data) return original;
              const cloned = Object.assign(Object.create(Object.getPrototypeOf(original) || Object.prototype), original);
              if (data.username) {
                  const username = String(data.username);
                  setOwnValue(cloned, "username", username);
                  setOwnValue(cloned, "userName", username);
                  setOwnValue(cloned, "tag", `@${username}`);
                  setOwnValue(cloned, "getTag", () => `${username}#0000`);
              }
              if (data.globalName || data.displayName) {
                  const displayName = String(data.globalName || data.displayName);
                  setOwnValue(cloned, "globalName", displayName);
                  setOwnValue(cloned, "global_name", displayName);
                  setOwnValue(cloned, "displayName", displayName);
                  setOwnValue(cloned, "name", displayName);
                  setOwnValue(cloned, "getGlobalName", () => displayName);
              }
              if (data.avatar) { setOwnValue(cloned, "avatarURL", data.avatar); setOwnValue(cloned, "avatarUrl", data.avatar); setOwnValue(cloned, "getAvatarURL", () => data.avatar); }
              if (data.avatarDecoration) setOwnValue(cloned, "avatarDecorationData", { asset: decorationAsset(data.avatarDecoration), skuId: data.avatarDecorationSku || "cloudcord-decoration" });
              if (data.profileColorsEnabled === true) {
                  if (data.primaryColor != null) setOwnValue(cloned, "primaryColor", Number(data.primaryColor));
                  if (data.accentColor != null) setOwnValue(cloned, "accentColor", Number(data.accentColor));
                  if (data.primaryColor != null || data.accentColor != null) setOwnValue(cloned, "themeColors", [Number(data.primaryColor || data.accentColor), Number(data.accentColor || data.primaryColor)]);
              }
              if (data.banner) { setOwnValue(cloned, "bannerURL", data.banner); setOwnValue(cloned, "bannerUrl", data.banner); setOwnValue(cloned, "getBannerURL", () => data.banner); }
              if (shouldReplaceSharedBadges(data)) {
                  const sharedFlags = Number(data.badgeFlags || 0);
                  setOwnValue(cloned, "publicFlags", sharedFlags);
                  setOwnValue(cloned, "public_flags", sharedFlags);
                  setOwnValue(cloned, "flags", sharedFlags);
                  setOwnValue(cloned, "badges", sharedBadgeObjects(original.badges, userIdFromProfile(original), data));
                  setOwnValue(cloned, "profileBadges", sharedBadgeObjects(original.profileBadges, userIdFromProfile(original), data));
                  setOwnValue(cloned, "premiumSince", null);
                  setOwnValue(cloned, "premiumGuildSince", null);
                  setOwnValue(cloned, "legacyUsername", null);
              }
              if (remoteNitroEnabled(data)) {
                  const since = sharedNitroSince(data);
                  setOwnValue(cloned, "premiumType", 2);
                  setOwnValue(cloned, "premium_type", 2);
                  setOwnValue(cloned, "premiumSince", since);
                  setOwnValue(cloned, "premium_since", since.toISOString());
              }
              return cloned;
          }

          function decorateSharedProfile(original: any, userId: string, data: any, depth = 0) {
              if (!original || typeof original !== "object" || !data) return original;
              const cloned = Object.assign(Object.create(Object.getPrototypeOf(original) || Object.prototype), original);
              setOwnValue(cloned, "badges", sharedBadgeObjects(original.badges, userId, data));
              setOwnValue(cloned, "profileBadges", sharedBadgeObjects(original.profileBadges, userId, data));
              applyAvatarDecoration(cloned, data);
              if (cloned.user) setOwnValue(cloned, "user", cloneSharedUser(cloned.user, data));
              // Mobile profile hooks return nested snapshots. Updating only the
              // outer fields leaves the actual header's userProfile.user real.
              if (depth < 3) {
                  for (const key of ["userProfile", "displayProfile", "guildMemberProfile", "profile"]) {
                      const nested = original[key];
                      if (nested && nested !== original && typeof nested === "object") setOwnValue(cloned, key, decorateSharedProfile(nested, userId, data, depth + 1));
                  }
              }
              if (data.username) setOwnValue(cloned, "username", data.username);
              if (data.globalName || data.displayName) {
                  const displayName = data.globalName || data.displayName;
                  setOwnValue(cloned, "globalName", displayName);
                  setOwnValue(cloned, "global_name", displayName);
                  setOwnValue(cloned, "displayName", displayName);
                  setOwnValue(cloned, "name", displayName);
              }
              if (data.username) {
                  const username = String(data.username);
                  setOwnValue(cloned, "userName", username);
                  setOwnValue(cloned, "tag", `@${username}`);
                  setOwnValue(cloned, "getTag", () => `${username}#0000`);
              }
              if (data.avatar) {
                  setOwnValue(cloned, "avatarURL", data.avatar);
                  setOwnValue(cloned, "avatarUrl", data.avatar);
                  setOwnValue(cloned, "avatarSrc", data.avatar);
                  setOwnValue(cloned, "getAvatarURL", () => data.avatar);
              }
              if (data.banner) {
                  setOwnValue(cloned, "banner", data.banner);
                  setOwnValue(cloned, "bannerURL", data.banner);
                  setOwnValue(cloned, "bannerUrl", data.banner);
                  setOwnValue(cloned, "bannerSrc", data.banner);
                  setOwnValue(cloned, "getBannerURL", () => data.banner);
                  setOwnValue(cloned, "getPreviewBanner", () => data.banner);
              }
              if (shouldReplaceSharedBadges(data)) {
                  const sharedFlags = Number(data.badgeFlags || 0);
                  setOwnValue(cloned, "publicFlags", sharedFlags);
                  setOwnValue(cloned, "public_flags", sharedFlags);
                  setOwnValue(cloned, "flags", sharedFlags);
              }
              if (data.bio != null) setOwnValue(cloned, "bio", data.bio);
              if (data.pronouns != null) setOwnValue(cloned, "pronouns", data.pronouns);
              if (remoteNitroEnabled(data)) {
                  const since = sharedNitroSince(data);
                  setOwnValue(cloned, "premiumType", 2);
                  setOwnValue(cloned, "premium_type", 2);
                  setOwnValue(cloned, "premiumSince", since);
                  setOwnValue(cloned, "premium_since", since.toISOString());
              }
              const createdAt = profileDate(data.createdAt);
              const joinedAt = profileDate(data.signupDate || data.joinedSince);
              if (createdAt) setOwnValue(cloned, "createdAt", createdAt);
              if (joinedAt) { setOwnValue(cloned, "joinedAt", joinedAt); setOwnValue(cloned, "memberSince", joinedAt); }
              if (data.profileColorsEnabled === true) {
                  if (data.accentColor != null) setOwnValue(cloned, "accentColor", data.accentColor);
                  if (data.primaryColor != null) setOwnValue(cloned, "primaryColor", data.primaryColor);
                  if (data.primaryColor != null || data.accentColor != null) setOwnValue(cloned, "themeColors", [Number(data.primaryColor || data.accentColor), Number(data.accentColor || data.primaryColor)]);
              }
              setOwnValue(cloned, "userId", userId);
              return cloned;
          }

          function clearCache() {
              userCache = new WeakMap();
              profileCache = new WeakMap();
          }

          function mediaUri(key: "avatarMedia" | "bannerMedia") {
              return String(preview[key]?.uri || "");
          }

          function safeStore(name: string) {
              try { return findByStoreName(name) as any; }
              catch { return null; }
          }

          function setOwnValue(target: any, key: string, value: any) {
              if (!target) return;
              try {
                  Object.defineProperty(target, key, { configurable: true, enumerable: true, writable: true, value });
              } catch {
                  try { target[key] = value; } catch {}
              }
          }

          function monthsAgo(months: number) {
              const date = new Date();
              date.setMonth(date.getMonth() - months);
              return date;
          }

          function profileDate(value: unknown) {
              if (!value) return null;
              const date = new Date(`${String(value).slice(0, 10)}T12:00:00Z`);
              return Number.isNaN(date.getTime()) ? null : date;
          }

          function durationLabel(months: number) {
              if (!months) return "None";
              if (months % 12 === 0) {
                  const years = months / 12;
                  return `${years} ${years === 1 ? "year" : "years"}`;
              }
              return `${months} ${months === 1 ? "month" : "months"}`;
          }

          function boosterLabel(months: number) {
              if (!months) return "None";
              return `${months} ${months === 1 ? "Month" : "Months"}`;
          }

          function milestoneIcon(months: number, values: Array<[number, string]>) {
              return values.find(([minimum]) => months >= minimum)?.[1] || "";
          }

          function colorNumber(value: string) {
              const normalized = String(value || "").trim().replace(/^#/, "");
              return /^[0-9a-f]{6}$/i.test(normalized) ? Number.parseInt(normalized, 16) : null;
          }

          function colorHex(value: unknown, fallback: string) {
              const number = Number(value);
              return Number.isFinite(number) ? `#${Math.max(0, Math.min(0xffffff, number)).toString(16).padStart(6, "0").toUpperCase()}` : fallback;
          }

          function decorationAsset(value: string) {
              const raw = String(value || "");
              if (!/^https?:/i.test(raw)) return raw;
              try { return decodeURIComponent(new URL(raw).pathname.split("/").pop() || "").replace(/\.png$/i, ""); }
              catch { return raw; }
          }

          function decorationUri(asset: string) {
              const raw = String(asset || "");
              if (/^(?:https?:|data:)/i.test(raw)) return raw;
              return `https://cdn.discordapp.com/avatar-decoration-presets/${encodeURIComponent(raw)}.png?size=160&passthrough=true`;
          }

          function applyAvatarDecoration(target: any, data: any) {
              if (!target || !data?.avatarDecoration) return;
              const asset = decorationAsset(data.avatarDecoration);
              if (!asset) return;
              const skuId = data.avatarDecorationSku || "cloudcord-decoration";
              const decoration = { asset, skuId, sku_id: skuId };
              setOwnValue(target, "avatarDecorationData", decoration);
              setOwnValue(target, "avatar_decoration_data", decoration);
          }

          async function findDecorationCatalog() {
              const roots: any[] = [];
              for (const name of ["CollectiblesStore", "CollectiblesShopStore", "AvatarDecorationStore"]) {
                  const store = safeStore(name);
                  if (store) roots.push(store);
              }
              try {
                  const module = findByProps("getCollectiblesCategories") as any;
                  roots.push(await module?.getCollectiblesCategories?.(), module);
              } catch {}
              try {
                  const module = findByProps("fetchCollectiblesCategories") as any;
                  roots.push(await module?.fetchCollectiblesCategories?.(), module);
              } catch {}
              try {
                  const api = findByProps("getAPIBaseURL", "get") as any;
                  const response = await api?.get?.({ url: "/collectibles-categories", oldFormErrors: true });
                  roots.push(response?.body, response);
              } catch {}

              const found = new Map<string, { asset: string; skuId: string; label: string; uri: string }>();
              for (const item of Array.isArray(bundledDecorationCatalog) ? bundledDecorationCatalog : []) {
                  if (item?.category !== "decorations" || !item?.url) continue;
                  const uri = String(item.url);
                  const asset = decorationAsset(uri);
                  if (!asset) continue;
                  const label = String(item.label || item.name || "Discord decoration");
                  found.set(`${asset}:`, { asset, skuId: "", label, uri });
              }
              const seen = new Set<any>();
              const visit = (value: any, depth = 0) => {
                  if (value == null || depth > 7 || seen.has(value)) return;
                  if (typeof value !== "object") return;
                  seen.add(value);
                  const decoration = value.avatarDecoration || value.avatar_decoration || value.decoration || value.avatarDecorationData;
                  const asset = String(decoration?.asset || value.asset || "");
                  const looksLikeDecoration = !!decoration || /decoration/i.test(String(value.type || value.productType || value.name || ""));
                  if (asset && looksLikeDecoration) {
                      const skuId = String(value.skuId || value.sku_id || value.sku?.id || decoration?.skuId || decoration?.sku_id || "");
                      const label = String(value.name || value.title || value.label || value.sku?.name || "Discord decoration");
                      found.set(`${asset}:${skuId}`, { asset, skuId, label, uri: decorationUri(asset) });
                  }
                  if (value instanceof Map) for (const item of value.values()) visit(item, depth + 1);
                  else if (Array.isArray(value)) for (const item of value) visit(item, depth + 1);
                  else for (const [key, child] of Object.entries(value)) if (!/dispatcher|listeners|actionHandlers/i.test(key)) visit(child, depth + 1);
              };
              for (const root of roots) {
                  visit(root);
                  for (const getter of ["getCategories", "getProducts", "getItems", "getCollectiblesCategories"]) {
                      try { visit(root?.[getter]?.()); } catch {}
                  }
              }
              return [...found.values()];
          }

          function boosterIcon(months: number) {
              if (!months) return "";
              return BOOST_ICON_BY_MONTHS.get(months) || milestoneIcon(months, BOOST_ICONS);
          }

          function addRenderedBadge(result: any[], id: string, description: string, icon: string, size?: number) {
              if (!icon || result.some(item => item?.id === id)) return;
              badgeRenderProps.set(id, { id, source: { uri: icon }, label: description, ...(size ? { width: size, height: size, style: { width: size, height: size } } : {}) });
              // Discord 331 does not consistently pass custom badge rows through
              // ProfileBadge/RenderedBadge JSX. Keep native-compatible image
              // fields on the row itself so it renders even without that hook.
              result.push({ id, description, label: description, icon, iconSrc: icon, source: { uri: icon } });
          }

          function addOfficialBadge(result: any[], badge: any, user: any, data: any) {
              const candidates = [user?.displayProfile, user?.guildMemberProfile, user?.userProfile, user?.profile, user, safeStore("UserProfileStore")?.getUserProfile?.(user?.userId || user?.id)];
              // Badge hooks receive different profile shapes across Discord versions.
              // An empty wrapper must not hide the actual profile's colors.
              const native = candidates.find(profile => {
                  const colors = profile?.themeColors ?? profile?.theme_colors;
                  return (Array.isArray(colors) && colors.some(value => value != null)) || profile?.primaryColor != null || profile?.primary_color != null || profile?.accentColor != null || profile?.accent_color != null;
              });
              const colors = data?.profileColorsEnabled ? [data.primaryColor, data.accentColor] : native?.themeColors ?? native?.theme_colors ?? [native?.primaryColor ?? native?.primary_color ?? native?.accentColor ?? native?.accent_color];
              const values = colors.filter((value: any) => value != null).map((value: any) => typeof value === "string" ? parseInt(value.replace("#", ""), 16) : Number(value)).filter(Number.isFinite);
              // Match desktop: combine both gradient endpoints in linear light.
              const luminance = values.length ? values.reduce((sum: number, value: number) => {
                  const channels = [(value >> 16) & 255, (value >> 8) & 255, value & 255].map(channel => {
                      const c = channel / 255;
                      return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
                  });
                  return sum + channels[0] * 0.2126 + channels[1] * 0.7152 + channels[2] * 0.0722;
              }, 0) / values.length : null;
              const light = luminance !== null ? (luminance + 0.05) / 0.05 >= 1.05 / (luminance + 0.05) : safeStore("ThemeStore")?.theme === "light";
              const tintColor = light ? "#000000" : "#ffffff";
              // Render keys must not share tint across users or cached light/dark views.
              const renderId = `${badge.id}:${user?.userId || user?.id || user?.user?.id || "self"}:${light ? "light" : "dark"}`;
              addRenderedBadge(result, renderId, badge.label, CLOUDCORD_BADGE_ICON);
              const props = badgeRenderProps.get(renderId);
              if (props) { props.tintColor = tintColor; props.style = { ...props.style, tintColor, resizeMode: "contain" }; }
              const row = result.find(item => item.id === renderId);
              if (row) { row.tintColor = tintColor; row.style = { tintColor }; }
          }

          function showGiftingBadgeOverlay(selectedLabel?: string) {
              try {
                  const index = Math.max(0, GIFT_LEVELS.findIndex(gift => selectedLabel?.startsWith(gift.name)));
                  const gift = GIFT_LEVELS[index];
                  const opener = typeof openGiftingBadgeInfoActionSheet === "function"
                      ? openGiftingBadgeInfoActionSheet
                      : openGiftingBadgeInfoActionSheet?.default ?? openGiftingBadgeInfoActionSheet?.openGiftingBadgeInfoActionSheet;
                  if (typeof opener !== "function") throw new Error("Discord gifting badge overlay is unavailable");

                  // These are Discord's native field names across the supported
                  // mobile builds. Unknown keys are intentionally harmless.
                  opener({
                      giftCount: gift.count,
                      giftingBadgeTier: index + 1,
                      gifting_badge_tier: index + 1,
                      tier: index + 1,
                      selectedTier: index + 1,
                      source: "PROFILE_BADGE"
                  });
              } catch (error: any) {
                  diagnostics.last = error?.message || "Could not open gifting badges";
                  Alert.alert("Gifting Badge", "Discord's native gifting badge overlay is unavailable in this Discord version.");
              }
          }

          function selectedBadgeObjects(existing: any, forEditor = false) {
              const result: any[] = [];
              if (preview.nitroEnabled) {
                  const icon = milestoneIcon(preview.nitroMonths, NITRO_ICONS);
                  result.push({ id: nitroBadgeId(preview.nitroMonths), description: nitroSubscriberLabel(preview.nitroMonths), icon: " _", iconSrc: icon, source: { uri: icon } });
              }
              if (preview.boostMonths > 0) {
                  const icon = boosterIcon(preview.boostMonths);
                  result.push({ id: "fakeprofile-boost", description: serverBoostingLabel(preview.boostMonths), icon: " _", iconSrc: icon, source: { uri: icon } });
              }
              for (const [id, description, , icon] of BADGES) {
                  if (!preview.selectedBadges?.[id]) continue;
                  const badgeId = `fakeprofile-${id}`;
                  if (!result.some(item => item?.id === badgeId)) {
                      const label = id === "oldname" && preview.oldName ? `Originally Known As: ${preview.oldName}` : description;
                      result.push({ id: badgeId, description: label, icon: " _", iconSrc: icon, source: { uri: icon } });
                  }
              }
              if (!shouldReplaceLocalBadges() && Array.isArray(existing)) {
                  for (const badge of existing) {
                      if (!badge || result.some(item => item?.id && item.id === badge?.id)) continue;
                      result.push(badge);
                  }
              }
              for (const badge of result) {
                  if (badge.iconSrc) {
                      badge.icon = badge.iconSrc;
                      badgeRenderProps.set(badge.id, { id: badge.id, source: badge.source, label: badge.description });
                  }
              }
              return forEditor ? result : applyBadgeLayout(result, { ...preview, badgeOrder: preview.badgeOrder?.length ? preview.badgeOrder : defaultBadgeOrder(Array.isArray(existing) ? existing : []) });
          }

          function userIdFromProfile(profile: any): string {
              return String(profile?.userId || profile?.id || profile?.user?.id || "");
          }

          function sharedBadgeObjects(existing: any, userId: string, data: any) {
              const rows: any[] = [];
              const nitroMonths = NITRO_DURATIONS[Number(data.nitroLevel)] || 0;
              if (remoteNitroEnabled(data)) addRenderedBadge(rows, nitroBadgeId(nitroMonths), nitroSubscriberLabel(nitroMonths), milestoneIcon(nitroMonths, NITRO_ICONS));
              if (Number(data.boostMonths) >= 0) {
                  const months = [1, 2, 3, 6, 9, 12, 15, 18, 24][Number(data.boostMonths)] || 0;
                  addRenderedBadge(rows, "cloudcord-shared-boost", serverBoostingLabel(months), boosterIcon(months));
              }
              const gift = GIFT_LEVELS[Number(data.giftLevel)];
              if (gift) addRenderedBadge(rows, "cloudcord-shared-gifting", gift.name, gift.icon);
              const ids = Array.isArray(data.customBadgeIds) ? data.customBadgeIds : [];
              for (const [id, description, flag, icon, customId] of BADGES) {
                  if (customId ? ids.includes(customId) : (Number(data.badgeFlags || 0) & flag) !== 0) addRenderedBadge(rows, `cloudcord-shared-${customId || id}`, description, icon);
              }
              if (!shouldReplaceSharedBadges(data) && Array.isArray(existing)) rows.push(...existing.filter(badge => !rows.some(row => badgeLayoutKey(row) === badgeLayoutKey(badge))));
              return applyBadgeLayout(rows, data);
          }

          function cloneObject(original: any, kind: "user" | "profile") {
              if (!original || !preview.enabled) return original;
              const cache = kind === "profile" ? profileCache : userCache;
              try {
                  const cached = cache.get(original);
                  if (cached) return cached;
              } catch {}

              let cloned: any;
              try {
                  cloned = Object.create(Object.getPrototypeOf(original));
                  for (const key of Reflect.ownKeys(original)) {
                      if (overriddenKeys.has(String(key))) continue;
                      const descriptor = Object.getOwnPropertyDescriptor(original, key);
                      if (descriptor) Object.defineProperty(cloned, key, descriptor);
                  }
              } catch {
                  try { cloned = { ...original }; }
                  catch { return original; }
              }

              const displayName = preview.displayName || original.globalName || original.displayName || original.username;
              const username = preview.username || original.username;
              const avatar = mediaUri("avatarMedia");
              const banner = mediaUri("bannerMedia");
              const primaryColor = preview.profileColorsEnabled ? colorNumber(preview.primaryColor) : null;
              const accentColor = preview.profileColorsEnabled ? colorNumber(preview.accentColor) : null;
              let selectedFlags = 0;
              for (const [id, , flag] of BADGES) if (preview.selectedBadges?.[id]) selectedFlags |= flag;
              const flags = shouldReplaceLocalBadges() ? selectedFlags : Number(original.publicFlags ?? original.flags ?? 0) | selectedFlags;

              setOwnValue(cloned, "username", username);
              setOwnValue(cloned, "globalName", displayName);
              setOwnValue(cloned, "displayName", displayName);
              setOwnValue(cloned, "bio", preview.bio);
              setOwnValue(cloned, "pronouns", preview.pronouns);
              const createdAt = profileDate(preview.createdAt);
              const joinedAt = profileDate(preview.signupDate);
              if (createdAt) setOwnValue(cloned, "createdAt", createdAt);
              if (joinedAt) { setOwnValue(cloned, "joinedAt", joinedAt); setOwnValue(cloned, "memberSince", joinedAt); }
              setOwnValue(cloned, "publicFlags", flags);
              setOwnValue(cloned, "flags", flags);
              setOwnValue(cloned, "badges", selectedBadgeObjects(original.badges));
              setOwnValue(cloned, "profileBadges", selectedBadgeObjects(original.profileBadges));
              setOwnValue(cloned, "hasFlag", (flag: number) => !!(flags & flag));
              setOwnValue(cloned, "avatarDecorationData", preview.avatarDecoration ? { asset: decorationAsset(preview.avatarDecoration), skuId: preview.avatarDecorationSku || "cloudcord-decoration" } : null);
              if (primaryColor != null) setOwnValue(cloned, "primaryColor", primaryColor);
              if (accentColor != null) setOwnValue(cloned, "accentColor", accentColor);
              if (primaryColor != null || accentColor != null) setOwnValue(cloned, "themeColors", [primaryColor ?? accentColor, accentColor ?? primaryColor]);
              if (preview.nitroEnabled) {
                  const premiumSince = monthsAgo(preview.nitroMonths);
                  setOwnValue(cloned, "premiumType", 2);
                  setOwnValue(cloned, "premium_type", 2);
                  setOwnValue(cloned, "premiumSince", premiumSince);
                  setOwnValue(cloned, "premium_since", premiumSince.toISOString());
              }
              if (preview.boostMonths > 0) setOwnValue(cloned, "premiumGuildSince", monthsAgo(preview.boostMonths));
              if (avatar) {
                  setOwnValue(cloned, "avatarURL", avatar);
                  setOwnValue(cloned, "avatarUrl", avatar);
                  setOwnValue(cloned, "getAvatarURL", () => avatar);
              }
              if (banner) {
                  setOwnValue(cloned, "bannerURL", banner);
                  setOwnValue(cloned, "bannerUrl", banner);
                  setOwnValue(cloned, "getBannerURL", () => banner);
                  setOwnValue(cloned, "getPreviewBanner", () => banner);
              }

              try { cache.set(original, cloned); } catch {}
              return cloned;
          }

          function decorateProfileResult(original: any, userId?: string) {
              if (!original) return original;
              if (!isCurrentUser(userId)) {
                  const id = String(userId || "");
                  requestSharedProfile(id);
                  const shared = getProfileOverride(id);
                  return shared && Object.keys(shared).length ? decorateSharedProfile(original, id, shared) : original;
              }
              if (!preview.enabled) return original;
              const decorated = cloneObject(original, "profile");
              if (original.user) setOwnValue(decorated, "user", cloneObject(original.user, "user"));
              if (original.userProfile) setOwnValue(decorated, "userProfile", cloneObject(original.userProfile, "profile"));
              if (original.guildMemberProfile) setOwnValue(decorated, "guildMemberProfile", cloneObject(original.guildMemberProfile, "profile"));
              if (original.displayProfile) setOwnValue(decorated, "displayProfile", cloneObject(original.displayProfile, "profile"));
              if (original.profile) setOwnValue(decorated, "profile", cloneObject(original.profile, "profile"));
              return decorated;
          }

          function profileResultUserId(subject: any, result: any) {
              return String(
                  (typeof subject === "string" ? subject : subject?.userId || subject?.user_id || subject?.id || subject?.user?.id)
                  || result?.userId || result?.id || result?.user?.id
                  || result?.userProfile?.userId || result?.userProfile?.user_id || result?.userProfile?.user?.id
                  || result?.guildMemberProfile?.userId || result?.guildMemberProfile?.user?.id
                  || result?.displayProfile?.userId || result?.displayProfile?.user?.id
                  || result?.profile?.userId || result?.profile?.user?.id
                  || ""
              );
          }

          function isCurrentUser(id?: string) {
              // Discord's iPad Browse Channels route renders several profile-like
              // components without a user id. Unknown must not be interpreted as
              // the signed-in account or Fake Profile leaks into channel rows.
              return !!id && !!currentUserId && id === currentUserId;
          }

          function addPatch(method: string, parent: any, handler: (args: any[], original: Function) => any) {
              if (!parent?.[method]) return;
              try {
                  instead(method, parent, handler as any);
                  diagnostics.patches += 1;
              } catch (error: any) {
                  diagnostics.last = error?.message || `Could not connect ${method}`;
              }
          }

          let publishedBadges: { id: string; userId: string; name: string; icon: string }[] = [];
          let publishedBadgeRequest = false;
          let publishedBadgeFetchedAt = 0;
          async function refreshPublishedBadges(force = false) {
              if (publishedBadgeRequest || (!force && Date.now() - publishedBadgeFetchedAt < 5000)) return;
              publishedBadgeRequest = true;
              publishedBadgeFetchedAt = Date.now();
              try {
                  const response = await fetch("https://getcloudcord.com/v1/custom-badges", { cache: "no-store" });
                  if (!response.ok) return;
                  const payload = await response.json();
                  if (!Array.isArray(payload?.badges)) return;
                  const next = payload.badges.filter((badge: any) => typeof badge?.id === "string" && typeof badge?.userId === "string" && typeof badge?.name === "string" && typeof badge?.icon === "string" && badge.icon.startsWith("https://getcloudcord.com/v1/custom-badges/"));
                  if (JSON.stringify(next) !== JSON.stringify(publishedBadges)) {
                      publishedBadges = next;
                      try { safeStore("UserStore")?.emitChange?.(); } catch {}
                      try { safeStore("UserProfileStore")?.emitChange?.(); } catch {}
                  }
              } catch {} finally { publishedBadgeRequest = false; }
          }
          const nativeBadgeRows = new Map<string, any[]>();
          function editableBadgeRows() {
              const existing = nativeBadgeRows.get(currentUserId) || safeStore("UserProfileStore")?.getUserProfile?.(currentUserId)?.badges || [];
              const native = Array.isArray(existing) ? existing.filter(badge => !/^(?:fakeprofile-|cloudcord-shared-)/.test(String(badge?.id))) : [];
              const rows = selectedBadgeObjects(native, true);
              const gift = GIFT_LEVELS[preview.giftLevel];
              if (gift) rows.push({ id: "gifting", description: gift.name, iconSrc: gift.icon });
              const staff = cloudCordStaffBadge(currentUserId);
              if (staff) rows.unshift({ id: staff.id, description: staff.label, iconSrc: CLOUDCORD_BADGE_ICON });
              for (const badge of publishedBadges) if (badge.userId === currentUserId) rows.push({ id: `cloudcord-custom-${badge.id}`, description: badge.name, iconSrc: badge.icon });
              const unique = new Map<string, any>();
              for (const row of rows) { const id = badgeLayoutKey(row); if (id && !unique.has(id)) unique.set(id, { ...row, id }); }
              for (const id of preview.hiddenBadgeIds) if (!unique.has(id)) unique.set(id, { id, description: id });
              return applyBadgeLayout([...unique.values()], { badgeOrder: preview.badgeOrder.length ? preview.badgeOrder : defaultBadgeOrder(native) });
          }

          function appendPublishedBadges(result: any[], userId: string) {
              const next = [...result];
              for (const badge of publishedBadges) {
                  if (badge.userId === userId) addRenderedBadge(next, `cloudcord-custom-${badge.id}`, badge.name, badge.icon);
              }
              const layout = isCurrentUser(userId) ? (preview.enabled ? preview : null) : getProfileOverride(userId);
              return applyBadgeLayout(next, { ...layout, badgeOrder: layout?.badgeOrder?.length ? layout.badgeOrder : defaultBadgeOrder(nativeBadgeRows.get(userId) || []) });
          }
          function connectBadgeRenderer() {
              try {
                  after("default", useBadgesModule as any, ([user], result) => {
                      if (!Array.isArray(result)) return result;
                      const id = String(typeof user === "string" ? user : user?.userId || user?.id || user?.user?.id || user?.userProfile?.userId || user?.userProfile?.user?.id || user?.profile?.userId || user?.displayProfile?.userId || user?.displayProfile?.user?.id || "");
                      if (id) {
                          nativeBadgeRows.set(id, [...result]);
                          if (nativeBadgeRows.size > 100) nativeBadgeRows.delete(nativeBadgeRows.keys().next().value!);
                      }
                      void refreshPublishedBadges();
                      if (!isCurrentUser(id)) {
                          requestSharedProfile(id);
                          const data = getProfileOverride(id);
                          const staffBadge = cloudCordStaffBadge(id);
                          if (!data && !staffBadge) return appendPublishedBadges(result, id);
                          const ordered: any[] = [];
                          if (staffBadge) addOfficialBadge(ordered, staffBadge, user, data);
                          if (data) {
                              const nitroMonths = NITRO_DURATIONS[Number(data.nitroLevel)] || 0;
                              const boostMonths = [1, 2, 3, 6, 9, 12, 15, 18, 24][Number(data.boostMonths)] || 0;
                              if (remoteNitroEnabled(data)) addRenderedBadge(ordered, nitroBadgeId(nitroMonths), nitroSubscriberLabel(nitroMonths), milestoneIcon(nitroMonths, NITRO_ICONS));
                              addRenderedBadge(ordered, "cloudcord-shared-boost", serverBoostingLabel(boostMonths), boosterIcon(boostMonths));
                              const gift = GIFT_LEVELS[Number(data.giftLevel)];
                              if (gift) addRenderedBadge(ordered, "cloudcord-shared-gifting", gift.name, gift.icon);
                              const customBadgeIds = Array.isArray(data.customBadgeIds) ? data.customBadgeIds : [];
                              for (const [id, description, flag, icon, customId] of BADGES) {
                                  const selected = customId ? customBadgeIds.includes(customId) : (Number(data.badgeFlags || 0) & flag) !== 0;
                                  const label = id === "oldname" && data.oldName ? `Originally Known As: ${data.oldName}` : description;
                                  if (selected) addRenderedBadge(ordered, `cloudcord-shared-${customId || id}`, label, icon);
                              }
                          }
                          const existing = data && shouldReplaceSharedBadges(data) ? [] : result.filter(item => {
                              const badgeId = String(item?.id || "");
                              return !badgeId.startsWith("cloudcord-") && !(remoteNitroEnabled(data) && badgeId === nitroBadgeId(NITRO_DURATIONS[Number(data?.nitroLevel)] || 0));
                          });
                          return appendPublishedBadges([...ordered, ...existing], id);
                      }

                      const staffBadge = cloudCordStaffBadge(id);
                      if (!preview.enabled) {
                          if (!staffBadge) return appendPublishedBadges(result, id);
                          const existing = result.filter(item => !String(item?.id || "").startsWith("cloudcord-"));
                          const ordered: any[] = [];
                          addOfficialBadge(ordered, staffBadge, user, null);
                          return appendPublishedBadges([...ordered, ...existing], id);
                      }

                      const existing = shouldReplaceLocalBadges() ? [] : result.filter(item => {
                          const badgeId = String(item?.id || "");
                          return !badgeId.startsWith("cloudcord-") && !badgeId.startsWith("fakeprofile-") && !(preview.nitroEnabled && badgeId === nitroBadgeId(preview.nitroMonths));
                      });
                      const ordered: any[] = [];
                      if (staffBadge) addOfficialBadge(ordered, staffBadge, user, preview);
                      if (preview.nitroEnabled) addRenderedBadge(
                          ordered,
                          nitroBadgeId(preview.nitroMonths),
                          nitroSubscriberLabel(preview.nitroMonths),
                          milestoneIcon(preview.nitroMonths, NITRO_ICONS)
                      );
                      const gift = GIFT_LEVELS[preview.giftLevel];
                      if (gift) addRenderedBadge(ordered, "fakeprofile-gifting", gift.name, gift.icon);
                      addRenderedBadge(
                          ordered,
                          "fakeprofile-boost",
                          serverBoostingLabel(preview.boostMonths),
                          boosterIcon(preview.boostMonths)
                      );
                      for (const [badgeId, description, , icon] of BADGES) {
                          if (!preview.selectedBadges?.[badgeId]) continue;
                          const id = `fakeprofile-${badgeId}`;
                          const label = badgeId === "oldname" && preview.oldName ? `Originally Known As: ${preview.oldName}` : description;
                          addRenderedBadge(ordered, id, label, icon);
                      }
                      return appendPublishedBadges([...ordered, ...existing], id);
                  });
                  diagnostics.patches += 1;
              } catch (error: any) {
                  diagnostics.last = error?.message || "Could not connect badge list";
              }

              for (const component of ["ProfileBadge", "RenderedBadge"]) {
                  try {
                      onJsxCreate(component, (_component, rendered) => {
                          if (!rendered?.props) return;
                          const props = badgeRenderProps.get(rendered.props.id);
                          if (props) {
                              // The native badge wrapper does not consistently
                              // forward tintColor to its inner image. Render the
                              // official mark with an explicit RN Image tint.
                              if (String(props.id || "").startsWith("cloudcord-official-")) {
                                  return <Pressable accessibilityRole="button" accessibilityLabel={String(props.label)} onPress={() => Alert.alert(String(props.label))}><Image source={props.source} resizeMode="contain" style={{ width: 20, height: 20, tintColor: props.tintColor }} /></Pressable>;
                              }
                              Object.assign(rendered.props, props);
                              if (String(props.id || "").includes("gifting")) {
                                  rendered.props.onPress = () => showGiftingBadgeOverlay(String(props.label || ""));
                                  rendered.props.accessibilityRole = "button";
                              }
                          }
                      });
                      diagnostics.patches += 1;
                  } catch {}
              }
          }

          function addAfterPatch(method: string, parent: any, handler: (args: any[], result: any) => any) {
              if (!parent?.[method]) return;
              try {
                  after(method, parent, handler as any);
                  diagnostics.patches += 1;
              } catch (error: any) {
                  diagnostics.last = error?.message || `Could not connect ${method}`;
              }
          }

          function requestIsCurrent(args: any[]) {
              if (!currentUserId) return false;
              return args.some(value => value === currentUserId || value?.id === currentUserId || value?.userId === currentUserId || value?.user?.id === currentUserId);
          }

          function renderedUserId(props: any) {
              return props?.userId
                  || props?.user_id
                  || props?.profileUserId
                  || props?.user?.userId
                  || props?.user?.id
                  || props?.userProfile?.userId
                  || props?.userProfile?.user_id
                  || props?.userProfile?.user?.id
                  || props?.guildMemberProfile?.userId
                  || props?.guildMemberProfile?.user?.id
                  || props?.displayProfile?.userId
                  || props?.displayProfile?.user_id
                  || props?.displayProfile?.user?.id
                  || props?.profile?.userId
                  || props?.profile?.user?.id;
          }

          function connectMediaRenderer() {
              const avatarComponents = ["UserHeaderAvatar", "ProfileAvatar", "UserProfileAvatar"];
              const bannerComponents = ["UserBanner", "ProfileBanner", "UserProfileBanner"];

              for (const component of avatarComponents) {
                  try {
                      onJsxCreate(component, (_component, rendered) => {
                          const props = rendered?.props;
                          const id = String(renderedUserId(props) || "");
                          if (!id) return;
                          if (!isCurrentUser(id)) {
                              requestSharedProfile(id);
                              const data = getProfileOverride(id);
                              applyAvatarDecoration(props, data);
                              if (props.user && data?.avatarDecoration) props.user = cloneSharedUser(props.user, data);
                              if (!data?.avatar) return;
                              props.source = { uri: data.avatar };
                              props.avatarSource = { uri: data.avatar };
                              props.avatarSrc = data.avatar;
                              props.avatarURL = data.avatar;
                              props.resizeMode = "cover";
                              props.contentFit = "cover";
                              if (props.user) props.user = cloneSharedUser(props.user, data);
                              return;
                          }
                          const uri = mediaUri("avatarMedia");
                          if (preview.enabled) {
                              applyAvatarDecoration(props, preview);
                              if (props.user && preview.avatarDecoration) {
                                  props.user = cloneObject(props.user, "user");
                                  applyAvatarDecoration(props.user, preview);
                              }
                          }
                          if (!preview.enabled || !uri) return;
                          props.source = { uri };
                          props.avatarSource = { uri };
                          props.avatarSrc = uri;
                          props.avatarURL = uri;
                          props.resizeMode = "cover";
                          props.contentFit = "cover";
                          if (props.user) props.user = cloneObject(props.user, "user");
                      });
                      diagnostics.patches += 1;
                  } catch {}
              }

              for (const component of bannerComponents) {
                  try {
                      onJsxCreate(component, (_component, rendered) => {
                          const props = rendered?.props;
                          const id = String(renderedUserId(props) || "");
                          if (!id) return;
                          if (!isCurrentUser(id)) {
                              requestSharedProfile(id);
                              const data = getProfileOverride(id);
                              if (!data?.banner) return;
                              props.source = { uri: data.banner };
                              props.bannerSource = { uri: data.banner };
                              props.bannerSrc = data.banner;
                              props.bannerURL = data.banner;
                              props.resizeMode = "cover";
                              props.contentFit = "cover";
                              return;
                          }
                          const uri = mediaUri("bannerMedia");
                          if (!preview.enabled || !uri) return;
                          props.source = { uri };
                          props.bannerSource = { uri };
                          props.bannerSrc = uri;
                          props.bannerURL = uri;
                          props.resizeMode = "cover";
                          props.contentFit = "cover";
                      });
                      diagnostics.patches += 1;
                  } catch {}
              }

          }

          const identityRefreshers = new Set<() => void>();
          const identityRenderers = new WeakMap<Function, Function>();

          function replaceIdentityText(node: any, original: any, data: any, depth = 0): any {
              if (depth > 20 || node == null) return node;
              if (typeof node === "string") {
                  if (data.username && (node === original.username || node === `@${original.username}`)) return node.startsWith("@") ? `@${data.username}` : String(data.username);
                  const name = data.globalName || data.displayName;
                  if (name && node === (original.globalName || original.global_name || original.displayName)) return String(name);
                  return node;
              }
              if (Array.isArray(node)) return node.map(child => replaceIdentityText(child, original, data, depth + 1));
              if (!isValidElement(node) || !node.props?.children) return node;
              return cloneElement(node, { children: replaceIdentityText(node.props.children, original, data, depth + 1) });
          }

          function identityRenderer(Component: any) {
              if (identityRenderers.has(Component)) return identityRenderers.get(Component);
              // Wrap only named profile presentation functions, never UserStore
              // results or Discord's addUser cache objects.
              function CloudCordIdentity(props: any) {
                  const [, refresh] = useReducer(value => value + 1, 0);
                  useEffect(() => { const update = () => refresh(); identityRefreshers.add(update); return () => { identityRefreshers.delete(update); }; }, []);
                  const id = String(renderedUserId(props) || "");
                  if (id && !isCurrentUser(id)) requestSharedProfile(id);
                  const tree = Component(props);
                  const original = id ? safeStore("UserStore")?.getUser?.(id) : null;
                  const data = id ? getProfileOverride(id) : null;
                  return original && data ? replaceIdentityText(tree, original, data) : tree;
              }
              identityRenderers.set(Component, CloudCordIdentity);
              return CloudCordIdentity;
          }

          function connectIdentityRenderer() {
              // Keep shared identity overrides at the profile UI boundary.
              // Discord's internal addUser cache requires the original object
              // returned by UserStore.getUser and crashes on presentation clones.
              const identityComponents = [
                  "ProfileHeader", "UserProfileHeader", "ProfileHeaderUsername",
                  "ProfileHeaderName", "ProfileDisplayName", "UserProfileName",
                  "ProfileUsername", "UserTagAndPronouns", "UserTag",
                  "UserProfileUsername", "UserProfileDisplayName", "ProfileHeaderUserInfo", "UserProfileHeaderInfo"
              ];
              const applyIdentity = (props: any, id: string, data: any) => {
                  if (!props || !data) return;
                  const username = String(data.username || "");
                  const displayName = String(data.globalName || data.displayName || "");
                  if (props.user) props.user = cloneSharedUser(props.user, data);
                  for (const key of ["profile", "userProfile", "displayProfile", "guildMemberProfile"]) {
                      if (props[key]) props[key] = decorateSharedProfile(props[key], id, data);
                  }
                  if (username) {
                      props.username = username;
                      props.userName = username;
                      props.tag = `@${username}`;
                  }
                  if (displayName) {
                      props.displayName = displayName;
                      props.globalName = displayName;
                      props.name = displayName;
                  }
              };
              for (const component of identityComponents) {
                  try {
                      onJsxCreate(component, (_component, rendered) => {
                          const props = rendered?.props;
                          const id = String(renderedUserId(props) || props?.user?.id || "");
                          if (!id) return;
                          if (isCurrentUser(id)) {
                              if (!preview.enabled) return;
                              if (props.user) props.user = cloneObject(props.user, "user");
                              props.username = preview.username || props.username;
                              props.displayName = preview.displayName || props.displayName;
                              props.globalName = preview.displayName || props.globalName;
                              return;
                          }
                          requestSharedProfile(id);
                          const data = getProfileOverride(id);
                          if (data && Object.keys(data).length) applyIdentity(props, id, data);
                          if (typeof _component === "function" && !_component.prototype?.isReactComponent) {
                              return { ...rendered, type: identityRenderer(_component) };
                          }
                      });
                      diagnostics.patches += 1;
                  } catch {}
              }
          }

          function ensurePatches() {
              if (initialized) return;
              initialized = true;

              const userStore = safeStore("UserStore") || findByProps("getCurrentUser", "getUser");
              diagnostics.userStore = !!userStore;
              try {
                  realCurrentUser = userStore?.getCurrentUser?.() || null;
                  currentUserId = realCurrentUser?.id || null;
              } catch {}

              addPatch("getCurrentUser", userStore, (args, original) => {
                  const user = original(...args);
                  realCurrentUser = user || realCurrentUser;
                  currentUserId = user?.id || currentUserId;
                  return cloneObject(user, "user");
              });
              addPatch("getUser", userStore, (args, original) => {
                  if (!isCurrentUser(args?.[0])) return original(...args);
                  const user = original(...args);
                  realCurrentUser = user || realCurrentUser;
                  return cloneObject(user, "user");
              });

              const profileStore = safeStore("UserProfileStore") || findByProps("getUserProfile", "getGuildMemberProfile");
              diagnostics.profileStore = !!profileStore;
              addPatch("getUserProfile", profileStore, (args, original) => {
                  const result = original(...args);
                  const id = String(args?.[0]?.id || args?.[0]?.userId || args?.[0] || "");
                  if (isCurrentUser(id)) return decorateProfileResult(result, id);
                  requestSharedProfile(id);
                  const shared = getProfileOverride(id);
                  return shared && Object.keys(shared).length ? decorateSharedProfile(result, id, shared) : result;
              });
              // Do not wrap getGuildMemberProfile. Discord 331's iPad channel
              // index uses it while assembling categories and forum channels;
              // substituting a presentation clone can leave those channel types
              // absent until the native index eventually rebuilds.

              try {
                  after("default", useUserProfileModule as any, (args, result) => {
                      const subject = args?.[0];
                      const id = profileResultUserId(subject, result);
                      return decorateProfileResult(result, id);
                  });
                  diagnostics.patches += 1;
              } catch (error: any) {
                  diagnostics.last = error?.message || "Could not connect profile view";
              }

              try {
                  after("default", useDisplayProfileModule as any, (args, result) => {
                      const subject = args?.[0];
                      const id = profileResultUserId(subject, result);
                      if (isCurrentUser(id)) return preview.enabled ? cloneObject(result, "profile") : result;
                      requestSharedProfile(id);
                      const shared = getProfileOverride(id);
                      return shared && Object.keys(shared).length ? decorateSharedProfile(result, id, shared) : result;
                  });
                  diagnostics.patches += 1;
              } catch (error: any) {
                  diagnostics.last = error?.message || "Could not connect profile banner";
              }

              // Badge synchronization has its own Discord hook. It was defined
              // above but never initialized, so shared colors rendered while
              // Nitro, gifting and custom badges silently remained native.
              connectBadgeRenderer();

              const avatarResolver = findByProps("getUserAvatarURL") || findByProps("getAvatarURL", "getDefaultAvatarURL");
              const bannerResolver = findByProps("getUserBannerURL") || findByProps("getBannerURL");
              diagnostics.avatarResolver = !!avatarResolver;
              diagnostics.bannerResolver = !!bannerResolver;

              for (const method of ["getUserAvatarURL", "getAvatarURL", "getGuildMemberAvatarURL", "getGuildMemberAvatarURLSimple"]) {
                  addPatch(method, avatarResolver, (args, original) => {
                      const uri = mediaUri("avatarMedia");
                      return preview.enabled && uri && requestIsCurrent(args) ? uri : original(...args);
                  });
              }
              for (const method of ["getUserAvatarSource", "getGuildMemberAvatarSource"]) {
                  addPatch(method, avatarResolver, (args, original) => {
                      const uri = mediaUri("avatarMedia");
                      return preview.enabled && uri && requestIsCurrent(args) ? { uri } : original(...args);
                  });
              }
              for (const method of ["getUserBannerURL", "getBannerURL", "getGuildMemberBannerURL"]) {
                  addPatch(method, bannerResolver, (args, original) => {
                      const uri = mediaUri("bannerMedia");
                      return preview.enabled && uri && requestIsCurrent(args) ? uri : original(...args);
                  });
              }

              const snowflakeUtils = findByProps("extractTimestamp") as any;
              addPatch("extractTimestamp", snowflakeUtils, (args, original) => {
                  const createdAt = profileDate(preview.createdAt);
                  return preview.enabled && createdAt && String(args?.[0] || "") === currentUserId ? createdAt.getTime() : original(...args);
              });

              connectMediaRenderer();
              connectIdentityRenderer();

              const bannerComposer = findByProps("getBanner", "getBannerColor") || findByProps("getBanner");
              addAfterPatch("getBanner", bannerComposer, (args, result) => {
                  const uri = mediaUri("bannerMedia");
                  const id = args?.[0]?.displayProfile?.userId || args?.[0]?.userId;
                  if (!preview.enabled || !uri || !result || !id || !isCurrentUser(id)) return;
                  return { ...result, bannerSrc: uri, source: { uri } };
              });

              diagnostics.last = `Connected ${diagnostics.patches} preview hooks`;
          }

          function refreshPreview() {
              clearCache();
              try { safeStore("UserStore")?.emitChange?.(); } catch {}
              try { safeStore("UserProfileStore")?.emitChange?.(); } catch {}
              setTimeout(() => {
                  try {
                      if (currentUserId && realCurrentUser) {
                          FluxDispatcher.dispatch({ type: "USER_UPDATE", user: realCurrentUser });
                      }
                  } catch (error: any) {
                      diagnostics.last = error?.message || "Preview saved; reopen the profile to refresh";
                  }
              }, 0);
          }

          export function initializeFakeProfile() {
              if (initPromise) return initPromise;
              initPromise = (async () => {
                  try {
                      await awaitStorage(settings);
                      bindSavedPreview();
                      await pullRealCordConfiguration();
                      if ((globalThis as any).__CLOUDCORD_LOADER__?.loaderName === "RealCord" && !realCordSyncTimer) {
                          realCordSyncTimer = setInterval(pullRealCordConfiguration, 5000);
                      }
                      ensurePatches();
                      await pullOwnSharedProfile();
                      void refreshPublishedBadges(true);
                      AppState.addEventListener("change", state => { if (state === "active") void refreshPublishedBadges(true); });
                      if (!sharedSyncTimer) sharedSyncTimer = setInterval(() => {
                          void pullOwnSharedProfile();
                          refreshSharedProfiles();
                          if (AppState.currentState === "active") void refreshPublishedBadges();
                      }, 5000);
                      if (preview.enabled) { refreshPreview(); queueSharedPublish(); }
                  } catch (error: any) {
                      diagnostics.last = error?.message || "Could not restore Fake Profile";
                      initPromise = null;
                  }
              })();
              return initPromise;
          }

          async function getImageSize(uri: string, asset: any) {
              if (asset?.width && asset?.height) return { width: Number(asset.width), height: Number(asset.height) };
              return await new Promise<{ width: number; height: number }>((resolve, reject) => {
                  Image.getSize(uri, (width, height) => resolve({ width, height }), reject);
              });
          }

          async function normalizeMedia(key: "avatarMedia" | "bannerMedia", asset: any) {
              const sourceUri = asset?.fileCopyUri || asset?.uri;
              const name = String(asset?.fileName || asset?.name || "Selected image");
              const type = String(asset?.type || "").toLowerCase();
              if (!sourceUri) throw new Error("No image was selected.");
              if (type && !type.startsWith("image/")) throw new Error("Choose a picture or GIF.");

              const animated = type.includes("gif") || /\.gif(?:$|\?)/i.test(name) || /\.gif(?:$|\?)/i.test(sourceUri);
              let size = { width: Number(asset?.width || 0), height: Number(asset?.height || 0) };
              try { size = await getImageSize(sourceUri, asset); } catch {}

              const target = key === "bannerMedia" ? { width: 600, height: 240 } : { width: 512, height: 512 };
              const sourceRatio = size.width && size.height ? size.width / size.height : target.width / target.height;
              const targetRatio = target.width / target.height;
              let uri = sourceUri;
              let normalized = Math.abs(sourceRatio - targetRatio) < 0.01;

              if (!animated && size.width > 0 && size.height > 0 && !normalized) {
                  const crop = sourceRatio > targetRatio
                      ? { offset: { x: Math.round((size.width - size.height * targetRatio) / 2), y: 0 }, size: { width: Math.round(size.height * targetRatio), height: size.height } }
                      : { offset: { x: 0, y: Math.round((size.height - size.width / targetRatio) / 2) }, size: { width: size.width, height: Math.round(size.width / targetRatio) } };
                  try {
                      const editor = findByProps("cropImage") as any;
                      const result = await editor?.cropImage?.(sourceUri, { ...crop, displaySize: target, resizeMode: "cover" });
                      const output = typeof result === "string" ? result : result?.uri;
                      if (output) { uri = output; normalized = true; }
                  } catch {}

                  if (!normalized) {
                      try {
                          const manipulator = findByProps("manipulateAsync") as any;
                          const result = await manipulator?.manipulateAsync?.(sourceUri, [
                              { crop: { originX: crop.offset.x, originY: crop.offset.y, width: crop.size.width, height: crop.size.height } },
                              { resize: target }
                          ]);
                          if (result?.uri) { uri = result.uri; normalized = true; }
                      } catch {}
                  }
              }

              const label = key === "bannerMedia" ? "Banner" : "Profile picture";
              diagnostics.last = animated
                  ? `${label} animation preserved and fitted in preview`
                  : normalized ? `${label} resized to ${target.width} x ${target.height}` : `${label} fitted to ${target.width} x ${target.height} in preview`;
              return { uri, name, type, width: target.width, height: target.height, normalized };
          }

          async function saveMedia(key: "avatarMedia" | "bannerMedia", asset: any) {
              preview[key] = await normalizeMedia(key, asset);
              unmarkMediaCleared(key);
              suppressOwnPullUntil = Date.now() + 15_000;
              refreshPreview();
              queueSharedPublish();
          }

          async function pickFile(key: "avatarMedia" | "bannerMedia") {
              const picker = findByProps("pickSingle", "isCancel") as any;
              if (!picker?.pickSingle) throw new Error("The system file picker is unavailable.");
              try {
                  const asset = await picker.pickSingle({
                      type: picker.types?.images || "image/*",
                      mode: "import",
                      copyTo: "documentDirectory"
                  });
                  if (asset) await saveMedia(key, asset);
                  return !!asset;
              } catch (error) {
                  if (picker.isCancel?.(error)) return false;
                  throw error;
              }
          }

          async function pickPhoto(key: "avatarMedia" | "bannerMedia") {
              const picker = findByProps("launchImageLibrary") as any;
              if (!picker?.launchImageLibrary) return pickFile(key);
              const result: any = await new Promise((resolve, reject) => {
                  try {
                      const returned = picker.launchImageLibrary({
                          mediaType: "photo",
                          selectionLimit: 1,
                          includeBase64: false,
                          assetRepresentationMode: "current"
                      }, resolve);
                      if (returned?.then) returned.then(resolve, reject);
                  } catch (error) { reject(error); }
              });
              if (result?.didCancel) return false;
              if (result?.errorCode) throw new Error(result.errorMessage || "The photo picker failed.");
              const asset = result?.assets?.[0];
              if (asset) await saveMedia(key, asset);
              return !!asset;
          }

          function ActionButton({ label, onPress, muted = false }: { label: string; onPress: () => void; muted?: boolean }) {
              return <GlassButton label={label} onPress={onPress} muted={muted} />;
          }

          function ToggleRow({ label, subLabel, value, onPress }: { label: string; subLabel?: string; value: boolean; onPress: () => void; accent?: boolean }) {
              const { TableSwitchRow } = require("@metro/common/components");
              return <View style={{ borderRadius: 16, overflow: "hidden" }}><TableSwitchRow label={label} subLabel={subLabel} value={value} onValueChange={onPress} /></View>;
          }

          function DurationSelect({ label, value, onPress }: { label: string; value: number; onPress: () => void }) {
              const { TableRow } = require("@metro/common/components");
              const selected = label === "Gifting badge" ? (GIFT_LEVELS[value]?.name || "None") : label === "Nitro badge" ? NITRO_LABELS.get(value) : label.includes("booster") ? boosterLabel(value) : durationLabel(value);
              return <TableRow arrow label={label} trailing={<TableRow.TrailingText text={selected || "None"} />} onPress={onPress} />;
          }

          const PROFILE_COLORS = [
              "#5865F2", "#4752C4", "#57F287", "#FEE75C", "#EB459E", "#ED4245",
              "#FFFFFF", "#B5BAC1", "#80848E", "#2B2D31", "#1E1F22", "#000000",
              "#00A8FC", "#00D4AA", "#9B59B6", "#E67E22", "#E91E63", "#607D8B"
          ];

          function hsvToHex(hue: number, saturation: number, brightness: number) {
              const s = saturation / 100;
              const v = brightness / 100;
              const chroma = v * s;
              const x = chroma * (1 - Math.abs((hue / 60) % 2 - 1));
              const match = v - chroma;
              const [r, g, b] = hue < 60 ? [chroma, x, 0] : hue < 120 ? [x, chroma, 0] : hue < 180 ? [0, chroma, x] : hue < 240 ? [0, x, chroma] : hue < 300 ? [x, 0, chroma] : [chroma, 0, x];
              return `#${[r, g, b].map(channel => Math.round((channel + match) * 255).toString(16).padStart(2, "0")).join("").toUpperCase()}`;
          }

          function hexToHsv(value: string) {
              const number = colorNumber(value) ?? 0x5865F2;
              const r = ((number >> 16) & 255) / 255;
              const g = ((number >> 8) & 255) / 255;
              const b = (number & 255) / 255;
              const max = Math.max(r, g, b), min = Math.min(r, g, b), delta = max - min;
              let hue = 0;
              if (delta) hue = max === r ? 60 * (((g - b) / delta) % 6) : max === g ? 60 * ((b - r) / delta + 2) : 60 * ((r - g) / delta + 4);
              if (hue < 0) hue += 360;
              return { hue, saturation: max ? delta / max * 100 : 0, brightness: max * 100 };
          }

          function ColorPickerRow({ label, value, onOpen }: { label: string; value: string; onSelect: (color: string) => void; onOpen: () => void }) {
              return <TableRow arrow label={label} subLabel="Choose a preset or enter an exact hex color" trailing={<TableRow.TrailingText text={value.toUpperCase()} />} onPress={onOpen} />;
          }

          function CustomColorPicker({ title, initialColor, onApply }: { title: string; initialColor: string; onApply: (color: string) => void }) {
              const [color, setColor] = useState(initialColor);
              return <ScrollView contentContainerStyle={{ padding: 12, paddingBottom: 48, gap: 24 }} keyboardShouldPersistTaps="handled">
                  <Card><View style={{ padding: 16, gap: 12 }}>
                      <Text variant="heading-md/semibold">{title}</Text>
                      <TextInput accessibilityLabel="Exact hex color" value={color} placeholder="#5865F2" autoCapitalize="characters" autoCorrect={false} maxLength={7} onChangeText={setColor} />
                      <Button text="Apply color" variant="secondary" disabled={colorNumber(color) == null} onPress={() => onApply(color.toUpperCase())} />
                  </View></Card>
                  <TableRadioGroup title="Presets" value={color.toUpperCase()} onChange={setColor} hasIcons>
                      {PROFILE_COLORS.map(preset => <TableRadioRow key={preset} label={preset}
                          icon={<TableRow.Icon source={require("@lib/api/assets").findAssetId("PaintPaletteIcon") || require("@lib/api/assets").findAssetId("SettingsIcon")} />}
                          value={preset} />)}
                  </TableRadioGroup>
              </ScrollView>;
          }

          function DecorationGallery({ onSelect }: { onSelect: (item: { asset: string; skuId: string; uri: string }) => void }) {
              const [items, setItems] = useState<Array<{ asset: string; skuId: string; label: string; uri: string }>>([]);
              const [loading, setLoading] = useState(true);
              useEffect(() => {
                  let active = true;
                  void findDecorationCatalog().then(result => { if (active) { setItems(result); setLoading(false); } });
                  const timer = setTimeout(() => void findDecorationCatalog().then(result => { if (active) { setItems(result); setLoading(false); } }), 1200);
                  return () => { active = false; clearTimeout(timer); };
              }, []);
              return <FlatList data={items} keyExtractor={item => `${item.asset}:${item.skuId}`}
                  initialNumToRender={12} maxToRenderPerBatch={12} windowSize={5}
                  contentContainerStyle={{ padding: 12, paddingBottom: 48 }}
                  renderItem={({ item }) => <TableRow arrow label={item.label}
                      icon={<TableRow.Icon source={{ uri: item.uri }} />}
                      onPress={() => onSelect(item)} />}
                  ListEmptyComponent={<Text variant="text-sm/medium" color="text-muted" style={{ padding: 16 }}>
                      {loading ? "Loading decorations…" : "No decorations loaded. Open Discord's Shop, then try again."}
                  </Text>} />;
          }

          export default function FakeProfile() {
              const [activeTab, setActiveTab] = useState<ProfileTab>("profile");
              const [showDetails, setShowDetails] = useState(false);
              useProxy(settings);
              const [, redraw] = useReducer(value => value + 1, 0);
              const navigation = NavigationNative.useNavigation();

              useEffect(() => {
                  fakeProfileEditorOpen = true;
                  initializeFakeProfile();
                  redraw();
                  return () => { fakeProfileEditorOpen = false; };
              }, []);

              const update = (key: keyof PreviewSettings, value: any, refresh = false) => {
                  rootSettings.fakeProfile = { ...preview, selectedBadges: { ...(preview.selectedBadges || {}) }, [key]: value, syncRevision: Date.now() };
                  preview = rootSettings.fakeProfile as PreviewSettings;
                  queueSharedPublish();
                  clearCache();
                  if (refresh) refreshPreview();
                  suppressOwnPullUntil = Date.now() + 15_000;
                  redraw();
              };

              const choose = async (key: "avatarMedia" | "bannerMedia", source: "photo" | "file") => {
                  try {
                      if (await (source === "photo" ? pickPhoto(key) : pickFile(key))) redraw();
                  } catch (error: any) {
                      diagnostics.last = error?.message || "Could not open the picker.";
                      redraw();
                      Alert.alert("FakeProfile", diagnostics.last);
                  }
              };

              const clearMedia = (field: "avatarMedia" | "bannerMedia") => {
                  try {
                      markMediaCleared(field);
                      rootSettings.fakeProfile = {
                          ...preview,
                          [field]: null,
                          selectedBadges: { ...(preview.selectedBadges || {}) }
                      } satisfies PreviewSettings;
                      preview = rootSettings.fakeProfile as PreviewSettings;
                      clearCache();
                      suppressOwnPullUntil = Date.now() + 15_000;
                      diagnostics.last = field === "bannerMedia" ? "Banner cleared" : "Profile picture cleared";
                      refreshPreview();
                      redraw();
                  } catch (error: any) {
                      diagnostics.last = error?.message || "Could not clear the image";
                      redraw();
                  }
              };

              const chooseDuration = (field: "nitroMonths" | "boostMonths", title: string, values: number[]) => {
                  const key = field === "nitroMonths" ? "FakeProfileNitroDuration" : "FakeProfileBoostDuration";
                  try {
                      simpleSheets.showSimpleActionSheet({
                          key,
                          header: {
                              title,
                              onClose: () => simpleSheets.hideActionSheet?.(key)
                          },
                          options: values.map(months => ({
                              label: field === "boostMonths" ? boosterLabel(months) : durationLabel(months),
                              onPress: () => {
                                  if (field === "nitroMonths") update("nitroEnabled", true, true);
                                  update(field, months, true);
                                  diagnostics.last = `${title}: ${durationLabel(months)}`;
                                  simpleSheets.hideActionSheet?.(key);
                              }
                          }))
                      });
                  } catch (error: any) {
                      diagnostics.last = error?.message || `Could not open ${title.toLowerCase()}`;
                      redraw();
                  }
              };

              const chooseExperimentalBadge = (group: typeof EXPERIMENTAL_BADGE_GROUPS[number]) => {
                  const key = `FakeProfileBadge_${group.id}`;
                  const selectTier = (id: string) => {
                      const selected = { ...preview.selectedBadges };
                      for (const tier of group.tiers) delete selected[tier.id];
                      if (id) selected[id] = true;
                      update("selectedBadges", selected, true);
                      simpleSheets.hideActionSheet?.(key);
                  };
                  try {
                      simpleSheets.showSimpleActionSheet({
                          key,
                          header: { title: group.label, onClose: () => simpleSheets.hideActionSheet?.(key) },
                          options: [
                              { label: "None", onPress: () => selectTier("") },
                              ...group.tiers.map(tier => ({ label: `${tier.name} · ${tier.milestone}`, onPress: () => selectTier(tier.id) }))
                          ]
                      });
