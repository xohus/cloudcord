              const light = luminance !== null ? (luminance + 0.05) / 0.05 >= 1.05 / (luminance + 0.05) : safeStore("ThemeStore")?.theme === "light";
              const tintColor = light ? "#000000" : "#ffffff";
              // Render keys must not share tint across users or cached light/dark views.
              const renderId = `${badge.id}:${user?.userId || user?.id || user?.user?.id || "self"}:${light ? "light" : "dark"}`;
              addRenderedBadge(result, renderId, badge.label, CLOUDCORD_BADGE_ICON);
              const props = badgeRenderProps.get(renderId);
              if (props) { props.tintColor = tintColor; props.style = { ...props.style, tintColor, resizeMode: "contain" }; }
              const row = result.find(item => item.id === renderId);
              if (row) { row.tintColor = tintColor; row.style = { tintColor }; }
          }

          function showGiftingBadgeOverlay(selectedLabel?: string) {
              try {
                  const index = Math.max(0, GIFT_LEVELS.findIndex(gift => selectedLabel?.startsWith(gift.name)));
                  const gift = GIFT_LEVELS[index];
                  const opener = typeof openGiftingBadgeInfoActionSheet === "function"
                      ? openGiftingBadgeInfoActionSheet
                      : openGiftingBadgeInfoActionSheet?.default ?? openGiftingBadgeInfoActionSheet?.openGiftingBadgeInfoActionSheet;
