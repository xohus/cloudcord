          }

          export function ExtrasPage() {
              // Keep taps working with the keyboard open and scroll fields above it.
              return <ScrollView keyboardShouldPersistTaps="handled" keyboardDismissMode="on-drag" automaticallyAdjustKeyboardInsets contentContainerStyle={{ padding: 12, paddingBottom: 320 }}>
                  <Card border="strong"><ExtrasCard onReset={() => { try { bindSavedPreview(); clearCache(); refreshPreview(); } catch {} }} /></Card>
              </ScrollView>;
          }

          export function initializeFakeProfile() {
              if (initPromise) return initPromise;
              initPromise = (async () => {
                  try {
                      await awaitStorage(settings);
                      bindSavedPreview();
                      await pullRealCordConfiguration();
                      if ((globalThis as any).__CLOUDCORD_LOADER__?.loaderName === "RealCord" && !realCordSyncTimer) {
                          realCordSyncTimer = setInterval(pullRealCordConfiguration, 5000);
                      }
                      ensurePatches();
                      for (const step of [installGiftHook, installBoostHooks, applyFakeNitro]) { try { step(); } catch {} }
                      const restoreLater = () => setTimeout(() => { try { restoreFakeRequests(); } catch {} }, 1500);
                      restoreLater();
                      try { FluxDispatcher.subscribe("CONNECTION_OPEN", () => { try { applyFakeNitro(); } catch {} restoreLater(); }); } catch {}
                      connectRealProfileMenu();
                      await pullOwnSharedProfile();
                      void refreshPublishedBadges(true);
                      AppState.addEventListener("change", state => { if (state === "active") void refreshPublishedBadges(true); });
                      if (!sharedSyncTimer) sharedSyncTimer = setInterval(() => {
                          if (AppState.currentState !== "active") return;
                          void pullOwnSharedProfile();
                          refreshSharedProfiles();
                          if (AppState.currentState === "active") void refreshPublishedBadges();
                      }, 15_000);
                      if (preview.enabled) { refreshPreview(); queueSharedPublish(); }
                  } catch (error: any) {
                      diagnostics.last = error?.message || "Could not restore Fake Profile";
                      initPromise = null;
                  }
              })();
              return initPromise;
          }

          async function getImageSize(uri: string, asset: any) {
              if (asset?.width && asset?.height) return { width: Number(asset.width), height: Number(asset.height) };
              return await withTimeout(new Promise<{ width: number; height: number }>((resolve, reject) => {
                  Image.getSize(uri, (width, height) => resolve({ width, height }), reject);
              }), 8000);
          }

          async function normalizeMedia(key: "avatarMedia" | "bannerMedia", asset: any) {
              const sourceUri = asset?.fileCopyUri || asset?.uri;
              const name = String(asset?.fileName || asset?.name || "Selected image");
              const type = String(asset?.type || "").toLowerCase();
              if (!sourceUri) throw new Error("No image was selected.");
              if (type && !type.startsWith("image/")) throw new Error("Choose a picture or GIF.");

              const animated = type.includes("gif") || /\.gif(?:$|\?)/i.test(name) || /\.gif(?:$|\?)/i.test(sourceUri);
              let size = { width: Number(asset?.width || 0), height: Number(asset?.height || 0) };
              try { size = await getImageSize(sourceUri, asset); } catch {}

              const target = key === "bannerMedia" ? { width: 600, height: 240 } : { width: 512, height: 512 };
              const sourceRatio = size.width && size.height ? size.width / size.height : target.width / target.height;
              const targetRatio = target.width / target.height;
              let uri = sourceUri;
              let normalized = Math.abs(sourceRatio - targetRatio) < 0.01;

              if (!animated && size.width > 0 && size.height > 0 && !normalized) {
                  const crop = sourceRatio > targetRatio
                      ? { offset: { x: Math.round((size.width - size.height * targetRatio) / 2), y: 0 }, size: { width: Math.round(size.height * targetRatio), height: size.height } }
                      : { offset: { x: 0, y: Math.round((size.height - size.width / targetRatio) / 2) }, size: { width: size.width, height: Math.round(size.width / targetRatio) } };
                  try {
                      const editor = findByProps("cropImage") as any;
                      const result = await withTimeout(Promise.resolve().then(() => editor?.cropImage?.(sourceUri, { ...crop, displaySize: target, resizeMode: "cover" })), 8000);
                      const output = typeof result === "string" ? result : result?.uri;
                      if (output) { uri = output; normalized = true; }
                  } catch {}

                  if (!normalized) {
                      try {
                          const manipulator = findByProps("manipulateAsync") as any;
                          const result = await withTimeout(Promise.resolve().then(() => manipulator?.manipulateAsync?.(sourceUri, [
                              { crop: { originX: crop.offset.x, originY: crop.offset.y, width: crop.size.width, height: crop.size.height } },
                              { resize: target }
                          ])), 8000);
                          if (result?.uri) { uri = result.uri; normalized = true; }
                      } catch {}
                  }
              }

              const label = key === "bannerMedia" ? "Banner" : "Profile picture";
              diagnostics.last = animated
                  ? `${label} animation preserved and fitted in preview`
                  : normalized ? `${label} resized to ${target.width} x ${target.height}` : `${label} fitted to ${target.width} x ${target.height} in preview`;
              return { uri, name, type, width: target.width, height: target.height, normalized };
          }

          function beginMediaSelection(key: "avatarMedia" | "bannerMedia") {
              const token = { ownerId: currentUserId };
              mediaSelections.set(key, token);
              return token;
          }
          async function saveMedia(key: "avatarMedia" | "bannerMedia", asset: any, token = beginMediaSelection(key)) {
              const media = await normalizeMedia(key, asset);
              if (!token.ownerId || currentUserId !== token.ownerId || mediaSelections.get(key) !== token) return false;
              preview[key] = media;
              preview.syncRevision = Math.max(Date.now(), Number(preview.syncRevision || 0) + 1);
              rootSettings.fakeProfile = { ...preview, selectedBadges: { ...(preview.selectedBadges || {}) } };
              preview = rootSettings.fakeProfile as PreviewSettings;
              unmarkMediaCleared(key);
              suppressOwnPullUntil = Date.now() + 15_000;
              refreshPreview();
              queueSharedPublish();
              return true;
          }

          async function pickFile(key: "avatarMedia" | "bannerMedia") {
              const token = beginMediaSelection(key);
              const picker = findByProps("pickSingle", "isCancel") as any;
              if (!picker?.pickSingle) throw new Error("The system file picker is unavailable.");
              try {
                  const asset = await picker.pickSingle({
                      type: picker.types?.images || "image/*",
                      mode: "import",
                      copyTo: "documentDirectory"
                  });
                  return asset ? await saveMedia(key, asset, token) : false;
              } catch (error) {
                  if (picker.isCancel?.(error)) return false;
                  throw error;
              }
          }

          async function pickPhoto(key: "avatarMedia" | "bannerMedia") {
              const picker = findByProps("launchImageLibrary") as any;
              if (!picker?.launchImageLibrary) return pickFile(key);
              const token = beginMediaSelection(key);
              const result: any = await new Promise((resolve, reject) => {
                  try {
                      const returned = picker.launchImageLibrary({
                          mediaType: "photo",
                          selectionLimit: 1,
                          includeBase64: false,
                          assetRepresentationMode: "current"
                      }, resolve);
                      if (returned?.then) returned.then(resolve, reject);
                  } catch (error) { reject(error); }
              });
              if (result?.didCancel) return false;
              if (result?.errorCode) throw new Error(result.errorMessage || "The photo picker failed.");
              const asset = result?.assets?.[0];
              return asset ? await saveMedia(key, asset, token) : false;
          }

