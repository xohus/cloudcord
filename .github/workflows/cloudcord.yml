                  setOwnValue(cloned, "avatarURL", data.avatar);
                  setOwnValue(cloned, "avatarUrl", data.avatar);
                  setOwnValue(cloned, "avatarSrc", data.avatar);
                  setOwnValue(cloned, "getAvatarURL", () => data.avatar);
              }
