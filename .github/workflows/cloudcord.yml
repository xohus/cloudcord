name: Build CloudCord Runtime

"on":
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Clone clean Kettu source
        run: |
          set -e
          rm -rf _cloudcord_source
          git clone --depth=1 https://codeberg.org/cocobo1/Kettu.git _cloudcord_source

      - name: Apply CloudCord patches
        run: |
          set -e
          cd _cloudcord_source

          if [ -f "../cloudcord-favicon.png" ]; then
            cp "../cloudcord-favicon.png" "src/assets/icons/kettu.png"
          elif [ -f "../assets/cloudcord-favicon.png" ]; then
            cp "../assets/cloudcord-favicon.png" "src/assets/icons/kettu.png"
          elif [ -f "../assets/cloudcord-logo.png" ]; then
            cp "../assets/cloudcord-logo.png" "src/assets/icons/kettu.png"
          fi

          mkdir -p src/core/ui/settings/pages/CloudSync
          mkdir -p src/core/ui/settings/pages/FakeProfile
          mkdir -p src/core/ui/settings/components
          cp "../ios/assets/fakeprofile-icon.png" "src/assets/icons/fakeprofile.png"

          cat > src/core/ui/settings/components/ScaledPluginSettings.tsx <<'TSX'
          import type { ComponentType } from "react";
          import { ScrollView, View } from "react-native";

          export default function ScaledPluginSettings({ component: Component }: { component: ComponentType<any> }) {
              return (
                  <ScrollView
                      style={{ flex: 1 }}
                      contentContainerStyle={{
                          paddingBottom: 90,
                          paddingHorizontal: 12
                      }}
                      showsVerticalScrollIndicator={true}
                  >
                      <View
                          style={{
                              width: "100%",
                              paddingRight: 24,
                              overflow: "visible"
                          }}
                      >
                          <Component />
                      </View>
                  </ScrollView>
              );
          }
          TSX

          cat > src/core/ui/settings/pages/CloudSync/index.tsx <<'TSX'
          import { VdPluginManager } from "@core/vendetta/plugins";
          import { useProxy } from "@core/vendetta/storage";
          import ScaledPluginSettings from "@core/ui/settings/components/ScaledPluginSettings";
          import { findAssetId } from "@lib/api/assets";
          import { showToast } from "@lib/ui/toasts";
          import { Card, Stack, TableRow, TableRowGroup, Text } from "@metro/common/components";
          import { useState } from "react";
          import { ScrollView, View } from "react-native";

          const PLUGIN_URL = "https://revenge.nexpid.xyz/cloud-sync/";
          const CLOUDSYNC_ICON = "https://images.weserv.nl/?url=raw.githubusercontent.com/nexpid/CloudSync/main/assets/icon-bright.svg&w=128&h=128&output=png";

          export default function CloudSync() {
              useProxy(VdPluginManager.plugins);

              const [busy, setBusy] = useState(false);
              const [refresh, setRefresh] = useState(0);

              const plugin = VdPluginManager.plugins[PLUGIN_URL];
              const SettingsComponent = plugin?.enabled ? VdPluginManager.getSettings(PLUGIN_URL) : null;

              async function installOrStart() {
                  if (busy) return;

                  setBusy(true);

                  try {
                      if (!VdPluginManager.plugins[PLUGIN_URL]) {
                          await VdPluginManager.installPlugin(PLUGIN_URL, true);
                          showToast("Cloud Sync installed", findAssetId("Check"));
                      } else if (!VdPluginManager.plugins[PLUGIN_URL].enabled) {
                          await VdPluginManager.startPlugin(PLUGIN_URL);
                          showToast("Cloud Sync started", findAssetId("Check"));
                      } else {
                          showToast("Cloud Sync is already enabled", findAssetId("Check"));
                      }

                      setRefresh(x => x + 1);
                  } catch (error: any) {
                      console.error("[CloudCord] Cloud Sync install/start failed", error);
                      showToast(error?.message ?? "Cloud Sync failed");
                  } finally {
                      setBusy(false);
                  }
              }

              async function refetchPlugin() {
                  if (busy) return;

                  setBusy(true);

                  try {
                      if (VdPluginManager.plugins[PLUGIN_URL]?.enabled) {
                          VdPluginManager.stopPlugin(PLUGIN_URL, false);
                      }

                      await VdPluginManager.fetchPlugin(PLUGIN_URL);
                      await VdPluginManager.startPlugin(PLUGIN_URL);

                      showToast("Cloud Sync refreshed", findAssetId("Check"));
                      setRefresh(x => x + 1);
                  } catch (error: any) {
                      console.error("[CloudCord] Cloud Sync refresh failed", error);
                      showToast(error?.message ?? "Cloud Sync refresh failed");
                  } finally {
                      setBusy(false);
                  }
              }

              async function removePlugin() {
                  if (busy) return;

                  setBusy(true);

                  try {
                      if (VdPluginManager.plugins[PLUGIN_URL]) {
                          await VdPluginManager.removePlugin(PLUGIN_URL);
                      }

                      showToast("Cloud Sync removed");
                      setRefresh(x => x + 1);
                  } catch (error: any) {
                      console.error("[CloudCord] Cloud Sync remove failed", error);
                      showToast(error?.message ?? "Cloud Sync remove failed");
                  } finally {
                      setBusy(false);
                  }
              }

              if (SettingsComponent) {
                  return <ScaledPluginSettings key={`cloud-sync-settings-${refresh}`} component={SettingsComponent} />;
              }

              return (
                  <ScrollView style={{ flex: 1 }} contentContainerStyle={{ paddingBottom: 38 }}>
                      <Stack style={{ paddingVertical: 24, paddingHorizontal: 12 }} spacing={24}>
                          <TableRowGroup title="Cloud Sync">
                              <View style={{ paddingHorizontal: 12, paddingBottom: 12 }}>
                                  <Text variant="heading-md/semibold" color="text-normal">
                                      Cloud Sync
                                  </Text>
                                  <Text variant="text-sm/medium" color="text-muted">
                                      Install the official Cloud Sync plugin to connect, sync, add backup files, and save backups to your device.
                                  </Text>
                              </View>

                              <TableRow
                                  arrow
                                  label={plugin ? "Start Cloud Sync" : "Install Cloud Sync"}
                                  subLabel={busy ? "Please wait..." : "Loads the official Cloud Sync plugin UI"}
                                  icon={<TableRow.Icon source={{ uri: CLOUDSYNC_ICON }} />}
                                  onPress={installOrStart}
                              />

                              {plugin && (
                                  <TableRow
                                      arrow
                                      label="Refresh Cloud Sync"
                                      subLabel="Refetches the official plugin"
                                      icon={<TableRow.Icon source={findAssetId("RetryIcon")!} />}
                                      onPress={refetchPlugin}
                                  />
                              )}

                              {plugin && (
                                  <TableRow
                                      arrow
                                      label="Remove Cloud Sync"
                                      subLabel="Uninstalls the Cloud Sync plugin"
                                      icon={<TableRow.Icon source={findAssetId("TrashIcon") ?? findAssetId("CircleXIcon-primary")!} />}
                                      onPress={removePlugin}
                                  />
                              )}
                          </TableRowGroup>

                          <Card border="strong">
                              <View style={{ padding: 12 }}>
                                  <Text variant="text-sm/medium" color="text-muted">
                                      This tab uses the official Cloud Sync plugin. The plugin itself handles OAuth, sync, backups, and files.
                                  </Text>
                              </View>
                          </Card>
                      </Stack>
                  </ScrollView>
              );
          }
          TSX


          cat > src/core/ui/settings/pages/FakeProfile/index.tsx <<'TSX'
          import FakeProfileIcon from "@assets/icons/fakeprofile.png";
          import { useProxy } from "@core/vendetta/storage";
          import { instead } from "@lib/api/patcher";
          import { settings } from "@lib/api/settings";
          import { findByProps, findByStoreName } from "@metro";
          import { Card, Stack, Text } from "@metro/common/components";
          import { useEffect, useReducer } from "react";
          import { Alert, Image, Pressable, ScrollView, Switch, TextInput, View } from "react-native";
          
          type MediaValue = { uri: string; name: string; type: string } | null;
          type PreviewSettings = {
              enabled: boolean;
              displayName: string;
              username: string;
              avatarMedia: MediaValue;
              bannerMedia: MediaValue;
              replaceBadges: boolean;
              selectedBadges: Record<string, boolean>;
          };
          
          const BADGES: Array<[string, string, number]> = [
              ["hypesquad", "HypeSquad Events", 4],
              ["bug1", "Bug Hunter 1", 8],
              ["bravery", "HypeSquad Bravery", 64],
              ["brilliance", "HypeSquad Brilliance", 128],
              ["balance", "HypeSquad Balance", 256],
              ["early", "Early Supporter", 512],
              ["bug2", "Bug Hunter 2", 16384],
              ["vdev", "Verified Developer", 131072],
              ["mod", "Former Moderator", 262144],
              ["active", "Active Developer", 4194304]
          ];
          
          const rootSettings = settings as any;
          rootSettings.fakeProfile ??= {
              enabled: false,
              displayName: "Preview Name",
              username: "preview",
              avatarMedia: null,
              bannerMedia: null,
              replaceBadges: false,
              selectedBadges: {}
          } satisfies PreviewSettings;
          
          const preview = rootSettings.fakeProfile as PreviewSettings;
          const diagnostics = {
              patches: 0,
              userStore: false,
              profileStore: false,
              avatarResolver: false,
              bannerResolver: false,
              last: "Ready"
          };
          
          let initialized = false;
          let currentUserId: string | null = null;
          let userCache = new WeakMap<object, any>();
          let profileCache = new WeakMap<object, any>();
          
          function clearCache() {
              userCache = new WeakMap();
              profileCache = new WeakMap();
          }
          
          function mediaUri(key: "avatarMedia" | "bannerMedia") {
              return String(preview[key]?.uri || "");
          }
          
          function safeStore(name: string) {
              try { return findByStoreName(name) as any; }
              catch { return null; }
          }
          
          function setOwnValue(target: any, key: string, value: any) {
              if (!target) return;
              try {
                  Object.defineProperty(target, key, { configurable: true, enumerable: true, writable: true, value });
              } catch {
                  try { target[key] = value; } catch {}
              }
          }
          
          function cloneObject(original: any, kind: "user" | "profile") {
              if (!original || !preview.enabled) return original;
              const cache = kind === "profile" ? profileCache : userCache;
              try {
                  const cached = cache.get(original);
                  if (cached) return cached;
              } catch {}
          
              let cloned: any;
              try {
                  cloned = Object.create(Object.getPrototypeOf(original));
                  for (const key of Reflect.ownKeys(original)) {
                      const descriptor = Object.getOwnPropertyDescriptor(original, key);
                      if (descriptor) Object.defineProperty(cloned, key, descriptor);
                  }
              } catch {
                  try { cloned = { ...original }; }
                  catch { return original; }
              }
          
              const displayName = preview.displayName || original.globalName || original.displayName || original.username;
              const username = preview.username || original.username;
              const avatar = mediaUri("avatarMedia");
              const banner = mediaUri("bannerMedia");
              let selectedFlags = 0;
              for (const [id, , flag] of BADGES) if (preview.selectedBadges?.[id]) selectedFlags |= flag;
              const flags = preview.replaceBadges ? selectedFlags : Number(original.publicFlags ?? original.flags ?? 0) | selectedFlags;
          
              setOwnValue(cloned, "username", username);
              setOwnValue(cloned, "globalName", displayName);
              setOwnValue(cloned, "displayName", displayName);
              setOwnValue(cloned, "publicFlags", flags);
              setOwnValue(cloned, "flags", flags);
              if (avatar) {
                  setOwnValue(cloned, "avatarURL", avatar);
                  setOwnValue(cloned, "avatarUrl", avatar);
                  setOwnValue(cloned, "getAvatarURL", () => avatar);
              }
              if (banner) {
                  setOwnValue(cloned, "banner", banner);
                  setOwnValue(cloned, "bannerURL", banner);
                  setOwnValue(cloned, "bannerUrl", banner);
                  setOwnValue(cloned, "getBannerURL", () => banner);
              }
          
              try { cache.set(original, cloned); } catch {}
              return cloned;
          }
          
          function isCurrentUser(id?: string) {
              return !id || !currentUserId || id === currentUserId;
          }
          
          function addPatch(method: string, parent: any, handler: (args: any[], original: Function) => any) {
              if (!parent?.[method]) return;
              try {
                  instead(method, parent, handler as any);
                  diagnostics.patches += 1;
              } catch (error: any) {
                  diagnostics.last = error?.message || `Could not connect ${method}`;
              }
          }
          
          function ensurePatches() {
              if (initialized) return;
              initialized = true;
          
              const userStore = safeStore("UserStore") || findByProps("getCurrentUser", "getUser");
              diagnostics.userStore = !!userStore;
              try { currentUserId = userStore?.getCurrentUser?.()?.id || null; } catch {}
          
              addPatch("getCurrentUser", userStore, (args, original) => {
                  const user = original(...args);
                  currentUserId = user?.id || currentUserId;
                  return cloneObject(user, "user");
              });
              addPatch("getUser", userStore, (args, original) => {
                  if (!isCurrentUser(args?.[0])) return original(...args);
                  return cloneObject(original(...args), "user");
              });
          
              const profileStore = safeStore("UserProfileStore") || findByProps("getUserProfile", "getGuildMemberProfile");
              diagnostics.profileStore = !!profileStore;
              addPatch("getUserProfile", profileStore, (args, original) => {
                  if (!isCurrentUser(args?.[0])) return original(...args);
                  return cloneObject(original(...args), "profile");
              });
              addPatch("getGuildMemberProfile", profileStore, (args, original) => {
                  if (!isCurrentUser(args?.[0])) return original(...args);
                  return cloneObject(original(...args), "profile");
              });
          
              const avatarResolver = findByProps("getUserAvatarURL") || findByProps("getAvatarURL", "getDefaultAvatarURL");
              const bannerResolver = findByProps("getUserBannerURL") || findByProps("getBannerURL");
              diagnostics.avatarResolver = !!avatarResolver;
              diagnostics.bannerResolver = !!bannerResolver;
          
              for (const method of ["getUserAvatarURL", "getAvatarURL"]) {
                  addPatch(method, avatarResolver, (args, original) => {
                      const uri = mediaUri("avatarMedia");
                      const subject = args?.[0];
                      const id = typeof subject === "string" ? subject : subject?.id;
                      return preview.enabled && uri && isCurrentUser(id) ? uri : original(...args);
                  });
              }
              for (const method of ["getUserBannerURL", "getBannerURL"]) {
                  addPatch(method, bannerResolver, (args, original) => {
                      const uri = mediaUri("bannerMedia");
                      const subject = args?.[0];
                      const id = typeof subject === "string" ? subject : subject?.id;
                      return preview.enabled && uri && isCurrentUser(id) ? uri : original(...args);
                  });
              }
          
              diagnostics.last = `Connected ${diagnostics.patches} preview hooks`;
          }
          
          function refreshPreview() {
              clearCache();
              try { safeStore("UserStore")?.emitChange?.(); } catch {}
              try { safeStore("UserProfileStore")?.emitChange?.(); } catch {}
              try {
                  const dispatcher = findByProps("dispatch", "subscribe") as any;
                  dispatcher?.dispatch?.({ type: "CURRENT_USER_UPDATE" });
                  if (currentUserId) dispatcher?.dispatch?.({ type: "USER_PROFILE_UPDATE", userId: currentUserId });
              } catch {}
          }
          
          function saveMedia(key: "avatarMedia" | "bannerMedia", asset: any) {
              const uri = asset?.fileCopyUri || asset?.uri;
              const name = String(asset?.fileName || asset?.name || "Selected image");
              const type = String(asset?.type || "").toLowerCase();
              if (!uri) throw new Error("No image was selected.");
              if (type && !type.startsWith("image/")) throw new Error("Choose a picture or GIF.");
              preview[key] = { uri, name, type };
              diagnostics.last = `${key === "avatarMedia" ? "Profile picture" : "Banner"} selected: ${name}`;
              refreshPreview();
          }
          
          async function pickFile(key: "avatarMedia" | "bannerMedia") {
              const picker = findByProps("pickSingle", "isCancel") as any;
              if (!picker?.pickSingle) throw new Error("The system file picker is unavailable.");
              try {
                  const asset = await picker.pickSingle({
                      type: picker.types?.images || "image/*",
                      mode: "import",
                      copyTo: "documentDirectory"
                  });
                  if (asset) saveMedia(key, asset);
                  return !!asset;
              } catch (error) {
                  if (picker.isCancel?.(error)) return false;
                  throw error;
              }
          }
          
          async function pickPhoto(key: "avatarMedia" | "bannerMedia") {
              const picker = findByProps("launchImageLibrary") as any;
              if (!picker?.launchImageLibrary) return pickFile(key);
              const result: any = await new Promise((resolve, reject) => {
                  try {
                      const returned = picker.launchImageLibrary({
                          mediaType: "photo",
                          selectionLimit: 1,
                          includeBase64: false,
                          assetRepresentationMode: "current"
                      }, resolve);
                      if (returned?.then) returned.then(resolve, reject);
                  } catch (error) { reject(error); }
              });
              if (result?.didCancel) return false;
              if (result?.errorCode) throw new Error(result.errorMessage || "The photo picker failed.");
              const asset = result?.assets?.[0];
              if (asset) saveMedia(key, asset);
              return !!asset;
          }
          
          function ActionButton({ label, onPress, muted = false }: { label: string; onPress: () => void; muted?: boolean }) {
              return (
                  <Pressable onPress={onPress} style={{ flex: 1, padding: 11, borderRadius: 9, backgroundColor: muted ? "#35373c" : "#5865f2" }}>
                      <Text variant="text-sm/bold" style={{ color: "#fff", textAlign: "center" }}>{label}</Text>
                  </Pressable>
              );
          }
          
          export default function FakeProfile() {
              useProxy(settings);
              const [, redraw] = useReducer(value => value + 1, 0);
          
              useEffect(() => {
                  ensurePatches();
                  redraw();
              }, []);
          
              const update = (key: keyof PreviewSettings, value: any, refresh = false) => {
                  (preview as any)[key] = value;
                  clearCache();
                  if (refresh) refreshPreview();
                  redraw();
              };
          
              const choose = async (key: "avatarMedia" | "bannerMedia", source: "photo" | "file") => {
                  try {
                      if (await (source === "photo" ? pickPhoto(key) : pickFile(key))) redraw();
                  } catch (error: any) {
                      diagnostics.last = error?.message || "Could not open the picker.";
                      redraw();
                      Alert.alert("FakeProfile", diagnostics.last);
                  }
              };
          
              const MediaEditor = ({ label, field, banner = false }: { label: string; field: "avatarMedia" | "bannerMedia"; banner?: boolean }) => {
                  const value = preview[field];
                  return (
                      <View style={{ gap: 9, marginBottom: 16 }}>
                          <Text variant="text-sm/bold" color="text-normal">{label}</Text>
                          <View style={{ flexDirection: "row", gap: 10 }}>
                              <ActionButton label="Choose picture" onPress={() => void choose(field, "photo")} />
                              <ActionButton label="Choose file" muted onPress={() => void choose(field, "file")} />
                          </View>
                          {value?.uri && (
                              <View style={{ borderRadius: 12, overflow: "hidden", backgroundColor: "#1f2023" }}>
                                  <Image source={{ uri: value.uri }} resizeMode="cover" style={banner ? { width: "100%", height: 112 } : { width: 90, height: 90, borderRadius: 45, alignSelf: "center", marginVertical: 12 }} />
                                  <View style={{ flexDirection: "row", alignItems: "center", padding: 10, gap: 8 }}>
                                      <Text variant="text-xs/medium" color="text-muted" numberOfLines={1} style={{ flex: 1 }}>{value.name}</Text>
                                      <Pressable onPress={() => update(field, null, true)} style={{ paddingHorizontal: 10, paddingVertical: 6, borderRadius: 7, backgroundColor: "#4a2024" }}>
                                          <Text variant="text-xs/bold" style={{ color: "#ff7b84" }}>Clear</Text>
                                      </Pressable>
                                  </View>
                              </View>
                          )}
                      </View>
                  );
              };
          
              const avatar = mediaUri("avatarMedia");
              const banner = mediaUri("bannerMedia");
          
              return (
                  <ScrollView style={{ flex: 1 }} contentContainerStyle={{ paddingHorizontal: 12, paddingVertical: 16, paddingBottom: 80 }}>
                      <Stack spacing={16}>
                          <View style={{ flexDirection: "row", alignItems: "center", gap: 12 }}>
                              <Image source={{ uri: FakeProfileIcon }} style={{ width: 48, height: 48, borderRadius: 12 }} />
                              <View style={{ flex: 1 }}>
                                  <Text variant="heading-lg/semibold" color="text-normal">FakeProfile</Text>
                                  <Text variant="text-sm/medium" color="text-muted">Built-in local profile preview</Text>
                              </View>
                          </View>
          
                          <Card border="strong">
                              <View style={{ borderRadius: 14, overflow: "hidden" }}>
                                  {banner ? <Image source={{ uri: banner }} resizeMode="cover" style={{ width: "100%", height: 118 }} /> : <View style={{ height: 118, backgroundColor: "#5865f2" }} />}
                                  <View style={{ paddingHorizontal: 16, paddingBottom: 16 }}>
                                      {avatar ? <Image source={{ uri: avatar }} style={{ width: 82, height: 82, borderRadius: 41, marginTop: -41, borderWidth: 5, borderColor: "#1f2023" }} /> : <View style={{ width: 82, height: 82, borderRadius: 41, marginTop: -41, borderWidth: 5, borderColor: "#1f2023", backgroundColor: "#777" }} />}
                                      <Text variant="heading-md/semibold" color="text-normal" style={{ marginTop: 10 }}>{preview.displayName || "Preview Name"}</Text>
                                      <Text variant="text-sm/medium" color="text-muted">@{preview.username || "preview"}</Text>
                                      <Text variant="text-xs/bold" style={{ color: "#7ee787", marginTop: 8 }}>LOCAL PREVIEW ONLY</Text>
                                  </View>
                              </View>
                          </Card>
          
                          <Card border="strong">
                              <View style={{ padding: 14, gap: 14 }}>
                                  <View style={{ flexDirection: "row", alignItems: "center", gap: 12 }}>
                                      <View style={{ flex: 1 }}>
                                          <Text variant="text-md/bold" color="text-normal">Show preview in the client</Text>
                                          <Text variant="text-xs/medium" color="text-muted">Affects only what you see on this device</Text>
                                      </View>
                                      <Switch value={preview.enabled} onValueChange={value => update("enabled", value, true)} />
                                  </View>
                                  <View style={{ gap: 8 }}>
                                      <Text variant="text-sm/bold" color="text-normal">Display name</Text>
                                      <TextInput defaultValue={preview.displayName} placeholder="Preview Name" placeholderTextColor="#777" onChangeText={value => update("displayName", value)} style={{ color: "#fff", backgroundColor: "#1f2023", borderRadius: 9, padding: 12 }} />
                                  </View>
                                  <View style={{ gap: 8 }}>
                                      <Text variant="text-sm/bold" color="text-normal">Username</Text>
                                      <TextInput defaultValue={preview.username} placeholder="preview" placeholderTextColor="#777" autoCapitalize="none" autoCorrect={false} onChangeText={value => update("username", value)} style={{ color: "#fff", backgroundColor: "#1f2023", borderRadius: 9, padding: 12 }} />
                                  </View>
                                  <MediaEditor label="Profile picture" field="avatarMedia" />
                                  <MediaEditor label="Banner" field="bannerMedia" banner />
                                  <ActionButton label="Apply preview" onPress={() => { diagnostics.last = "Preview refreshed"; refreshPreview(); redraw(); }} />
                              </View>
                          </Card>
          
                          <Card border="strong">
                              <View style={{ padding: 14, gap: 10 }}>
                                  <View style={{ flexDirection: "row", alignItems: "center", gap: 12 }}>
                                      <View style={{ flex: 1 }}>
                                          <Text variant="text-md/bold" color="text-normal">Replace visible badges</Text>
                                          <Text variant="text-xs/medium" color="text-muted">Show only the badges selected below</Text>
                                      </View>
                                      <Switch value={preview.replaceBadges} onValueChange={value => update("replaceBadges", value, true)} />
                                  </View>
                                  {BADGES.map(([id, label]) => (
                                      <Pressable key={id} onPress={() => update("selectedBadges", { ...preview.selectedBadges, [id]: !preview.selectedBadges?.[id] }, true)} style={{ flexDirection: "row", alignItems: "center", paddingVertical: 8 }}>
                                          <Text variant="text-sm/medium" color="text-normal" style={{ flex: 1 }}>{label}</Text>
                                          <Switch value={!!preview.selectedBadges?.[id]} onValueChange={() => update("selectedBadges", { ...preview.selectedBadges, [id]: !preview.selectedBadges?.[id] }, true)} />
                                      </Pressable>
                                  ))}
                              </View>
                          </Card>
          
                          <Card border="strong">
                              <View style={{ padding: 14, gap: 5 }}>
                                  <Text variant="heading-sm/semibold" color="text-normal">Diagnostics</Text>
                                  <Text variant="text-xs/medium" color="text-muted">Preview hooks: {diagnostics.patches}</Text>
                                  <Text variant="text-xs/medium" color="text-muted">User source: {diagnostics.userStore ? "Connected" : "Unavailable"}</Text>
                                  <Text variant="text-xs/medium" color="text-muted">Profile source: {diagnostics.profileStore ? "Connected" : "Unavailable"}</Text>
                                  <Text variant="text-xs/medium" color="text-muted">Profile picture resolver: {diagnostics.avatarResolver ? "Connected" : "Unavailable"}</Text>
                                  <Text variant="text-xs/medium" color="text-muted">Banner resolver: {diagnostics.bannerResolver ? "Connected" : "Unavailable"}</Text>
                                  <Text variant="text-xs/medium" color="text-muted">Last action: {diagnostics.last}</Text>
                              </View>
                          </Card>
                      </Stack>
                  </ScrollView>
              );
          }
          TSX

          cat > src/lib/addons/themes/colors/patches/background.tsx <<'TSX'
          export default function patchChatBackground() {
              return () => {};
          }
          TSX

          python3 - <<'PY'
          from pathlib import Path
          import re

          DISCORD_URL = "https://discord.gg/5naTPJYemX"
          GITHUB_URL = "https://github.com/xohus/cloudcord"
          CLOUDCORD_ICON = "https://raw.githubusercontent.com/xohus/cloudcord/main/cloudcord-favicon.png"
          CLOUDSYNC_ICON = "https://images.weserv.nl/?url=raw.githubusercontent.com/nexpid/CloudSync/main/assets/icon-bright.svg&w=128&h=128&output=png"

          replacements = {
              "KettuTweak": "CloudCord",
              "Kettu Enhancements": "CloudCord Enhancements",
              "Kettu": "CloudCord",
              "https://github.com/C0C0B01/CloudCord": GITHUB_URL,
              "https://github.com/C0C0B01/Kettu": GITHUB_URL,
              "https://github.com/BypassHub-EX/cloudcord": GITHUB_URL,
              "https://codeberg.org/cocobo1/CloudCord": GITHUB_URL,
              "https://codeberg.org/cocobo1/Kettu": GITHUB_URL,
              "Load Kettu without loading add-ons": "Load CloudCord without loading add-ons",
              "Failed to load Kettu!": "Failed to load CloudCord!"
          }

          exts = {".ts", ".tsx", ".js", ".jsx", ".json", ".mjs", ".md"}

          for path in Path(".").rglob("*"):
              if not path.is_file() or path.suffix not in exts:
                  continue

              text = path.read_text(encoding="utf-8", errors="ignore")
              original = text

              for old, new in replacements.items():
                  text = text.replace(old, new)

              if text != original:
                  path.write_text(text, encoding="utf-8")

          constants = Path("src/lib/utils/constants.ts")
          if constants.exists():
              text = constants.read_text(encoding="utf-8", errors="ignore")

              text = re.sub(
                  r'export const DISCORD_SERVER = ".*?";',
                  f'export const DISCORD_SERVER = "{DISCORD_URL}";',
                  text
              )

              text = re.sub(
                  r'export const CODEBERG = ".*?";',
                  'export const CODEBERG = "";',
                  text
              )

              text = re.sub(
                  r'export const GITHUB = ".*?";',
                  f'export const GITHUB = "{GITHUB_URL}";',
                  text
              )

              constants.write_text(text, encoding="utf-8")

          strings = Path("src/core/i18n/default.json")
          if strings.exists():
              text = strings.read_text(encoding="utf-8", errors="ignore")

              text = text.replace('"PUPU": "Kettu"', '"PUPU": "CloudCord"')
              text = text.replace('"PUPU_URL": "Kettu URL"', '"PUPU_URL": "CloudCord URL"')
              text = text.replace('"CODEBERG": "Codeberg"', '"CODEBERG": ""')
              text = text.replace('"URL_PLACEHOLDER": "https://codeberg.org/cocobo1/Kettu"', f'"URL_PLACEHOLDER": "{GITHUB_URL}"')
              text = text.replace('"URL_PLACEHOLDER": "https://github.com/BypassHub-EX/cloudcord"', f'"URL_PLACEHOLDER": "{GITHUB_URL}"')

              strings.write_text(text, encoding="utf-8")

          general = Path("src/core/ui/settings/pages/General/index.tsx")
          if general.exists():
              text = general.read_text(encoding="utf-8", errors="ignore")

              text = text.replace(
                  'import { DISCORD_SERVER, GITHUB, CODEBERG } from "@lib/utils/constants";',
                  'import { DISCORD_SERVER, GITHUB } from "@lib/utils/constants";'
              )

              text = text.replace(
                  'import { GITHUB, CODEBERG } from "@lib/utils/constants";',
                  'import { DISCORD_SERVER, GITHUB } from "@lib/utils/constants";'
              )

              text = text.replace(
                  'import { GITHUB } from "@lib/utils/constants";',
                  'import { DISCORD_SERVER, GITHUB } from "@lib/utils/constants";'
              )

              text = text.replace(
                  'import CodebergIcon from "@assets/icons/codeberg-logo_icon_white.png";\n',
                  ''
              )

              text = re.sub(
                  r'\n\s*<TableRow\s+arrow=\{true\}\s+label=\{Strings\.CODEBERG\}[\s\S]*?onPress=\{\(\) => Linking\.openURL\(CODEBERG\)\}\s*/>',
                  '',
                  text
              )

              if "Linking.openURL(DISCORD_SERVER)" not in text:
                  text = text.replace(
                      '<TableRowGroup title={Strings.LINKS}>',
                      '''<TableRowGroup title={Strings.LINKS}>
                    <TableRow
                        arrow={true}
                        label={Strings.DISCORD_SERVER}
                        icon={<TableRow.Icon source={findAssetId("Discord")!} />}
                        onPress={() => Linking.openURL(DISCORD_SERVER)}
                    />'''
                  )

              general.write_text(text, encoding="utf-8")

          settings_index = Path("src/core/ui/settings/index.ts")
          if settings_index.exists():
              text = settings_index.read_text(encoding="utf-8", errors="ignore")

              if 'import FakeProfileIcon from "@assets/icons/fakeprofile.png";' not in text:
                  text = 'import FakeProfileIcon from "@assets/icons/fakeprofile.png";\n' + text

              text = text.replace(
                  'icon: { uri: PupuIcon },',
                  f'icon: {{ uri: "{CLOUDCORD_ICON}" }},'
              )

              text = re.sub(
                  r'\n\s*\{\s*key:\s*"CLOUD_SYNC"[\s\S]*?(?:render:\s*\(\) => import\("[^"]+"\)|onPress:\s*\(\) => [^\n]+)[\s\S]*?\n\s*\},',
                  '',
                  text
              )

              cloud_sync_item = f'''            {{
                  key: "CLOUD_SYNC",
                  title: () => "Cloud Sync",
                  icon: {{ uri: "{CLOUDSYNC_ICON}" }},
                  render: () => import("@core/ui/settings/pages/CloudSync")
              }},'''

              fake_profile_item = f'''            {{
                  key: "FAKE_PROFILE",
                  title: () => "FakeProfile",
                  icon: {{ uri: FakeProfileIcon }},
                  render: () => import("@core/ui/settings/pages/FakeProfile")
              }},'''

              plugin_row_pattern = r'(\n\s*\{\s*key:\s*"BUNNY_PLUGINS",)'

              items = []
              if 'key: "FAKE_PROFILE"' not in text:
                  items.append(fake_profile_item)
              if 'key: "CLOUD_SYNC"' not in text:
                  items.append(cloud_sync_item)

              if items:
                  text = re.sub(
                      plugin_row_pattern,
                      lambda match: "\n" + "\n".join(items) + match.group(1),
                      text,
                      count=1
                  )

              settings_index.write_text(text, encoding="utf-8")

          vendetta_api = Path("src/core/vendetta/api.tsx")
          if vendetta_api.exists():
              text = vendetta_api.read_text(encoding="utf-8", errors="ignore")

              marker = 'import { VdPluginManager, VendettaPlugin } from "./plugins";\n'

              patched_forms_code = r'''
          const makeIcon = (leading: any) => leading;

          const PatchedFormRow = (props: any) => createElement(commonComponents.TableRow, {
              label: props.label,
              subLabel: props.subLabel,
              icon: makeIcon(props.leading),
              trailing: props.trailing,
              onPress: props.onPress,
              disabled: props.disabled,
              arrow: props.arrow
          });

          (PatchedFormRow as any).Icon = (Forms as any).FormRow?.Icon ?? commonComponents.TableRow.Icon;
          (PatchedFormRow as any).Arrow = (Forms as any).FormRow?.Arrow ?? commonComponents.TableRow.Arrow;

          const PatchedFormSwitchRow = (props: any) => createElement(commonComponents.TableSwitchRow, {
              label: props.label,
              subLabel: props.subLabel,
              icon: makeIcon(props.leading),
              value: !!props.value,
              onValueChange: props.onValueChange,
              disabled: props.disabled
          });

          const PatchedFormSection = (props: any) => createElement(commonComponents.TableRowGroup, {
              title: props.title,
              ...props
          }, props.children);

          const PatchedForms = {
              ...Forms,
              FormRow: PatchedFormRow,
              FormSwitchRow: PatchedFormSwitchRow,
              FormSection: PatchedFormSection,
              FormDivider: () => null
          };
          '''

              if "const PatchedForms =" not in text:
                  text = text.replace(marker, marker + patched_forms_code + "\n")

              text = text.replace(
                  "                Forms,\n                General: common.ReactNative,",
                  "                Forms: PatchedForms,\n                General: common.ReactNative,"
              )

              vendetta_api.write_text(text, encoding="utf-8")

          plugin_info = Path("src/core/ui/settings/pages/Plugins/sheets/PluginInfoActionSheet.tsx")
          if plugin_info.exists():
              text = plugin_info.read_text(encoding="utf-8", errors="ignore")

              if 'ScaledPluginSettings' not in text:
                  text = text.replace(
                      'import TitleComponent from "./TitleComponent";',
                      'import TitleComponent from "./TitleComponent";\nimport ScaledPluginSettings from "@core/ui/settings/components/ScaledPluginSettings";'
                  )

              text = text.replace(
                  'render: plugin.getPluginSettingsComponent(),',
                  'render: () => <ScaledPluginSettings component={plugin.getPluginSettingsComponent()!} />,'
              )

              plugin_info.write_text(text, encoding="utf-8")

          vd_plugin_info = Path("src/core/ui/settings/pages/Plugins/sheets/VdPluginInfoActionSheet.tsx")
          if vd_plugin_info.exists():
              text = vd_plugin_info.read_text(encoding="utf-8", errors="ignore")

              if 'ScaledPluginSettings' not in text:
                  text = text.replace(
                      'import { PluginInfoActionSheetProps } from "./common";',
                      'import { PluginInfoActionSheetProps } from "./common";\nimport ScaledPluginSettings from "@core/ui/settings/components/ScaledPluginSettings";'
                  )

              text = text.replace(
                  'render: SettingsComponent,',
                  'render: () => <ScaledPluginSettings component={SettingsComponent} />,'
              )

              text = text.replace(
                  'render: SettingsComponent',
                  'render: () => <ScaledPluginSettings component={SettingsComponent} />'
              )

              vd_plugin_info.write_text(text, encoding="utf-8")

          build = Path("scripts/build.mjs")
          if build.exists():
              text = build.read_text(encoding="utf-8", errors="ignore")
              text = text.replace('version: `"v1.4.2"`', 'version: `"v0.1"`')
              text = text.replace('version: `"v1.4.1"`', 'version: `"v0.1"`')
              text = text.replace('version: `"v1.4.0"`', 'version: `"v0.1"`')
              build.write_text(text, encoding="utf-8")
          PY

      - name: Install dependencies
        run: |
          set -e
          cd _cloudcord_source
          bun install

      - name: Build CloudCord runtime
        run: |
          set -e
          cd _cloudcord_source
          bun run build -- --build-minify

          mkdir -p ../dist

          cp dist/kettu.js ../cloudcord.js
          cp dist/kettu.min.js ../cc.js
          cp dist/kettu.min.js ../cloudcord.min.js

          cp dist/kettu.js ../dist/cloudcord.js
          cp dist/kettu.min.js ../dist/cc.js
          cp dist/kettu.min.js ../dist/cloudcord.min.js

      - name: Commit runtime files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add cc.js cloudcord.js cloudcord.min.js
          git add dist/cc.js dist/cloudcord.js dist/cloudcord.min.js

          if git diff --cached --quiet; then
            echo "No runtime changes to commit."
            exit 0
          fi

          git commit -m "Build CloudCord v0.1 runtime"
          git push

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudcord-runtime
          path: |
            cc.js
            cloudcord.js
            cloudcord.min.js
            dist/cc.js
            dist/cloudcord.js
            dist/cloudcord.min.js
