name: CloudCord Desktop

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout CloudCord
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Install Windows compiler tools
        shell: pwsh
        run: |
          choco install mingw --no-progress -y
          Add-Content $env:GITHUB_PATH "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin"
          Add-Content $env:GITHUB_PATH "C:\ProgramData\mingw64\mingw64\bin"

      - name: Verify required source files
        shell: bash
        run: |
          set -e

          test -f desktop/client/package.json
          test -f desktop/client/scripts/build/build.mjs
          test -f desktop/client/scripts/build-installer.sh
          test -d desktop/client

      - name: Print tool versions
        shell: bash
        run: |
          node --version
          pnpm --version
          go version
          gcc --version || true

      - name: Install dependencies
        working-directory: desktop/client
        shell: bash
        run: |
          set -e
          pnpm install --frozen-lockfile=false

      - name: Typecheck
        working-directory: desktop/client
        shell: bash
        run: |
          pnpm typecheck || true

      - name: Build desktop runtime
        working-directory: desktop/client
        shell: bash
        run: |
          set -e
          pnpm build

      - name: Verify desktop runtime output
        shell: bash
        run: |
          set -e

          if [ ! -d "desktop/client/dist/desktop" ]; then
            echo "desktop/client/dist/desktop was not produced"
            find desktop/client/dist -maxdepth 3 -type f 2>/dev/null || true
            exit 1
          fi

      - name: Build Windows installer
        working-directory: desktop/client
        shell: bash
        run: |
          set -e
          pnpm build:installer

      - name: Stage artifacts
        shell: bash
        run: |
          set -e
          mkdir -p desktop/client/dist
          cp desktop/client/installer/CloudCordSetup.exe desktop/client/dist/CloudCordSetup.exe
          cp desktop/client/installer/CloudCordSetup.exe desktop/client/dist/cloudcord.exe
          cp desktop/client/installer/CloudCordSetup-Test.exe desktop/client/dist/CloudCordSetup-Test.exe
          cp desktop/client/installer/CloudCordSetup-Test.exe desktop/client/dist/cloudcord-test.exe

          test -f desktop/client/dist/CloudCordSetup.exe
          test -f desktop/client/dist/CloudCordSetup-Test.exe
          test -d desktop/client/dist

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudCordDesktop-Windows
          path: |
            desktop/client/dist/CloudCordSetup.exe
            desktop/client/dist/desktop/**
            desktop/client/CREDITS.md
            desktop/client/CLOUDCORD_NOTES.md
            desktop/client/README.md

      - name: Package desktop.asar for updater
        shell: bash
        run: |
          set -e
          # The built runtime is the desktop folder; package it for the in-app updater.
          npm install -g @electron/asar --quiet 2>/dev/null || true
          asar pack desktop/client/dist/desktop desktop/client/dist/desktop.asar
          cp desktop/client/dist/desktop.asar desktop/client/dist/cloudcord.asar
          cp desktop/client/dist/desktop.asar desktop/client/dist/runtime
          cp desktop/client/dist/desktop.asar desktop/client/dist/desktop-test.asar
          cp desktop/client/dist/desktop.asar desktop/client/dist/cloudcord-test.asar
          test -f desktop/client/dist/desktop.asar

      - name: Upload binaries to GitHub Release (Production)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: new_beta_t_desktop
          name: CloudCord Desktop ${{ github.sha }}
          make_latest: true
          files: |
            desktop/client/dist/desktop.asar
            desktop/client/dist/cloudcord.asar
            desktop/client/dist/runtime
            desktop/client/dist/CloudCordSetup.exe
            desktop/client/dist/cloudcord.exe
            desktop/client/dist/CloudCordSetup-Test.exe
            desktop/client/dist/cloudcord-test.exe
            desktop/client/dist/desktop-test.asar
            desktop/client/dist/cloudcord-test.asar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload binaries to GitHub Release (Isolated Test Channel)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: new_beta_test_desktop
          name: CloudCord Desktop Test ${{ github.sha }}
          prerelease: true
          files: |
            desktop/client/dist/CloudCordSetup-Test.exe
            desktop/client/dist/cloudcord-test.exe
            desktop/client/dist/desktop-test.asar
            desktop/client/dist/cloudcord-test.asar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
