name: Build CloudCord Runtime

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - "cloudcord-favicon.png"
      - "assets/cloudcord-favicon.png"
      - "assets/cloudcord-logo.png"
      - ".github/workflows/cloudcord.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Clone clean Kettu source
        run: |
          set -e
          rm -rf _cloudcord_source
          git clone --depth=1 https://codeberg.org/cocobo1/Kettu.git _cloudcord_source

      - name: Apply CloudCord patches
        run: |
          set -e
          cd _cloudcord_source

          if [ -f "../cloudcord-favicon.png" ]; then
            cp "../cloudcord-favicon.png" "src/assets/icons/kettu.png"
          elif [ -f "../assets/cloudcord-favicon.png" ]; then
            cp "../assets/cloudcord-favicon.png" "src/assets/icons/kettu.png"
          elif [ -f "../assets/cloudcord-logo.png" ]; then
            cp "../assets/cloudcord-logo.png" "src/assets/icons/kettu.png"
          fi

          mkdir -p src/core/ui/settings/pages/CloudSync
          mkdir -p src/core/ui/settings/pages/FakeProfile
          mkdir -p src/core/ui/settings/pages/BotCord
          mkdir -p src/core/ui/botcord
          mkdir -p src/core/ui/settings/components
          mkdir -p src/lib/api
          cp "../ios/assets/fakeprofile-icon.png" "src/assets/icons/fakeprofile.png"
          cp "../ios/runtime/src/core/ui/settings/pages/BotCord/index.tsx" "src/core/ui/settings/pages/BotCord/index.tsx"
          cp "../ios/runtime/src/lib/api/botcord.ts" "src/lib/api/botcord.ts"
          mkdir -p src/lib/api/native
          cp "../ios/runtime/src/lib/api/native/legacyRuntimeRefresh.ts" "src/lib/api/native/legacyRuntimeRefresh.ts"
          cp "../ios/runtime/src/lib/api/native/loader.ts" "src/lib/api/native/loader.ts"

          cat > src/core/ui/settings/components/ScaledPluginSettings.tsx <<'TSX'
          import type { ComponentType } from "react";
          import { ScrollView, View } from "react-native";

          export default function ScaledPluginSettings({ component: Component }: { component: ComponentType<any> }) {
              return (
                  <ScrollView
                      style={{ flex: 1 }}
                      contentContainerStyle={{
                          paddingBottom: 90,
                          paddingHorizontal: 12
                      }}
                      showsVerticalScrollIndicator={true}
                  >
                      <View
                          style={{
                              width: "100%",
                              paddingRight: 24,
                              overflow: "visible"
                          }}
                      >
                          <Component />
                      </View>
                  </ScrollView>
              );
          }
          TSX

          cat > src/core/ui/settings/pages/CloudSync/index.tsx <<'TSX'
          import { VdPluginManager } from "@core/vendetta/plugins";
          import { useProxy } from "@core/vendetta/storage";
          import ScaledPluginSettings from "@core/ui/settings/components/ScaledPluginSettings";
          import { findAssetId } from "@lib/api/assets";
          import { showToast } from "@lib/ui/toasts";
          import { Card, Stack, TableRow, TableRowGroup, Text } from "@metro/common/components";
          import { useState } from "react";
          import { ScrollView, View } from "react-native";

          const PLUGIN_URL = "https://revenge.nexpid.xyz/cloud-sync/";
          const CLOUDSYNC_ICON = "https://images.weserv.nl/?url=raw.githubusercontent.com/nexpid/CloudSync/main/assets/icon-bright.svg&w=128&h=128&output=png";

          export default function CloudSync() {
              useProxy(VdPluginManager.plugins);

              const [busy, setBusy] = useState(false);
              const [refresh, setRefresh] = useState(0);

              const plugin = VdPluginManager.plugins[PLUGIN_URL];
              const SettingsComponent = plugin?.enabled ? VdPluginManager.getSettings(PLUGIN_URL) : null;

              async function installOrStart() {
                  if (busy) return;

                  setBusy(true);

                  try {
                      if (!VdPluginManager.plugins[PLUGIN_URL]) {
                          await VdPluginManager.installPlugin(PLUGIN_URL, true);
                          showToast("Cloud Sync installed", findAssetId("Check"));
                      } else if (!VdPluginManager.plugins[PLUGIN_URL].enabled) {
                          await VdPluginManager.startPlugin(PLUGIN_URL);
                          showToast("Cloud Sync started", findAssetId("Check"));
                      } else {
                          showToast("Cloud Sync is already enabled", findAssetId("Check"));
                      }

                      setRefresh(x => x + 1);
                  } catch (error: any) {
                      console.error("[CloudCord] Cloud Sync install/start failed", error);
                      showToast(error?.message ?? "Cloud Sync failed");
                  } finally {
                      setBusy(false);
                  }
              }

              async function refetchPlugin() {
                  if (busy) return;

                  setBusy(true);

                  try {
                      if (VdPluginManager.plugins[PLUGIN_URL]?.enabled) {
                          VdPluginManager.stopPlugin(PLUGIN_URL, false);
                      }

                      await VdPluginManager.fetchPlugin(PLUGIN_URL);
                      await VdPluginManager.startPlugin(PLUGIN_URL);

                      showToast("Cloud Sync refreshed", findAssetId("Check"));
                      setRefresh(x => x + 1);
                  } catch (error: any) {
                      console.error("[CloudCord] Cloud Sync refresh failed", error);
                      showToast(error?.message ?? "Cloud Sync refresh failed");
                  } finally {
                      setBusy(false);
                  }
              }

              async function removePlugin() {
                  if (busy) return;

                  setBusy(true);

                  try {
                      if (VdPluginManager.plugins[PLUGIN_URL]) {
                          await VdPluginManager.removePlugin(PLUGIN_URL);
                      }

                      showToast("Cloud Sync removed");
                      setRefresh(x => x + 1);
                  } catch (error: any) {
                      console.error("[CloudCord] Cloud Sync remove failed", error);
                      showToast(error?.message ?? "Cloud Sync remove failed");
                  } finally {
                      setBusy(false);
                  }
              }

              if (SettingsComponent) {
                  return <ScaledPluginSettings key={`cloud-sync-settings-${refresh}`} component={SettingsComponent} />;
              }

              return (
                  <ScrollView style={{ flex: 1 }} contentContainerStyle={{ paddingBottom: 38 }}>
                      <Stack style={{ paddingVertical: 24, paddingHorizontal: 12 }} spacing={24}>
                          <TableRowGroup title="Cloud Sync">
                              <View style={{ paddingHorizontal: 12, paddingBottom: 12 }}>
                                  <Text variant="heading-md/semibold" color="text-normal">
                                      Cloud Sync
                                  </Text>
                                  <Text variant="text-sm/medium" color="text-muted">
                                      Install the official Cloud Sync plugin to connect, sync, add backup files, and save backups to your device.
                                  </Text>
                              </View>

                              <TableRow
                                  arrow
                                  label={plugin ? "Start Cloud Sync" : "Install Cloud Sync"}
                                  subLabel={busy ? "Please wait..." : "Loads the official Cloud Sync plugin UI"}
                                  icon={<TableRow.Icon source={{ uri: CLOUDSYNC_ICON }} />}
                                  onPress={installOrStart}
                              />

                              {plugin && (
                                  <TableRow
                                      arrow
                                      label="Refresh Cloud Sync"
                                      subLabel="Refetches the official plugin"
                                      icon={<TableRow.Icon source={findAssetId("RetryIcon")!} />}
                                      onPress={refetchPlugin}
                                  />
                              )}

                              {plugin && (
                                  <TableRow
                                      arrow
                                      label="Remove Cloud Sync"
                                      subLabel="Uninstalls the Cloud Sync plugin"
                                      icon={<TableRow.Icon source={findAssetId("TrashIcon") ?? findAssetId("CircleXIcon-primary")!} />}
                                      onPress={removePlugin}
                                  />
                              )}
                          </TableRowGroup>

                          <Card border="strong">
                              <View style={{ padding: 12 }}>
                                  <Text variant="text-sm/medium" color="text-muted">
                                      This tab uses the official Cloud Sync plugin. The plugin itself handles OAuth, sync, backups, and files.
                                  </Text>
                              </View>
                          </Card>
                      </Stack>
                  </ScrollView>
              );
          }
          TSX


          cat > src/core/ui/settings/pages/FakeProfile/index.tsx <<'TSX'
          import FakeProfileIcon from "@assets/icons/fakeprofile.png";
          import { awaitStorage, useProxy } from "@core/vendetta/storage";
          import { after, instead } from "@lib/api/patcher";
          import { onJsxCreate } from "@lib/api/react/jsx";
          import { settings } from "@lib/api/settings";
          import { findByNameLazy, findByProps, findByStoreName } from "@metro";
          import { FluxDispatcher } from "@metro/common";
          import { Card, Stack, Text } from "@metro/common/components";
          import { useEffect, useReducer } from "react";
          import { Alert, Image, Pressable, ScrollView, TextInput, View } from "react-native";
          
          type MediaValue = { uri: string; name: string; type: string; width?: number; height?: number; normalized?: boolean } | null;
          type PreviewSettings = {
              enabled: boolean;
              displayName: string;
              username: string;
              avatarMedia: MediaValue;
              bannerMedia: MediaValue;
              nitroMonths: number;
              boostMonths: number;
              replaceBadges: boolean;
              selectedBadges: Record<string, boolean>;
          };
          
          const BADGES: Array<[string, string, number, string]> = [
              ["bug1", "Bug Hunter 1", 8, "https://cdn.discordapp.com/badge-icons/2717692c7dca7289b35297368a940dd0.png"],
              ["bug2", "Bug Hunter 2", 16384, "https://cdn.discordapp.com/badge-icons/848f79194d4be5ff5f81505cbd0ce1e6.png"],
              ["hypesquad", "HypeSquad Events", 4, "https://cdn.discordapp.com/badge-icons/bf01d1073931f921909045f3a39fd264.png"],
              ["bravery", "HypeSquad Bravery", 64, "https://cdn.discordapp.com/badge-icons/8a88d63823d8a71cd5e390baa45efa02.png"],
              ["brilliance", "HypeSquad Brilliance", 128, "https://cdn.discordapp.com/badge-icons/011940fd013da3f7fb926e4a1cd2e618.png"],
              ["balance", "HypeSquad Balance", 256, "https://cdn.discordapp.com/badge-icons/3aa41de486fa12454c3761e8e223442e.png"],
              ["mod", "Former Moderator", 262144, "https://cdn.discordapp.com/badge-icons/fee1624003e2fee35cb398e125dc479b.png"],
              ["early", "Early Supporter", 512, "https://cdn.discordapp.com/badge-icons/7060786766c9c840eb3019e725d2b358.png"],
              ["vdev", "Verified Developer", 131072, "https://cdn.discordapp.com/badge-icons/6df5892e0f35b051f8b61eace34f4967.png"]
          ];

          const useBadgesModule = findByNameLazy("useBadges", false);
          const useUserProfileModule = findByNameLazy("useUserProfile", false);
          const useDisplayProfileModule = findByNameLazy("useDisplayProfile", false);
          const badgeRenderProps = new Map<string, Record<string, any>>();
          const simpleSheets = findByProps("showSimpleActionSheet") as any;
          const overriddenKeys = new Set([
              "username", "globalName", "displayName", "publicFlags", "flags", "badges", "profileBadges",
              "avatarURL", "avatarUrl", "getAvatarURL", "banner", "bannerURL", "bannerUrl", "getBannerURL", "getPreviewBanner", "hasFlag",
              "premiumType", "premiumSince", "premiumGuildSince", "user", "userProfile", "guildMemberProfile", "displayProfile", "profile"
          ]);

          const NITRO_DURATIONS = [0, 1, 2, 3, 6, 12, 24, 36, 72];
          const BOOST_DURATIONS = [0, 1, 2, 3, 6, 9, 12, 15, 18, 24];
          const NITRO_ICONS: Array<[number, string]> = [
              [72, "https://cdn.discordapp.com/badge-icons/5b154df19c53dce2af92c9b61e6be5e2.png"],
              [36, "https://cdn.discordapp.com/badge-icons/cd5e2cfd9d7f27a8cdcd3e8a8d5dc9f4.png"],
              [24, "https://cdn.discordapp.com/badge-icons/11e2d339068b55d3a506cff34d3780f3.png"],
              [12, "https://cdn.discordapp.com/badge-icons/0d61871f72bb9a33a7ae568c1fb4f20a.png"],
              [6, "https://cdn.discordapp.com/badge-icons/0334688279c8359120922938dcb1d6f8.png"],
              [3, "https://cdn.discordapp.com/badge-icons/2895086c18d5531d499862e41d1155a6.png"],
              [2, "https://cdn.discordapp.com/badge-icons/4514fab914bdbfb4ad2fa23df76121a6.png"],
              [1, "https://cdn.discordapp.com/badge-icons/4f33c4a9c64ce221936bd256c356f91f.png"]
          ];
          const BOOST_ICONS: Array<[number, string]> = [
              [24, "https://cdn.discordapp.com/badge-icons/ec92202290b48d0879b7413d2dde3bab.png"],
              [18, "https://cdn.discordapp.com/badge-icons/7142225d31238f6387d9f09efaa02759.png"],
              [15, "https://cdn.discordapp.com/badge-icons/cb3ae83c15e970e8f3d410bc62cb8b99.png"],
              [12, "https://cdn.discordapp.com/badge-icons/991c9f39ee33d7537d9f408c3e53141e.png"],
              [9, "https://cdn.discordapp.com/badge-icons/996b3e870e8a22ce519b3a50e6bdd52f.png"],
              [6, "https://cdn.discordapp.com/badge-icons/df199d2050d3ed4ebf84d64ae83989f8.png"],
              [3, "https://cdn.discordapp.com/badge-icons/72bed924410c304dbe3d00a6e593ff59.png"],
              [2, "https://cdn.discordapp.com/badge-icons/0e4080d1d333bc7ad29ef6528b6f2fb7.png"],
              [1, "https://cdn.discordapp.com/badge-icons/51040c70d4f20a921ad6674ff86fc95c.png"]
          ];
          
          const rootSettings = settings as any;
          const defaultPreview = (): PreviewSettings => ({
              enabled: false,
              displayName: "Preview Name",
              username: "preview",
              avatarMedia: null,
              bannerMedia: null,
              nitroMonths: 0,
              boostMonths: 0,
              replaceBadges: false,
              selectedBadges: {}
          });

          let preview = defaultPreview();
          let configReady = false;
          let initPromise: Promise<void> | null = null;

          function bindSavedPreview() {
              if (configReady) return;
              const saved = rootSettings.fakeProfile;
              rootSettings.fakeProfile = {
                  ...defaultPreview(),
                  ...(saved && typeof saved === "object" ? saved : {}),
                  selectedBadges: { ...(saved?.selectedBadges || {}) }
              } satisfies PreviewSettings;
              preview = rootSettings.fakeProfile as PreviewSettings;
              configReady = true;
          }

          const diagnostics = {
              patches: 0,
              userStore: false,
              profileStore: false,
              avatarResolver: false,
              bannerResolver: false,
              last: "Ready"
          };
          
          let initialized = false;
          let currentUserId: string | null = null;
          let realCurrentUser: any = null;
          let userCache = new WeakMap<object, any>();
          let profileCache = new WeakMap<object, any>();
          const SHARED_PROFILE_API = "https://cloudcord-profiles.ggxohus.workers.dev";
          const sharedProfiles = new Map<string, any>();
          const sharedRequests = new Set<string>();
          let publishTimer: ReturnType<typeof setTimeout> | null = null;

          async function shareableMedia(key: "avatarMedia" | "bannerMedia") {
              const uri = mediaUri(key);
              if (!uri || /^(?:https?:|data:)/i.test(uri)) return uri || null;
              try {
                  const blob = await (await fetch(uri)).blob();
                  if (blob.size > 1_250_000) return null;
                  const Reader = (globalThis as any).FileReader;
                  if (!Reader) return null;
                  return await new Promise<string | null>(resolve => {
                      const reader = new Reader();
                      reader.onload = () => resolve(typeof reader.result === "string" ? reader.result : null);
                      reader.onerror = () => resolve(null);
                      reader.readAsDataURL(blob);
                  });
              } catch { return null; }
          }

          async function ownSharedProfile() {
              return {
                  username: preview.username,
                  globalName: preview.displayName,
                  avatar: await shareableMedia("avatarMedia"),
                  banner: await shareableMedia("bannerMedia"),
                  nitro: preview.nitroMonths > 0,
                  nitroLevel: Math.max(-1, NITRO_DURATIONS.indexOf(preview.nitroMonths) - 1),
                  boostMonths: Math.max(-1, BOOST_DURATIONS.indexOf(preview.boostMonths) - 1),
                  badgeFlags: BADGES.reduce((flags, [id, , flag]) => preview.selectedBadges?.[id] ? flags | flag : flags, 0)
              };
          }

          async function publishSharedProfile() {
              if (!preview.enabled || !currentUserId) return;
              const saved = rootSettings.fakeProfileShare || {};
              const path = saved.id ? `/v1/profiles/${encodeURIComponent(saved.id)}` : "/v1/profiles";
              const response = await fetch(`${SHARED_PROFILE_API}${path}`, {
                  method: saved.id ? "PUT" : "POST",
                  headers: {
                      "Content-Type": "application/json",
                      ...(saved.editToken ? { Authorization: `Bearer ${saved.editToken}` } : {})
                  },
                  body: JSON.stringify({ ownerId: currentUserId, profile: await ownSharedProfile() })
              });
              if (!response.ok) throw new Error(`CloudCord sharing failed (${response.status})`);
              const result = await response.json() as any;
              if (!saved.id) rootSettings.fakeProfileShare = { id: result.id, editToken: result.editToken };
              diagnostics.last = "Fake Profile shared automatically";
          }

          function queueSharedPublish() {
              if (!preview.enabled) return;
              if (publishTimer) clearTimeout(publishTimer);
              publishTimer = setTimeout(() => void publishSharedProfile().catch(error => {
                  diagnostics.last = error?.message || "Sharing will retry later";
              }), 1200);
          }

          function requestSharedProfile(userId?: string) {
              const id = String(userId || "");
              if (!/^\d{15,22}$/.test(id) || id === currentUserId || sharedProfiles.has(id) || sharedRequests.has(id)) return;
              sharedRequests.add(id);
              void fetch(`${SHARED_PROFILE_API}/v1/profiles/user/${encodeURIComponent(id)}`)
                  .then(response => response.ok ? response.json() : null)
                  .then(profile => {
                      if (!profile || typeof profile !== "object") return;
                      sharedProfiles.set(id, profile);
                      try { safeStore("UserProfileStore")?.emitChange?.(); } catch {}
                  })
                  .catch(() => {})
                  .finally(() => sharedRequests.delete(id));
          }

          function cloneSharedUser(original: any, data: any) {
              if (!original || typeof original !== "object" || !data) return original;
              const cloned = Object.assign(Object.create(Object.getPrototypeOf(original) || Object.prototype), original);
              if (data.username) setOwnValue(cloned, "username", data.username);
              if (data.globalName) { setOwnValue(cloned, "globalName", data.globalName); setOwnValue(cloned, "displayName", data.globalName); }
              if (data.avatar) { setOwnValue(cloned, "avatarURL", data.avatar); setOwnValue(cloned, "avatarUrl", data.avatar); setOwnValue(cloned, "getAvatarURL", () => data.avatar); }
              if (data.banner) { setOwnValue(cloned, "banner", data.banner); setOwnValue(cloned, "bannerURL", data.banner); setOwnValue(cloned, "getBannerURL", () => data.banner); }
              if (data.badgeFlags != null) { setOwnValue(cloned, "publicFlags", Number(data.badgeFlags)); setOwnValue(cloned, "flags", Number(data.badgeFlags)); }
              if (data.nitro) setOwnValue(cloned, "premiumType", 2);
              return cloned;
          }

          function decorateSharedProfile(original: any, userId: string, data: any) {
              if (!original || typeof original !== "object" || !data) return original;
              const cloned = Object.assign(Object.create(Object.getPrototypeOf(original) || Object.prototype), original);
              if (cloned.user) setOwnValue(cloned, "user", cloneSharedUser(cloned.user, data));
              if (data.banner) { setOwnValue(cloned, "banner", data.banner); setOwnValue(cloned, "bannerURL", data.banner); setOwnValue(cloned, "bannerSrc", data.banner); }
              if (data.bio != null) setOwnValue(cloned, "bio", data.bio);
              if (data.accentColor != null) setOwnValue(cloned, "accentColor", data.accentColor);
              setOwnValue(cloned, "userId", userId);
              return cloned;
          }
          
          function clearCache() {
              userCache = new WeakMap();
              profileCache = new WeakMap();
          }
          
          function mediaUri(key: "avatarMedia" | "bannerMedia") {
              return String(preview[key]?.uri || "");
          }
          
          function safeStore(name: string) {
              try { return findByStoreName(name) as any; }
              catch { return null; }
          }
          
          function setOwnValue(target: any, key: string, value: any) {
              if (!target) return;
              try {
                  Object.defineProperty(target, key, { configurable: true, enumerable: true, writable: true, value });
              } catch {
                  try { target[key] = value; } catch {}
              }
          }

          function monthsAgo(months: number) {
              const date = new Date();
              date.setMonth(date.getMonth() - months);
              return date;
          }

          function durationLabel(months: number) {
              if (!months) return "None";
              if (months % 12 === 0) {
                  const years = months / 12;
                  return `${years} ${years === 1 ? "year" : "years"}`;
              }
              return `${months} ${months === 1 ? "month" : "months"}`;
          }

          function milestoneIcon(months: number, values: Array<[number, string]>) {
              return values.find(([minimum]) => months >= minimum)?.[1] || "";
          }

          function addRenderedBadge(result: any[], id: string, description: string, icon: string) {
              if (!icon || result.some(item => item?.id === id)) return;
              badgeRenderProps.set(id, { id, source: { uri: icon }, label: description });
              result.push({ id, description, icon: " _" });
          }

          function selectedBadgeObjects(existing: any) {
              const result: any[] = [];
              if (preview.nitroMonths > 0) {
                  const icon = milestoneIcon(preview.nitroMonths, NITRO_ICONS);
                  result.push({ id: "fakeprofile-nitro", description: `Nitro ${durationLabel(preview.nitroMonths)}`, icon: " _", iconSrc: icon, source: { uri: icon } });
              }
              if (preview.boostMonths > 0) {
                  const icon = milestoneIcon(preview.boostMonths, BOOST_ICONS);
                  result.push({ id: "fakeprofile-boost", description: `Server Booster ${durationLabel(preview.boostMonths)}`, icon: " _", iconSrc: icon, source: { uri: icon } });
              }
              for (const [id, description, , icon] of BADGES) {
                  if (!preview.selectedBadges?.[id]) continue;
                  const badgeId = `fakeprofile-${id}`;
                  if (!result.some(item => item?.id === badgeId)) {
                      result.push({ id: badgeId, description, icon: " _", iconSrc: icon, source: { uri: icon } });
                  }
              }
              if (!preview.replaceBadges && Array.isArray(existing)) {
                  for (const badge of existing) {
                      if (!badge || result.some(item => item?.id && item.id === badge?.id)) continue;
                      result.push(badge);
                  }
              }
              return result;
          }
          
          function cloneObject(original: any, kind: "user" | "profile") {
              if (!original || !preview.enabled) return original;
              const cache = kind === "profile" ? profileCache : userCache;
              try {
                  const cached = cache.get(original);
                  if (cached) return cached;
              } catch {}
          
              let cloned: any;
              try {
                  cloned = Object.create(Object.getPrototypeOf(original));
                  for (const key of Reflect.ownKeys(original)) {
                      if (overriddenKeys.has(String(key))) continue;
                      const descriptor = Object.getOwnPropertyDescriptor(original, key);
                      if (descriptor) Object.defineProperty(cloned, key, descriptor);
                  }
              } catch {
                  try { cloned = { ...original }; }
                  catch { return original; }
              }
          
              const displayName = preview.displayName || original.globalName || original.displayName || original.username;
              const username = preview.username || original.username;
              const avatar = mediaUri("avatarMedia");
              const banner = mediaUri("bannerMedia");
              let selectedFlags = 0;
              for (const [id, , flag] of BADGES) if (preview.selectedBadges?.[id]) selectedFlags |= flag;
              const flags = preview.replaceBadges ? selectedFlags : Number(original.publicFlags ?? original.flags ?? 0) | selectedFlags;
          
              setOwnValue(cloned, "username", username);
              setOwnValue(cloned, "globalName", displayName);
              setOwnValue(cloned, "displayName", displayName);
              setOwnValue(cloned, "publicFlags", flags);
              setOwnValue(cloned, "flags", flags);
              setOwnValue(cloned, "badges", selectedBadgeObjects(original.badges));
              setOwnValue(cloned, "profileBadges", selectedBadgeObjects(original.profileBadges));
              setOwnValue(cloned, "hasFlag", (flag: number) => !!(flags & flag));
              if (preview.nitroMonths > 0) {
                  setOwnValue(cloned, "premiumType", 2);
                  setOwnValue(cloned, "premiumSince", monthsAgo(preview.nitroMonths));
              }
              if (preview.boostMonths > 0) setOwnValue(cloned, "premiumGuildSince", monthsAgo(preview.boostMonths));
              if (avatar) {
                  setOwnValue(cloned, "avatarURL", avatar);
                  setOwnValue(cloned, "avatarUrl", avatar);
                  setOwnValue(cloned, "getAvatarURL", () => avatar);
              }
              if (banner) {
                  setOwnValue(cloned, "banner", banner);
                  setOwnValue(cloned, "bannerURL", banner);
                  setOwnValue(cloned, "bannerUrl", banner);
                  setOwnValue(cloned, "getBannerURL", () => banner);
                  setOwnValue(cloned, "getPreviewBanner", () => banner);
              }
          
              try { cache.set(original, cloned); } catch {}
              return cloned;
          }

          function decorateProfileResult(original: any, userId?: string) {
              if (!original || !preview.enabled || !isCurrentUser(userId)) return original;
              const decorated = cloneObject(original, "profile");
              if (original.user) setOwnValue(decorated, "user", cloneObject(original.user, "user"));
              if (original.userProfile) setOwnValue(decorated, "userProfile", cloneObject(original.userProfile, "profile"));
              if (original.guildMemberProfile) setOwnValue(decorated, "guildMemberProfile", cloneObject(original.guildMemberProfile, "profile"));
              if (original.displayProfile) setOwnValue(decorated, "displayProfile", cloneObject(original.displayProfile, "profile"));
              if (original.profile) setOwnValue(decorated, "profile", cloneObject(original.profile, "profile"));
              return decorated;
          }
          
          function isCurrentUser(id?: string) {
              return !id || !currentUserId || id === currentUserId;
          }
          
          function addPatch(method: string, parent: any, handler: (args: any[], original: Function) => any) {
              if (!parent?.[method]) return;
              try {
                  instead(method, parent, handler as any);
                  diagnostics.patches += 1;
              } catch (error: any) {
                  diagnostics.last = error?.message || `Could not connect ${method}`;
              }
          }

          function connectBadgeRenderer() {
              try {
                  after("default", useBadgesModule as any, ([user], result) => {
                      if (!Array.isArray(result)) return;
                      const id = String(user?.userId || user?.id || "");
                      if (!isCurrentUser(id)) {
                          requestSharedProfile(id);
                          const data = sharedProfiles.get(id);
                          if (!data) return;
                          const ordered: any[] = [];
                          const nitroMonths = [1, 2, 3, 6, 12, 24, 36, 72][Number(data.nitroLevel)] || 0;
                          const boostMonths = [1, 2, 3, 6, 9, 12, 15, 18, 24][Number(data.boostMonths)] || 0;
                          addRenderedBadge(ordered, "cloudcord-shared-nitro", `Nitro ${durationLabel(nitroMonths)}`, milestoneIcon(nitroMonths, NITRO_ICONS));
                          addRenderedBadge(ordered, "cloudcord-shared-boost", `Server Booster ${durationLabel(boostMonths)}`, milestoneIcon(boostMonths, BOOST_ICONS));
                          for (const [, description, flag, icon] of BADGES) {
                              if ((Number(data.badgeFlags || 0) & flag) !== 0) addRenderedBadge(ordered, `cloudcord-shared-${flag}`, description, icon);
                          }
                          result.splice(0, result.length, ...ordered, ...result.filter(item => !String(item?.id || "").startsWith("cloudcord-shared-")));
                          return;
                      }
                      if (!preview.enabled) return;

                      const existing = preview.replaceBadges ? [] : result.filter(item => !String(item?.id || "").startsWith("fakeprofile-"));
                      const ordered: any[] = [];
                      addRenderedBadge(
                          ordered,
                          "fakeprofile-nitro",
                          `Nitro ${durationLabel(preview.nitroMonths)}`,
                          milestoneIcon(preview.nitroMonths, NITRO_ICONS)
                      );
                      addRenderedBadge(
                          ordered,
                          "fakeprofile-boost",
                          `Server Booster ${durationLabel(preview.boostMonths)}`,
                          milestoneIcon(preview.boostMonths, BOOST_ICONS)
                      );
                      for (const [badgeId, description, , icon] of BADGES) {
                          if (!preview.selectedBadges?.[badgeId]) continue;
                          const id = `fakeprofile-${badgeId}`;
                          addRenderedBadge(ordered, id, description, icon);
                      }
                      result.splice(0, result.length, ...ordered, ...existing);
                  });
                  diagnostics.patches += 1;
              } catch (error: any) {
                  diagnostics.last = error?.message || "Could not connect badge list";
              }

              for (const component of ["ProfileBadge", "RenderedBadge"]) {
                  try {
                      onJsxCreate(component, (_component, rendered) => {
                          const props = badgeRenderProps.get(rendered?.props?.id);
                          if (props) Object.assign(rendered.props, props);
                      });
                      diagnostics.patches += 1;
                  } catch {}
              }
          }

          function addAfterPatch(method: string, parent: any, handler: (args: any[], result: any) => any) {
              if (!parent?.[method]) return;
              try {
                  after(method, parent, handler as any);
                  diagnostics.patches += 1;
              } catch (error: any) {
                  diagnostics.last = error?.message || `Could not connect ${method}`;
              }
          }

          function requestIsCurrent(args: any[]) {
              if (!currentUserId) return true;
              return args.some(value => value === currentUserId || value?.id === currentUserId || value?.userId === currentUserId || value?.user?.id === currentUserId);
          }

          function renderedUserId(props: any) {
              return props?.userId
                  || props?.user?.id
                  || props?.displayProfile?.userId
                  || props?.displayProfile?.user?.id
                  || props?.profile?.userId
                  || props?.profile?.user?.id;
          }

          function connectMediaRenderer() {
              const avatarComponents = ["UserHeaderAvatar", "ProfileAvatar", "UserProfileAvatar"];
              const bannerComponents = ["UserBanner", "ProfileBanner", "UserProfileBanner"];

              for (const component of avatarComponents) {
                  try {
                      onJsxCreate(component, (_component, rendered) => {
                          const props = rendered?.props;
                          const id = String(renderedUserId(props) || "");
                          if (!id) return;
                          if (!isCurrentUser(id)) {
                              requestSharedProfile(id);
                              const data = sharedProfiles.get(id);
                              if (!data?.avatar) return;
                              props.source = { uri: data.avatar };
                              props.avatarSource = { uri: data.avatar };
                              props.avatarSrc = data.avatar;
                              props.avatarURL = data.avatar;
                              if (props.user) props.user = cloneSharedUser(props.user, data);
                              return;
                          }
                          const uri = mediaUri("avatarMedia");
                          if (!preview.enabled || !uri) return;
                          props.source = { uri };
                          props.avatarSource = { uri };
                          props.avatarSrc = uri;
                          props.avatarURL = uri;
                          if (props.user) props.user = cloneObject(props.user, "user");
                      });
                      diagnostics.patches += 1;
                  } catch {}
              }

              for (const component of bannerComponents) {
                  try {
                      onJsxCreate(component, (_component, rendered) => {
                          const props = rendered?.props;
                          const id = String(renderedUserId(props) || "");
                          if (!id) return;
                          if (!isCurrentUser(id)) {
                              requestSharedProfile(id);
                              const data = sharedProfiles.get(id);
                              if (!data?.banner) return;
                              props.source = { uri: data.banner };
                              props.bannerSource = { uri: data.banner };
                              props.bannerSrc = data.banner;
                              props.bannerURL = data.banner;
                              if (props.displayProfile) props.displayProfile = decorateSharedProfile(props.displayProfile, id, data);
                              if (props.profile) props.profile = decorateSharedProfile(props.profile, id, data);
                              return;
                          }
                          const uri = mediaUri("bannerMedia");
                          if (!preview.enabled || !uri) return;
                          props.source = { uri };
                          props.bannerSource = { uri };
                          props.bannerSrc = uri;
                          props.bannerURL = uri;
                          if (props.displayProfile) props.displayProfile = decorateProfileResult(props.displayProfile, id);
                          if (props.profile) props.profile = decorateProfileResult(props.profile, id);
                      });
                      diagnostics.patches += 1;
                  } catch {}
              }

              try {
                  onJsxCreate("UserProfileHeader", (_component, rendered) => {
                      const props = rendered?.props;
                      const id = String(renderedUserId(props) || "");
                      if (!id) return;
                      if (!isCurrentUser(id)) {
                          requestSharedProfile(id);
                          const data = sharedProfiles.get(id);
                          if (!data) return;
                          if (props.user) props.user = cloneSharedUser(props.user, data);
                          if (props.displayProfile) props.displayProfile = decorateSharedProfile(props.displayProfile, id, data);
                          if (props.profile) props.profile = decorateSharedProfile(props.profile, id, data);
                          return;
                      }
                      if (!preview.enabled) return;
                      if (props.user) props.user = cloneObject(props.user, "user");
                      if (props.displayProfile) props.displayProfile = decorateProfileResult(props.displayProfile, id);
                      if (props.profile) props.profile = decorateProfileResult(props.profile, id);
                  });
                  diagnostics.patches += 1;
              } catch {}
          }


          function ensurePatches() {
              if (initialized) return;
              initialized = true;
          
              const userStore = safeStore("UserStore") || findByProps("getCurrentUser", "getUser");
              diagnostics.userStore = !!userStore;
              try {
                  realCurrentUser = userStore?.getCurrentUser?.() || null;
                  currentUserId = realCurrentUser?.id || null;
              } catch {}
          
              addPatch("getCurrentUser", userStore, (args, original) => {
                  const user = original(...args);
                  realCurrentUser = user || realCurrentUser;
                  currentUserId = user?.id || currentUserId;
                  if (preview.enabled) queueSharedPublish();
                  return cloneObject(user, "user");
              });
              addPatch("getUser", userStore, (args, original) => {
                  if (!isCurrentUser(args?.[0])) return original(...args);
                  const user = original(...args);
                  realCurrentUser = user || realCurrentUser;
                  return cloneObject(user, "user");
              });
          
              const profileStore = safeStore("UserProfileStore") || findByProps("getUserProfile", "getGuildMemberProfile");
              diagnostics.profileStore = !!profileStore;
              addPatch("getUserProfile", profileStore, (args, original) => {
                  if (!isCurrentUser(args?.[0])) return original(...args);
                  return decorateProfileResult(original(...args), args?.[0]);
              });
              addPatch("getGuildMemberProfile", profileStore, (args, original) => {
                  if (!isCurrentUser(args?.[0])) return original(...args);
                  return decorateProfileResult(original(...args), args?.[0]);
              });

              try {
                  after("default", useUserProfileModule as any, (args, result) => {
                      const subject = args?.[0];
                      const id = typeof subject === "string" ? subject : subject?.userId || subject?.id;
                      return decorateProfileResult(result, id);
                  });
                  diagnostics.patches += 1;
              } catch (error: any) {
                  diagnostics.last = error?.message || "Could not connect profile view";
              }

              try {
                  after("default", useDisplayProfileModule as any, (args, result) => {
                      const subject = args?.[0];
                      const id = typeof subject === "string" ? subject : subject?.userId || subject?.id;
                      return isCurrentUser(id) ? cloneObject(result, "profile") : result;
                  });
                  diagnostics.patches += 1;
              } catch (error: any) {
                  diagnostics.last = error?.message || "Could not connect profile banner";
              }
          
              const avatarResolver = findByProps("getUserAvatarURL") || findByProps("getAvatarURL", "getDefaultAvatarURL");
              const bannerResolver = findByProps("getUserBannerURL") || findByProps("getBannerURL");
              diagnostics.avatarResolver = !!avatarResolver;
              diagnostics.bannerResolver = !!bannerResolver;
          
              for (const method of ["getUserAvatarURL", "getAvatarURL", "getGuildMemberAvatarURL", "getGuildMemberAvatarURLSimple"]) {
                  addPatch(method, avatarResolver, (args, original) => {
                      const uri = mediaUri("avatarMedia");
                      return preview.enabled && uri && requestIsCurrent(args) ? uri : original(...args);
                  });
              }
              for (const method of ["getUserAvatarSource", "getGuildMemberAvatarSource"]) {
                  addPatch(method, avatarResolver, (args, original) => {
                      const uri = mediaUri("avatarMedia");
                      return preview.enabled && uri && requestIsCurrent(args) ? { uri } : original(...args);
                  });
              }
              for (const method of ["getUserBannerURL", "getBannerURL", "getGuildMemberBannerURL"]) {
                  addPatch(method, bannerResolver, (args, original) => {
                      const uri = mediaUri("bannerMedia");
                      return preview.enabled && uri && requestIsCurrent(args) ? uri : original(...args);
                  });
              }

              connectBadgeRenderer();
              connectMediaRenderer();

              const bannerComposer = findByProps("getBanner", "getBannerColor") || findByProps("getBanner");
              addAfterPatch("getBanner", bannerComposer, (args, result) => {
                  const uri = mediaUri("bannerMedia");
                  const id = args?.[0]?.displayProfile?.userId || args?.[0]?.userId;
                  if (!preview.enabled || !uri || !result || !id || !isCurrentUser(id)) return;
                  return { ...result, bannerSrc: uri, source: { uri } };
              });
          
              diagnostics.last = `Connected ${diagnostics.patches} preview hooks`;
          }
          
          function refreshPreview() {
              clearCache();
              try { safeStore("UserStore")?.emitChange?.(); } catch {}
              try { safeStore("UserProfileStore")?.emitChange?.(); } catch {}
              setTimeout(() => {
                  try {
                      if (currentUserId && realCurrentUser) {
                          FluxDispatcher.dispatch({ type: "USER_UPDATE", user: realCurrentUser });
                      }
                  } catch (error: any) {
                      diagnostics.last = error?.message || "Preview saved; reopen the profile to refresh";
                  }
              }, 0);
          }

          export function initializeFakeProfile() {
              if (initPromise) return initPromise;
              initPromise = (async () => {
                  try {
                      await awaitStorage(settings);
                      bindSavedPreview();
                      ensurePatches();
                      if (preview.enabled) { refreshPreview(); queueSharedPublish(); }
                  } catch (error: any) {
                      diagnostics.last = error?.message || "Could not restore Fake Profile";
                      initPromise = null;
                  }
              })();
              return initPromise;
          }
          
          async function getImageSize(uri: string, asset: any) {
              if (asset?.width && asset?.height) return { width: Number(asset.width), height: Number(asset.height) };
              return await new Promise<{ width: number; height: number }>((resolve, reject) => {
                  Image.getSize(uri, (width, height) => resolve({ width, height }), reject);
              });
          }

          async function normalizeMedia(key: "avatarMedia" | "bannerMedia", asset: any) {
              const sourceUri = asset?.fileCopyUri || asset?.uri;
              const name = String(asset?.fileName || asset?.name || "Selected image");
              const type = String(asset?.type || "").toLowerCase();
              if (!sourceUri) throw new Error("No image was selected.");
              if (type && !type.startsWith("image/")) throw new Error("Choose a picture or GIF.");

              const animated = type.includes("gif") || /\.gif(?:$|\?)/i.test(name) || /\.gif(?:$|\?)/i.test(sourceUri);
              let size = { width: Number(asset?.width || 0), height: Number(asset?.height || 0) };
              try { size = await getImageSize(sourceUri, asset); } catch {}

              const target = key === "bannerMedia" ? { width: 600, height: 240 } : { width: 512, height: 512 };
              const sourceRatio = size.width && size.height ? size.width / size.height : target.width / target.height;
              const targetRatio = target.width / target.height;
              let uri = sourceUri;
              let normalized = Math.abs(sourceRatio - targetRatio) < 0.01;

              if (!animated && size.width > 0 && size.height > 0 && !normalized) {
                  const crop = sourceRatio > targetRatio
                      ? { offset: { x: Math.round((size.width - size.height * targetRatio) / 2), y: 0 }, size: { width: Math.round(size.height * targetRatio), height: size.height } }
                      : { offset: { x: 0, y: Math.round((size.height - size.width / targetRatio) / 2) }, size: { width: size.width, height: Math.round(size.width / targetRatio) } };
                  try {
                      const editor = findByProps("cropImage") as any;
                      const result = await editor?.cropImage?.(sourceUri, { ...crop, displaySize: target, resizeMode: "cover" });
                      const output = typeof result === "string" ? result : result?.uri;
                      if (output) { uri = output; normalized = true; }
                  } catch {}

                  if (!normalized) {
                      try {
                          const manipulator = findByProps("manipulateAsync") as any;
                          const result = await manipulator?.manipulateAsync?.(sourceUri, [
                              { crop: { originX: crop.offset.x, originY: crop.offset.y, width: crop.size.width, height: crop.size.height } },
                              { resize: target }
                          ]);
                          if (result?.uri) { uri = result.uri; normalized = true; }
                      } catch {}
                  }
              }

              const label = key === "bannerMedia" ? "Banner" : "Profile picture";
              diagnostics.last = animated
                  ? `${label} animation preserved and fitted in preview`
                  : normalized ? `${label} resized to ${target.width} x ${target.height}` : `${label} fitted to ${target.width} x ${target.height} in preview`;
              return { uri, name, type, width: target.width, height: target.height, normalized };
          }

          async function saveMedia(key: "avatarMedia" | "bannerMedia", asset: any) {
              preview[key] = await normalizeMedia(key, asset);
              refreshPreview();
              queueSharedPublish();
          }
          
          async function pickFile(key: "avatarMedia" | "bannerMedia") {
              const picker = findByProps("pickSingle", "isCancel") as any;
              if (!picker?.pickSingle) throw new Error("The system file picker is unavailable.");
              try {
                  const asset = await picker.pickSingle({
                      type: picker.types?.images || "image/*",
                      mode: "import",
                      copyTo: "documentDirectory"
                  });
                  if (asset) await saveMedia(key, asset);
                  return !!asset;
              } catch (error) {
                  if (picker.isCancel?.(error)) return false;
                  throw error;
              }
          }
          
          async function pickPhoto(key: "avatarMedia" | "bannerMedia") {
              const picker = findByProps("launchImageLibrary") as any;
              if (!picker?.launchImageLibrary) return pickFile(key);
              const result: any = await new Promise((resolve, reject) => {
                  try {
                      const returned = picker.launchImageLibrary({
                          mediaType: "photo",
                          selectionLimit: 1,
                          includeBase64: false,
                          assetRepresentationMode: "current"
                      }, resolve);
                      if (returned?.then) returned.then(resolve, reject);
                  } catch (error) { reject(error); }
              });
              if (result?.didCancel) return false;
              if (result?.errorCode) throw new Error(result.errorMessage || "The photo picker failed.");
              const asset = result?.assets?.[0];
              if (asset) await saveMedia(key, asset);
              return !!asset;
          }
          
          function ActionButton({ label, onPress, muted = false }: { label: string; onPress: () => void; muted?: boolean }) {
              return (
                  <Pressable onPress={onPress} style={({ pressed }) => ({ width: "100%", minHeight: 48, paddingHorizontal: 14, paddingVertical: 12, borderRadius: 11, alignItems: "center", justifyContent: "center", backgroundColor: muted ? "#243c46" : "#50fa9b", opacity: pressed ? 0.72 : 1 })}>
                      <Text variant="text-sm/bold" style={{ color: muted ? "#78e7ff" : "#10251a", textAlign: "center" }}>{label}</Text>
                  </Pressable>
              );
          }

          function ToggleRow({ label, subLabel, value, onPress, accent = false }: { label: string; subLabel?: string; value: boolean; onPress: () => void; accent?: boolean }) {
              return (
                  <Pressable onPress={onPress} style={({ pressed }) => ({ width: "100%", minHeight: 58, flexDirection: "row", alignItems: "center", paddingHorizontal: 12, paddingVertical: 10, borderRadius: 11, backgroundColor: pressed ? "rgba(80,250,155,0.16)" : "rgba(255,255,255,0.04)", opacity: pressed ? 0.8 : 1 })}>
                      <View style={{ flex: 1, minWidth: 0, paddingRight: 10 }}>
                          <Text variant="text-sm/bold" style={{ color: accent ? "#50fa9b" : "#f0f3f6" }}>{label}</Text>
                          {subLabel ? <Text variant="text-xs/medium" color="text-muted" style={{ marginTop: 3 }}>{subLabel}</Text> : null}
                      </View>
                      <View style={{ width: 48, height: 28, borderRadius: 14, padding: 3, alignItems: value ? "flex-end" : "flex-start", backgroundColor: value ? "#50fa9b" : "#4b4f58" }}>
                          <View style={{ width: 22, height: 22, borderRadius: 11, backgroundColor: value ? "#10251a" : "#d4d7dc" }} />
                      </View>
                  </Pressable>
              );
          }

          function DurationSelect({ label, value, onPress }: { label: string; value: number; onPress: () => void }) {
              return (
                  <Pressable onPress={onPress} style={({ pressed }) => ({ width: "100%", minHeight: 58, flexDirection: "row", alignItems: "center", paddingHorizontal: 12, paddingVertical: 10, borderRadius: 11, backgroundColor: pressed ? "rgba(120,231,255,0.16)" : "rgba(255,255,255,0.04)" })}>
                      <View style={{ flex: 1, minWidth: 0, paddingRight: 12 }}>
                          <Text variant="text-sm/bold" style={{ color: "#50fa9b" }}>{label}</Text>
                          <Text variant="text-xs/medium" color="text-muted" style={{ marginTop: 3 }}>Profile appearance</Text>
                      </View>
                      <View style={{ maxWidth: "48%", flexDirection: "row", alignItems: "center", gap: 7, paddingHorizontal: 10, paddingVertical: 7, borderRadius: 9, backgroundColor: "#243c46" }}>
                          <Text variant="text-xs/bold" style={{ color: "#78e7ff" }} numberOfLines={1}>{durationLabel(value)}</Text>
                          <Text variant="text-sm/bold" style={{ color: "#78e7ff" }}>v</Text>
                      </View>
                  </Pressable>
              );
          }
          
          export default function FakeProfile() {
              useProxy(settings);
              const [, redraw] = useReducer(value => value + 1, 0);
          
              useEffect(() => {
                  initializeFakeProfile();
                  redraw();
              }, []);
          
              const update = (key: keyof PreviewSettings, value: any, refresh = false) => {
                  (preview as any)[key] = value;
                  clearCache();
                  if (refresh) refreshPreview();
                  queueSharedPublish();
                  redraw();
              };
          
              const choose = async (key: "avatarMedia" | "bannerMedia", source: "photo" | "file") => {
                  try {
                      if (await (source === "photo" ? pickPhoto(key) : pickFile(key))) redraw();
                  } catch (error: any) {
                      diagnostics.last = error?.message || "Could not open the picker.";
                      redraw();
                      Alert.alert("FakeProfile", diagnostics.last);
                  }
              };

              const clearMedia = (field: "avatarMedia" | "bannerMedia") => {
                  try {
                      (preview as any)[field] = null;
                      clearCache();
                      diagnostics.last = field === "bannerMedia" ? "Banner cleared" : "Profile picture cleared";
                      redraw();
                      refreshPreview();
                      queueSharedPublish();
                  } catch (error: any) {
                      diagnostics.last = error?.message || "Could not clear the image";
                      redraw();
                  }
              };

              const chooseDuration = (field: "nitroMonths" | "boostMonths", title: string, values: number[]) => {
                  const key = field === "nitroMonths" ? "FakeProfileNitroDuration" : "FakeProfileBoostDuration";
                  try {
                      simpleSheets.showSimpleActionSheet({
                          key,
                          header: {
                              title,
                              onClose: () => simpleSheets.hideActionSheet?.(key)
                          },
                          options: values.map(months => ({
                              label: durationLabel(months),
                              onPress: () => {
                                  update(field, months, true);
                                  diagnostics.last = `${title}: ${durationLabel(months)}`;
                                  simpleSheets.hideActionSheet?.(key);
                              }
                          }))
                      });
                  } catch (error: any) {
                      diagnostics.last = error?.message || `Could not open ${title.toLowerCase()}`;
                      redraw();
                  }
              };
          
              const MediaEditor = ({ label, field, banner = false }: { label: string; field: "avatarMedia" | "bannerMedia"; banner?: boolean }) => {
                  const value = preview[field];
                  return (
                      <View style={{ width: "100%", gap: 9, marginBottom: 16 }}>
                          <Text variant="heading-sm/semibold" style={{ color: "#50fa9b" }}>{label}</Text>
                          <Text variant="text-xs/medium" style={{ color: "#78e7ff" }}>{banner ? "Automatically fitted to 600 x 240" : "Automatically fitted to a square"}</Text>
                          <View style={{ width: "100%", gap: 8 }}>
                              <ActionButton label="Choose picture" onPress={() => void choose(field, "photo")} />
                              <ActionButton label="Choose file or GIF" muted onPress={() => void choose(field, "file")} />
                          </View>
                          {value?.uri && (
                              <View style={{ width: "100%", borderRadius: 12, overflow: "hidden", backgroundColor: "#1f2023" }}>
                                  <View style={banner ? { width: "100%", aspectRatio: 2.5, overflow: "hidden" } : { width: 104, height: 104, borderRadius: 52, overflow: "hidden", alignSelf: "center", marginVertical: 12 }}>
                                      <Image source={{ uri: value.uri }} resizeMode="cover" style={{ width: "100%", height: "100%" }} />
                                  </View>
                                  <View style={{ flexDirection: "row", alignItems: "center", padding: 10, gap: 8 }}>
                                      <Text variant="text-xs/medium" color="text-muted" numberOfLines={1} style={{ flex: 1 }}>{value.name}</Text>
                                      <Pressable onPress={() => clearMedia(field)} style={{ paddingHorizontal: 10, paddingVertical: 6, borderRadius: 7, backgroundColor: "#4a2024" }}>
                                          <Text variant="text-xs/bold" style={{ color: "#ff7b84" }}>Clear</Text>
                                      </Pressable>
                                  </View>
                              </View>
                          )}
                      </View>
                  );
              };
          
              const avatar = mediaUri("avatarMedia");
