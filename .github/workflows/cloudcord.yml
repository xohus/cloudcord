              const option = (id: string) => ({ label: isRealProfileView(id) ? "Show CloudCord profile" : "Show real profile", onPress: () => toggleRealProfileView(id) });
              if (typeof simpleSheets?.showSimpleActionSheet === "function") {
                  instead("showSimpleActionSheet", simpleSheets, (args: any[], original: Function) => {
                      const sheet = args[0];
                      const id = String(sheet?.userId || sheet?.user?.id || sheet?.props?.userId || sheet?.props?.user?.id || "");
                      if (!/^\d{15,22}$/.test(id) || isCurrentUser(id) || !/user|profile/i.test(String(sheet?.key || "")) || !Array.isArray(sheet?.options)) return original(...args);
                      return original({ ...sheet, options: [...sheet.options, option(id)] }, ...args.slice(1));
                  });
              }
              for (const name of ["UserProfileOverflowMenu", "UserProfileOverflowActionSheet", "UserProfileMoreActionSheet"]) {
                  onJsxCreate(name, (_component, rendered) => {
                      const props: any = rendered?.props;
                      const id = String(props?.userId || props?.user?.id || props?.profile?.userId || "");
                      if (!/^\d{15,22}$/.test(id) || isCurrentUser(id) || props?.__cloudcordRealProfileMenu) return rendered;
                      if (Array.isArray(props?.options)) return cloneElement(rendered, { __cloudcordRealProfileMenu: true, options: [...props.options, option(id)] });
                      if (!props?.children) return rendered;
                      return cloneElement(rendered, { __cloudcordRealProfileMenu: true, children: [props.children, createElement(TableRow, { key: "cloudcord-profile-view", label: option(id).label, onPress: option(id).onPress })] });
