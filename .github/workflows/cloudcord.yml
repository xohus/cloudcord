          import { findByNameLazy, findByProps, findByStoreName } from "@metro";
          import { FluxDispatcher, NavigationNative } from "@metro/common";
          import { Card, Text } from "@metro/common/components";
          import { useEffect, useReducer, useState } from "react";
          import { Alert, Image, NativeModules, Pressable, ScrollView, TextInput, View } from "react-native";

          type MediaValue = { uri: string; name: string; type: string; width?: number; height?: number; normalized?: boolean } | null;
          type PreviewSettings = {
              enabled: boolean;
