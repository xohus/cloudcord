name: Repack CloudCord iOS 331

"on":
  workflow_dispatch:
  workflow_run:
    workflows:
      - Build CloudCord Runtime
    types:
      - completed

permissions:
  contents: write

jobs:
  repack:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current runtime
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download stable Discord 331 package
        run: |
          curl --fail --location --retry 5 --retry-all-errors \
            --output cloudcord-331-old.ipa \
            https://github.com/xohus/cloudcord/releases/download/ios-legacy-331/cloudcord0-331.ipa

      - name: Embed current CloudCord runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          import zipfile

          source = Path("cloudcord-331-old.ipa")
          output = Path("cloudcord0-331.ipa")
          runtime = Path("dist/cc.js").read_bytes()
          resource = "Payload/Discord.app/BunnyResources.bundle/runtime.js"

          with zipfile.ZipFile(source, "r") as old, zipfile.ZipFile(
              output, "w", zipfile.ZIP_DEFLATED, compresslevel=6
          ) as new:
              names = set(old.namelist())
              if resource not in names:
                  raise RuntimeError(f"Stable IPA is missing {resource}")
              info_name = next(name for name in names if name.startswith("Payload/") and name.endswith(".app/Info.plist"))
              info = plistlib.loads(old.read(info_name))
              if info.get("CFBundleShortVersionString") != "331.0" or info.get("CFBundleVersion") != "102199":
                  raise RuntimeError("Stable IPA is not Discord 331.0 (102199)")
              for item in old.infolist():
                  if item.filename != resource:
                      new.writestr(item, old.read(item.filename))
              new.writestr(resource, runtime)
          PY

          unzip -p cloudcord0-331.ipa Payload/Discord.app/BunnyResources.bundle/runtime.js \
            | grep -q '__CLOUDCORD_331_ROOT_SETTINGS__'
          test "$(unzip -p cloudcord0-331.ipa Payload/Discord.app/BunnyResources.bundle/runtime.js | wc -c)" \
            -eq "$(wc -c < dist/cc.js)"

      - name: Publish refreshed stable IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ios-legacy-331 cloudcord0-331.ipa --clobber

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudCord-iOS-331
          path: cloudcord0-331.ipa
