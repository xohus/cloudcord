          }
          let leavingServers = false;
          function confirmLeaveAllServers() {
              const me = (findByStoreName("UserStore") as any)?.getCurrentUser?.()?.id;
              const guilds = Object.values((findByStoreName("GuildStore") as any)?.getGuilds?.() ?? {}).filter((guild: any) => guild && guild.ownerId !== me) as any[];
              if (!guilds.length) { Alert.alert("Leave all servers", "No servers to leave. Servers you own are skipped."); return; }
              const run = async () => {
                  if (leavingServers) return; leavingServers = true;
                  const http = extrasHttp(); let left = 0;
                  try {
                      for (const guild of guilds) {
                          for (let attempt = 0; attempt < 3; attempt++) {
                              try { await http.del({ url: "/users/@me/guilds/" + guild.id, body: { lurking: false } }); left++; break; } catch (error: any) {
                                  const retry = Number(error?.body?.retry_after);
