          cat > src/core/ui/settings/components/ScaledPluginSettings.tsx <<'TSX'
          import type { ComponentType } from "react";
          import { ScrollView, Text, View } from "react-native";

          export default function ScaledPluginSettings({ component: Component }: { component: ComponentType<any> }) {
              if (typeof Component !== "function") {
                  return <View style={{ padding: 16 }}><Text style={{ color: "#ffffff" }}>This plugin does not provide a mobile-compatible settings component.</Text></View>;
              }
              return (
                  <ScrollView
                      style={{ flex: 1 }}
                      contentContainerStyle={{
                          paddingBottom: 90,
                          paddingHorizontal: 12
                      }}
                      showsVerticalScrollIndicator={true}
                  >
                      <View
                          style={{
                              width: "100%",
                              paddingRight: 24,
                              overflow: "visible"
                          }}
                      >
                          <Component />
                      </View>
                  </ScrollView>
              );
          }
          TSX

          cat > src/core/ui/settings/pages/StoreCloud/index.tsx <<'TSX'
          import { VdPluginManager } from "@core/vendetta/plugins";
          import { useProxy } from "@core/vendetta/storage";
          import ScaledPluginSettings from "@core/ui/settings/components/ScaledPluginSettings";
          import { findAssetId } from "@lib/api/assets";
          import { showToast } from "@lib/ui/toasts";
          import { Card, Stack, TableRow, TableRowGroup, Text } from "@metro/common/components";
          import { useState } from "react";
          import { ScrollView, View } from "react-native";

          const PLUGIN_URL = "https://revenge.nexpid.xyz/cloud-sync/";
          const STORECLOUD_ICON = "https://raw.githubusercontent.com/xohus/cloudcord/main/cloudcord-favicon.png";

          export default function StoreCloud() {
              useProxy(VdPluginManager.plugins);

              const [busy, setBusy] = useState(false);
              const [refresh, setRefresh] = useState(0);

              const plugin = VdPluginManager.plugins[PLUGIN_URL];
              const SettingsComponent = plugin?.enabled ? VdPluginManager.getSettings(PLUGIN_URL) : null;

              async function installOrStart() {
                  if (busy) return;

                  setBusy(true);

                  try {
                      if (!VdPluginManager.plugins[PLUGIN_URL]) {
                          await VdPluginManager.installPlugin(PLUGIN_URL, true);
                          showToast("StoreCloud installed", findAssetId("Check"));
                      } else if (!VdPluginManager.plugins[PLUGIN_URL].enabled) {
                          await VdPluginManager.startPlugin(PLUGIN_URL);
                          showToast("StoreCloud started", findAssetId("Check"));
                      } else {
                          showToast("StoreCloud is already enabled", findAssetId("Check"));
                      }

                      setRefresh(x => x + 1);
                  } catch (error: any) {
                      console.error("[CloudCord] StoreCloud install/start failed", error);
                      showToast(error?.message ?? "StoreCloud failed");
                  } finally {
                      setBusy(false);
                  }
              }

              async function refetchPlugin() {
                  if (busy) return;

                  setBusy(true);

                  try {
                      if (VdPluginManager.plugins[PLUGIN_URL]?.enabled) {
                          VdPluginManager.stopPlugin(PLUGIN_URL, false);
                      }

                      await VdPluginManager.fetchPlugin(PLUGIN_URL);
                      await VdPluginManager.startPlugin(PLUGIN_URL);

                      showToast("StoreCloud refreshed", findAssetId("Check"));
                      setRefresh(x => x + 1);
                  } catch (error: any) {
                      console.error("[CloudCord] StoreCloud refresh failed", error);
                      showToast(error?.message ?? "StoreCloud refresh failed");
                  } finally {
                      setBusy(false);
                  }
              }

              async function removePlugin() {
                  if (busy) return;

                  setBusy(true);

                  try {
                      if (VdPluginManager.plugins[PLUGIN_URL]) {
                          await VdPluginManager.removePlugin(PLUGIN_URL);
                      }

                      showToast("StoreCloud removed");
                      setRefresh(x => x + 1);
                  } catch (error: any) {
                      console.error("[CloudCord] StoreCloud remove failed", error);
                      showToast(error?.message ?? "StoreCloud remove failed");
                  } finally {
                      setBusy(false);
                  }
              }

              if (SettingsComponent) {
                  return <ScaledPluginSettings key={`storecloud-settings-${refresh}`} component={SettingsComponent} />;
              }

              return (
                  <ScrollView style={{ flex: 1 }} contentContainerStyle={{ paddingBottom: 38 }}>
                      <Stack style={{ paddingVertical: 24, paddingHorizontal: 12 }} spacing={24}>
                          <TableRowGroup title="CloudSync">
                              <View style={{ paddingHorizontal: 12, paddingBottom: 12 }}>
                                  <Text variant="heading-md/semibold" color="text-normal">
                                      CloudSync
                                  </Text>
                                  <Text variant="text-sm/medium" color="text-muted">
                                      Connect StoreCloud to sync supported settings and manage cloud backups on this device.
                                  </Text>
                              </View>

                              <TableRow
                                  arrow
                                  label={plugin ? "Start StoreCloud" : "Enable StoreCloud"}
                                  subLabel={busy ? "Please wait..." : "Loads the StoreCloud sync engine"}
                                  icon={<TableRow.Icon source={{ uri: STORECLOUD_ICON }} />}
                                  onPress={installOrStart}
                              />

                              {plugin && (
                                  <TableRow
                                      arrow
                                      label="Refresh StoreCloud"
                                      subLabel="Refreshes the StoreCloud sync engine"
                                      icon={<TableRow.Icon source={findAssetId("RetryIcon")!} />}
                                      onPress={refetchPlugin}
                                  />
                              )}

                              {plugin && (
                                  <TableRow
                                      arrow
                                      label="Disable StoreCloud"
                                      subLabel="Removes the StoreCloud sync engine"
                                      icon={<TableRow.Icon source={findAssetId("TrashIcon") ?? findAssetId("CircleXIcon-primary")!} />}
                                      onPress={removePlugin}
                                  />
                              )}
                          </TableRowGroup>

                          <Card border="strong">
                              <View style={{ padding: 12 }}>
                                  <Text variant="text-sm/medium" color="text-muted">
                                      StoreCloud uses the existing mobile sync engine for OAuth, settings synchronization, backups, and files.
                                  </Text>
                              </View>
                          </Card>
                      </Stack>
                  </ScrollView>
              );
          }
          TSX


