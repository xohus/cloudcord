          async function pullRealCordConfiguration() {
              if ((globalThis as any).__CLOUDCORD_LOADER__?.loaderName !== "RealCord") return;
              const reader = NativeModules.FileReaderModule ?? NativeModules.RCTFileReaderModule;
              if (typeof reader?.readAsDataURL !== "function") return;
              try {
                  const response = await reader.readAsDataURL({ rain: { method: "realcord.config", args: [] } });
                  const config = response?.result;
                  if (!config || typeof config !== "object") return;
                  const fingerprint = `${JSON.stringify(config)}:${registeredPlugins.size}`;
                  if (fingerprint === realCordConfigFingerprint) return;
                  realCordConfigFingerprint = fingerprint;
                  const username = String(config.customUsername || "").trim();
                  const displayName = String(config.customDisplayName || "").trim();
                  const tier = String(config.nitroTier || "").toLowerCase();
                  const requestedPlugins = new Set(
                      (Array.isArray(config.enabledPlugins) ? config.enabledPlugins : [])
                          .map((value: unknown) => String(value).toLowerCase().replace(/[^a-z0-9]/g, ""))
                  );
                  const next = {
                      ...preview,
                      enabled: Boolean(username || displayName || REALCORD_NITRO_MONTHS[tier]),
                      username: username || preview.username,
                      displayName: displayName || preview.displayName,
                      nitroEnabled: Boolean(REALCORD_NITRO_MONTHS[tier]),
                      nitroMonths: REALCORD_NITRO_MONTHS[tier] || 0,
                      replaceBadges: true
                  } satisfies PreviewSettings;
                  if (JSON.stringify(next) !== JSON.stringify(preview)) {
                      rootSettings.fakeProfile = next;
                      preview = next;
                      refreshPreview();
                  }

                  for (const [id, manifest] of registeredPlugins) {
                      if (id === "bunny.messagefix") {
                          if (isPluginEnabled(id)) disablePlugin(id);
                          realCordManagedPlugins.delete(id);
                          continue;
                      }
                      const normalizedId = id.toLowerCase().replace(/[^a-z0-9]/g, "");
                      const normalizedName = String((manifest as any)?.display?.name || (manifest as any)?.name || "").toLowerCase().replace(/[^a-z0-9]/g, "");
                      const requested = requestedPlugins.has(normalizedId) || requestedPlugins.has(normalizedName);
                      try {
                          if (requested) {
                              if (!isPluginInstalled(id)) await installPlugin(id, true);
                              else if (!isPluginEnabled(id)) await enablePlugin(id, true);
                              realCordManagedPlugins.add(id);
                          } else if (realCordManagedPlugins.has(id) && isPluginEnabled(id)) {
                              disablePlugin(id);
                              realCordManagedPlugins.delete(id);
                          }
                      } catch (error) {
                          console.warn(`[RealCord] Could not apply mobile plugin ${id}`, error);
                      }
                  }
              } catch (error: any) {
                  diagnostics.last = error?.message || "Could not read RealCord profile configuration";
              }
          }

