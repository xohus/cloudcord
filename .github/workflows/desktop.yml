name: CloudCord Desktop

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout CloudCord
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: desktop/client/installer/go.mod
          cache-dependency-path: desktop/client/installer/go.sum

      - name: Install Windows compiler tools
        shell: pwsh
        run: |
          choco install mingw --no-progress -y
          Add-Content $env:GITHUB_PATH "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin"
          Add-Content $env:GITHUB_PATH "C:\ProgramData\mingw64\mingw64\bin"

      - name: Install desktop dependencies
        working-directory: desktop/client
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: desktop/client
        run: pnpm typecheck

      - name: Build desktop runtime
        working-directory: desktop/client
        run: pnpm build

      - name: Package runtime for the installer
        working-directory: desktop/client
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "dist/desktop")) {
            throw "dist/desktop was not produced"
          }

          pnpm exec asar pack dist/desktop dist/desktop.asar
          New-Item -ItemType Directory -Force -Path installer/bundled | Out-Null
          Copy-Item -LiteralPath dist/desktop.asar -Destination installer/bundled/desktop.asar -Force

      - name: Build CloudCord Setup
        working-directory: desktop/client/installer
        shell: pwsh
        env:
          CGO_ENABLED: "1"
        run: |
          go test -tags cli ./...
          go build -trimpath -ldflags "-s -w -H windowsgui -X sinlotl/buildinfo.InstallerTag=new_beta_t_desktop -X sinlotl/buildinfo.InstallerGitHash=${{ github.sha }}" -o ../dist/cloudcord.exe .
          go build -trimpath -tags cli -ldflags "-s -w -X sinlotl/buildinfo.InstallerTag=new_beta_t_desktop -X sinlotl/buildinfo.InstallerGitHash=${{ github.sha }}" -o ../dist/cloudcord-cli.exe .

      - name: Smoke test installer
        working-directory: desktop/client
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "dist/cloudcord.exe")) {
            throw "cloudcord.exe was not produced"
          }

          & "dist/cloudcord-cli.exe" --version
          if ($LASTEXITCODE -ne 0) {
            throw "CloudCordSetup CLI smoke test failed with exit code $LASTEXITCODE"
          }

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudCordDesktop-Windows
          if-no-files-found: error
          path: |
            desktop/client/dist/cloudcord.exe
            desktop/client/dist/cloudcord-cli.exe
            desktop/client/dist/desktop.asar
            desktop/client/CREDITS.md
            desktop/client/CLOUDCORD_NOTES.md
            desktop/README.md

