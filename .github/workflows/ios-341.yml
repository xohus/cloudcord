name: Build CloudCord iOS 344.1

permissions:
  contents: write

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build CloudCord Runtime"]
    types: [completed]
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ios-341.yml"
      - "ios/native-ios/**"
      - "ios/rain-original/**"
      - "ios/runtime/**"
      - "dist/cc.js"
      - "ios/scripts/package-cloudcord-ipa.py"

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    # Repackage whenever the verified 344-compatible runtime changes.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify original Rain loader and CloudCord adapter
        run: |
          node ios/scripts/test-original-rain.cjs

      - name: Install signing tools
        run: brew install ldid

      - name: Download private Discord 344.1 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ios-base-344 \
            --repo xohus/cloudcord \
            --pattern Discord-344.1-base.ipa \
            --output Discord-344.1-base.ipa

      - name: Build file-only CloudCord adapter
        run: |
          xcrun --sdk iphoneos clang -arch arm64 -fobjc-arc -dynamiclib \
            -miphoneos-version-min=14.0 -framework Foundation \
            -install_name @executable_path/Frameworks/CloudCordBootstrap.dylib \
            ios/rain-original/CloudCordBootstrap.m -o CloudCordBootstrap.dylib

      - name: Package Discord 344.1 IPA
        run: |
          python3 ios/scripts/package-cloudcord-ipa.py \
            --discord-ipa Discord-344.1-base.ipa \
            --discord-version 344.1 \
            --rain-loader ios/rain-original/RainTweak.dylib.b64 \
            --rain-bootstrap CloudCordBootstrap.dylib \
            --runtime-js dist/cc.js \
            --output cloudcord0.ipa
          unzip -p cloudcord0.ipa Payload/Discord.app/Info.plist | grep -q '<string>344.1</string>'
          python3 ios/scripts/verify-original-rain-ipa.py cloudcord0.ipa
          unzip -p cloudcord0.ipa Payload/Discord.app/BunnyResources.bundle/runtime.js | grep -q 'CloudCord'
          unzip -l cloudcord0.ipa | grep -q 'Payload/Discord.app/PlugIns/BroadcastUpload.appex/BroadcastUpload'

      - uses: actions/upload-artifact@v4
        with:
          name: CloudCord-iOS-344.1
          path: cloudcord0.ipa

      - name: Package startup diagnostic IPA
        run: |
          python3 ios/scripts/package-cloudcord-ipa.py \
            --discord-ipa Discord-344.1-base.ipa \
            --discord-version 344.1 \
            --rain-loader ios/rain-original/RainTweak.dylib.b64 \
            --rain-bootstrap CloudCordBootstrap.dylib \
            --runtime-js dist/cc.js \
            --startup-diagnostics \
            --output cloudcord-diagnostics.ipa

      - name: Publish CloudCord iOS 344.1 test download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          name: CloudCord 344.1 Testing
          prerelease: true
          make_latest: false
          files: |
            cloudcord0.ipa
            cloudcord-diagnostics.ipa
